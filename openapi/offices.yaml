                  type: string
                  description: 'The website to allocate. From [List websites](/docs/api-reference/offices/tenant-libraries/listTenantWebsites).'
              required: [websiteId]
      responses:
        '201':
          description: Allocated.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          description: '`websiteId` is missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    success: false
