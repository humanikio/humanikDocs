openapi: 3.1.0

info:
  title: HumanikOS API — Offices
  version: v1
  summary: Create an AI employee's workplace and attach everything it needs to do work.
  description: |
    An office is the isolated machine one AI employee runs on. It has its own
    filesystem, its own vault, and its own identity. Everything an employee can
    reach is attached to its office.

    Every fact in this document is resolved from `hos-api` source. Endpoints
    whose request or response shape has not yet been verified are absent rather
    than guessed at.

# `servers` is injected at load time from NEXT_PUBLIC_HOS_API_URL.
# See src/lib/openapi.ts. Do not add a host here.


security:
  - ServiceAccountKey: []

tags:
  - name: Offices
    description: Create, read, update, and delete an office.
  - name: Integrations
    description: |
      The software an employee can use, and the secrets behind it. An integration
      is a host, an auth scheme and a credential reference. Each endpoint it
      declares becomes a tool the employee calls by name; one that declares none
      is still reachable through `hos_integration_request`. The office attaches
      the credential, so no key enters the conversation. See
      [Integrations and secrets](/docs/integrations).
  - name: Skills
    description: |
      What an employee can do. Skills follow the open
      [Agent Skills](https://agentskills.io/) layout: a directory per skill, a
      `SKILL.md` with YAML frontmatter, and a markdown body. See
      [Skills and protocols](/docs/skills-and-protocols) for what we share with
      the specification and what is ours, and
      [Integration skills](/docs/integrations/skills) for the ones generated from
      a connection.
  - name: Protocols
    description: |
      What an employee must always do. Where a skill is a capability it reaches
      for, a protocol applies to everything it does. Loaded at boot, so a change
      needs a restart.
  - name: Allocations
    description: The data, sites, apps, and browsers an office may reach.
  - name: Identity
    description: The office's service account, its keys, and what it may do.
  - name: Tenant libraries
    description: Shared integration templates and website assets that offices draw from.
  - name: Machine
    description: Size, idle timeout, running instances, and logs.
  - name: Model provider
    description: Which model account or machine an office runs its thinking on.
  - name: Environment secrets
    description: The office's own vault, injected at boot.

components:
  securitySchemes:
    ServiceAccountKey:
      type: http
      scheme: bearer
      description: |
        A service account API key, sent whole as a bearer token:
        `hsk_<40 hex>.hss_<64 hex>`. The `hsk_` half identifies the key and is
        safe to log. The `hss_` half authenticates it.

  parameters:
    WorkspaceId:
      name: workspaceId
      in: query
      required: true
      description: |
        Required unless the caller's key already carries a workspace scope.
        Omitting it in that case returns 400.
      schema:
        type: string
        examples: [ws_a1b2c3]

    OfficeId:
      name: officeId
      in: path
      required: true
      description: The office to act on.
      schema:
        type: string
        examples: [off_9c1e7d]

  schemas:
    MachineActionResult:
      type: object
      properties:
        success: { type: boolean, const: true }
        status:
          type: string
          description: Where the machine is in its lifecycle.
        message: { type: string }

    Error:
      type: object
      description: |
        The failure envelope. `error` is a human readable string, not a stable
        machine code. Branch on the HTTP status, not on this value.
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
          description: Human readable. Wording can change between releases.
        message:
          type: string
          description: Optional detail.
      required: [success, error]

    Forbidden:
      type: object
      description: A permission denial, naming the action and resource that were wanted.
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
          const: Forbidden
        message:
          type: string
          description: The decision reason.
        action:
          type: string
          examples: [office:manage]
        resource:
          type: string
          examples: [workspace/ws_a1b2c3/office/off_dispatch]
      required: [success, error]

    Office:
      type: object
      properties:
        id:
          type: string
          examples: [off_9c1e7d]
        name:
          type: string
          examples: [Dispatch]
        workspaceId:
          type: string
          examples: [ws_a1b2c3]
      required: [id, name]

    ToolParameter:
      type: object
      description: |
        One argument on a declared endpoint. The key in the `parameters` map is
        the parameter's name.
      properties:
        type:
          type: string
          description: JSON type of the value, for example `string` or `integer`.
          examples: [string]
        required:
          type: boolean
          default: false
        description:
          type: string
          description: What the value is. The employee reads this to fill it in.
        in:
          type: string
          enum: [path, query, header, body]
          description: |
            **Where the value goes on the wire.** Required. A parameter without
            it is rejected with a 400, because a parameter that reached storage
            without one would be dropped when the request was built: the call
            would go out missing that value and nothing would report it.
      required: [type, in]

    IntegrationTool:
      type: object
      description: |
        A declared endpoint. Each one becomes a tool the employee can call by
        name, carrying its own parameter schema. An integration with none is
        still reachable through `hos_integration_request`, but the employee is
        working from paths nobody confirmed. See
        [Integration skills](/docs/integrations/skills).
      properties:
        toolName:
          type: string
          description: |
            What the employee calls. Unique within the integration: a duplicate
            is rejected rather than shadowing its twin.
          examples: [acme_get_invoice]
        description:
          type: string
          description: |
            What the endpoint does. This is what the employee decides with, so
            say when to use it, not just what it is.
          examples: [Fetch one invoice by id]
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
        path:
          type: string
          description: |
            A path, not a URL. The host comes from `baseUrl`. Placeholders in
            braces are filled from parameters declared `in: path`.
          examples: ['/v1/invoices/{invoiceId}']
        parameters:
          type: object
          description: Keyed by parameter name.
          additionalProperties:
            $ref: '#/components/schemas/ToolParameter'
        enabled:
          type: boolean
          default: true
          description: |
            Defaults to true. Only an enabled endpoint becomes a callable tool,
            and `enabledToolCount` on the integration counts these.
      required: [toolName, description, method, path]

    Integration:
      type: object
      properties:
        id:
          type: string
          examples: [int_7d3a1f]
        name:
          type: string
          examples: [Stripe]
        baseUrl:
          type: string
          examples: [https://api.stripe.com]
        authType:
          type: string
          enum: [none, api_key, bearer, basic]
          description: |
            How the integration authenticates. Anything other than `none`
            requires `credentials` on create.
        tools:
          type: array
          description: The declared endpoints, each a callable tool.
          items:
            $ref: '#/components/schemas/IntegrationTool'
        enabledToolCount:
          type: integer
          description: 'How many of `tools` have `enabled` set true.'
      required: [id, name, baseUrl, authType]

    Skill:
      type: object
      properties:
        id:
          type: string
          description: Same as `name`. The name is the document ID.
          examples: [reconcile-orders]
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
          maxLength: 100
          description: Silently truncated to 100 characters on write.
        emoji:
          type: string
        source:
          type: string
          enum: [integration, custom, system]
          description: |
            Where the skill came from. `integration` is generated from an
            integration, `custom` is yours, `system` is platform provided.
        sourceRef:
          type: string
        content:
          type: string
        contentSource:
          type: string
          enum: [generated, manual, verified]
          default: generated
          description: |
            Records where the body came from. `manual` and `verified` are locked
            against automatic overwrite by integration sync. They are NOT locked
            against an explicit regenerate call.
        requiresEnv:
          type: array
          items:
            type: string
        requiresBins:
          type: array
          items:
            type: string
        userInvocable:
          type: boolean
          default: true
        modelInvocable:
          type: boolean
          default: true
        status:
          type: string
          examples: [active]
      required: [id, name, displayName, description, source, content]

    Protocol:
      type: object
      properties:
        id:
          type: string
          examples: [confirm-before-refunding]
        name:
          type: string
        description:
          type: string
        emoji:
          type: string
        content:
          type: string
        skillNames:
          type: array
          items:
            type: string
          default: []
          description: Scopes the protocol to specific skills. Empty means it applies to everything.
        priority:
          type: integer
          default: 10
          description: Lower runs earlier.
        status:
          type: string
          examples: [active]
      required: [id, name, content]

  responses:
    BadRequest:
      description: The request is malformed or a required field is missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingWorkspace:
              summary: No workspace in query or scope
              value:
                success: false
                error: workspaceId is required

    Unauthorized:
      description: The key is missing, unknown, inactive, or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid:
              value:
                success: false
                error: Invalid API key

    Forbidden:
      description: Authenticated, but the service account lacks the required permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Forbidden'

    NotFound:
      description: |
        No such resource, or it belongs to another tenant. Both cases return 404
        so that a denial cannot be used to confirm a resource exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    RateLimited:
      description: Too many requests. Wait for `retryAfter` seconds.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                const: false
              error:
                type: string
                const: Rate limit exceeded
              message:
                type: string
              retryAfter:
                type: integer
              timestamp:
                type: string
                format: date-time

    ServerError:
      description: Server side failure. Safe to retry with backoff.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /offices:
    get:
      tags: [Offices]
      summary: List offices
      operationId: listOffices
      description: |
        Lists offices in the workspace.

        **This endpoint has no permission gate, deliberately.** An identity
        scoped to a single office holds no workspace level permission, so a
        workspace gate would deny it and the product would appear empty. The
        endpoint lists every office and filters per row against what the caller
        can read. That filter is the access control.

        The response is already the caller's view. Two identities in the same
        workspace can legitimately receive different lists, and a shorter list
        is not an error.

        There is no pagination. The whole permitted collection is returned.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The offices this caller may read.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  offices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Office'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Offices]
      summary: Create an office
      operationId: createOffice
      description: |
        Creates an office and provisions the infrastructure behind it. The
        workspace comes from the caller's selected scope rather than the body.

        One call sets up five things: the office record, the data plane side, a
        container project, a container service, and an office API key.

        **Steps three to five fail soft.** A failure there logs a warning rather
        than failing the request, so the office existing does not mean the office
        is ready. After creating one, check `cloud-config` and `api-keys` before
        assuming it can run. The repair path for a key that failed to mint is
        `POST /offices/{officeId}/api-keys/provision`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Display name.
                  examples: [Dispatch]
                officeId:
                  type: string
                  description: Use a specific ID rather than generating one.
              required: [name]
      responses:
        '201':
          description: The office was created. Infrastructure may still be incomplete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  office:
                    $ref: '#/components/schemas/Office'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /offices/{officeId}:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
    get:
      tags: [Offices]
      summary: Get an office
      operationId: getOffice
      description: Returns one office. Requires `office:read` at the office.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The office.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  office:
                    $ref: '#/components/schemas/Office'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

    patch:
      tags: [Offices]
      summary: Update an office
      operationId: updateOffice
      description: |
        Renames an office. Requires `office:manage` at the office.

        `name` is the only mutable field. Everything else about an office is
        changed through its own endpoints.

        Note that `workspaceId` is accepted in the **body** here, unlike most
        endpoints which read it from the query string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  examples: [Dispatch EU]
                workspaceId:
                  type: string
                  description: Read from the body on this endpoint.
              required: [name]
      responses:
        '200':
          description: The updated office.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  office:
                    $ref: '#/components/schemas/Office'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [Offices]
      summary: Delete an office
      operationId: deleteOffice
      description: |
        Deletes an office. Requires `office:manage` at the office.

        By default the machine is deleted with the office. Passing
        `keepNexusService=true` leaves infrastructure running with nothing
        pointing at it, which is useful when reusing or investigating the
        machine and a cost leak otherwise.

        Deleting an office also removes the API keys issued to it. A key revoked
        this way can still authenticate for up to five minutes while the
        validation cache expires.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: keepNexusService
          in: query
          required: false
          description: Leave the machine running rather than deleting it.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /offices/{officeId}/cloud-config:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
    get:
      tags: [Offices]
      summary: Get office cloud config
      operationId: getOfficeCloudConfig
      description: |
        Returns the machine configuration provisioned for this office. Requires
        `office:read` at the office.

        Office creation fails soft on the infrastructure steps, so an office can
        exist without a working machine. This is how you check. An office with no
        cloud config was created but never fully provisioned.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The office's machine configuration.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'


  /offices/{officeId}/cloud/config:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
    get:
      tags: [Machine]
      summary: Get machine configuration
      operationId: getOfficeComputeConfig
      description: |
        Returns the office's machine settings and **what may be changed**.
        Requires `instance:read` at the office.

        Three things come back together:

        | | |
        | --- | --- |
        | `userConfig` | What is set now: `instanceType`, `idleTimeoutMinutes` |
        | `serviceTypeConfig` | The tiers available to this service, and which fields are configurable |
        | Service metadata | Identity of the underlying service |

        **Read this before writing.** The available tiers depend on the service
        type and change over time, so the valid values for `instanceType` come
        from this response rather than from a list in these docs.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Current settings and the options available.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags: [Machine]
      summary: Update machine configuration
      operationId: updateOfficeComputeConfig
      description: |
        Changes the office's machine size or how long it stays awake. Requires
        `instance:manage` at the office, which is a different action from
        `office:manage`: resizing a machine is a spend decision.

        ## Changing the size

        `instanceType` selects a tier. Get the valid values from
        [Get machine configuration](/docs/api-reference/offices/machine/getOfficeComputeConfig)
        first, since they depend on the service type.

        ```bash
        curl -X PUT "$HOS_API/offices/off_9c1e7d/cloud/config?workspaceId=ws_a1b2c3" \
          -H "Authorization: Bearer $HOS_KEY" \
          -H "Content-Type: application/json" \
          -d '{ "userConfig": { "instanceType": "<a tier from the read>" } }'
        ```

        ## Ephemeral or persistent

        `idleTimeoutMinutes` decides how long an office stays awake with nothing
        to do. This is the setting that makes an office ephemeral or persistent.

        A short timeout means the machine sleeps quickly and costs nothing at
        rest, at the price of a cold start on the next job. A long one keeps it
        warm and responsive, and it is awake, and billed, the whole time.

        ```bash
        curl -X PUT "$HOS_API/offices/off_9c1e7d/cloud/config?workspaceId=ws_a1b2c3" \
          -H "Authorization: Bearer $HOS_KEY" \
          -H "Content-Type: application/json" \
          -d '{ "userConfig": { "idleTimeoutMinutes": 30 } }'
        ```

        Send either field or both. `userConfig` itself is required.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userConfig:
                  type: object
                  description: The settings to change. At least one field.
                  properties:
                    instanceType:
                      type: string
                      description: |
                        A tier from `serviceTypeConfig` on the read. Values
                        depend on the service type, so read before writing.
                    idleTimeoutMinutes:
                      type: integer
                      description: |
                        How long the office stays awake while idle. Lower is
                        cheaper and colder; higher is warmer and billed longer.
              required: [userConfig]
      responses:
        '200':
          description: Updated.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          description: '`workspaceId` or `userConfig` is missing, or the update was rejected.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noConfig:
                  value:
                    success: false
                    error: userConfig is required
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /offices/{officeId}/cloud/instances:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
    get:
      tags: [Machine]
      summary: List running instances
      operationId: listOfficeInstances
      description: |
        What is actually running for this office right now. Requires
        `instance:read` at the office.

        An office that has scaled to zero returns no instances. That is the
        normal resting state, not an error.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Running instances, if any.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /offices/{officeId}/cloud/logs:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
    get:
      tags: [Machine]
      summary: Get machine logs
      operationId: getOfficeLogs
      description: |
        Logs from the office's machine. Requires `instance:read` at the office.

        This is the first place to look when an office was created but never
        became ready, since the infrastructure steps at creation fail soft.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Log output.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /offices/{officeId}/integrations:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
    get:
      tags: [Integrations]
      summary: List integrations
      operationId: listOfficeIntegrations
      description: |
        Lists every integration on the office. Requires `office:read`.

        Rows are augmented with template status where an integration came from
        the tenant library, so an instantiated template can be told apart from a
        locally created one. No pagination.

        The response also carries `gatewayRestartNeeded`, which reports whether
        integration changes are waiting on a restart. Integration tools and
        credentials are loaded when the office boots, so a new integration, a
        changed endpoint or a rotated secret does not reach a running employee
        until it restarts. Apply them with
        [Restart an office](/docs/api-reference/offices/machine/restartOfficeMachine).
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The office's integrations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  integrations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Integration'
                  gatewayRestartNeeded:
                    type: boolean
                    description: |
                      True when changes are recorded that the running employee has
                      not loaded. False means what you are reading is in force.
                  pendingIntegrationChanges:
                    type: array
                    description: The changes waiting on a restart.
                    items:
                      type: object
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Integrations]
      summary: Create an integration
      operationId: createOfficeIntegration
      description: |
        Creates an integration manually. Requires `office:manage`.

        ## Two shapes, decided by `authType`

        | | `authType: "none"` | `api_key` · `bearer` · `basic` |
        | --- | --- | --- |
        | `credentials` | Not used | **Required** |
        | Vault write | None | A secret group is created |
        | Fails if the office has no vault | No | Yes, with a 500 |

        When `authType` is anything other than `none`, the credential values are
        written into the office vault as a secret group and the integration is
        linked to that group by reference. Credentials are stored, not echoed:
        no read endpoint returns a secret value.

        ## Declaring endpoints

        `tools` is optional and is the highest value thing in the body. Each
        entry becomes a tool the employee calls by name, carrying its own
        parameter schema. Leave it out and the integration still works: the
        employee reaches the host through `hos_integration_request`, supplying a
        path itself, which means working from paths nobody confirmed.

        **Every parameter needs an `in`.** It says where the value goes on the
        wire. A parameter without one is rejected with a 400 rather than stored,
        because a stored one would be dropped when the request was built and
        nothing would report it.

        Declared endpoints are validated before any vault work, so a bad entry
        cannot leave a half-made integration behind. On success the integration's
        skill is regenerated automatically, so a declared endpoint reaches the
        employee's document without a second call.

        ### An authenticated integration

        ```bash
        curl -X POST "$HOS_API/offices/off_9c1e7d/integrations?workspaceId=ws_a1b2c3" \
          -H "Authorization: Bearer $HOS_KEY" \
          -H "Content-Type: application/json" \
          -d '{
            "name": "Stripe",
            "baseUrl": "https://api.stripe.com",
            "authType": "bearer",
            "credentials": { "API_KEY": "sk_live_..." }
          }'
        ```

        ### An open one

        ```bash
        curl -X POST "$HOS_API/offices/off_9c1e7d/integrations?workspaceId=ws_a1b2c3" \
          -H "Authorization: Bearer $HOS_KEY" \
          -H "Content-Type: application/json" \
          -d '{
            "name": "Public status API",
            "baseUrl": "https://status.example.com",
            "authType": "none"
          }'
        ```
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  examples: [Stripe]
                baseUrl:
                  type: string
                  description: Must start with `http://` or `https://`.
                  examples: [https://api.stripe.com]
                authType:
                  type: string
                  enum: [none, api_key, bearer, basic]
                credentials:
                  type: object
                  additionalProperties:
                    type: string
                  description: |
                    Key value pairs. **Required unless `authType` is `none`.**
                  examples:
                    - API_KEY: sk_live_...
                docsUrl:
                  type: string
                  description: |
                    Link to the software's documentation. Used when generating
                    the integration's skill.
                specUrl:
                  type: string
                  description: |
                    Link to an [OpenAPI](https://www.openapis.org/) description of
                    the software. When present it is used alongside `docsUrl` to
                    generate a more accurate skill, since a machine readable
                    contract beats prose.
                tools:
                  type: array
                  description: |
                    The endpoints to declare. Optional. Each becomes a named tool
                    the employee can call.
                  items:
                    $ref: '#/components/schemas/IntegrationTool'
                  examples:
                    - - toolName: acme_get_invoice
                        description: Fetch one invoice by id
                        method: GET
                        path: /v1/invoices/{invoiceId}
                        enabled: true
                        parameters:
                          invoiceId:
                            type: string
                            required: true
                            in: path
                            description: The invoice id
              required: [name, baseUrl, authType]
      responses:
        '201':
          description: The integration was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  integration:
                    $ref: '#/components/schemas/Integration'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          description: |
            A required field is missing, `baseUrl` is malformed, or credentials
            were omitted while `authType` declares authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingFields:
                  value:
                    success: false
                    error: name, baseUrl, and authType are required
                badUrl:
                  value:
                    success: false
                    error: 'baseUrl must start with http:// or https://'
                missingCredentials:
                  value:
                    success: false
                    error: credentials are required when authType is not "none"
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: |
            The vault write failed and **the integration was not created**. An
            office whose vault was never provisioned fails here every time until
            that is repaired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noStore:
                  value:
                    success: false
                    error: Failed to configure office secrets store
                noGroup:
                  value:
                    success: false
                    error: Failed to create secret group in vault

  /offices/{officeId}/skills:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
    get:
      tags: [Skills]
      summary: List skills
      operationId: listOfficeSkills
      description: |
        Lists every skill in the office. Requires `office:read`. No pagination.

        Skills are read onto the office machine when it boots, so a new skill, or
        an edit to an existing one, does not reach a running employee until it
        restarts. Apply changes with
        [Restart an office](/docs/api-reference/offices/machine/restartOfficeMachine).

        Read `contentSource` on each row before editing one. `manual` and
        `verified` bodies are locked against automatic overwrite by integration
        sync, and a `verified` body is a procedure that was proven against the
        live API.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The office's skills.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  skills:
                    type: array
                    items:
                      $ref: '#/components/schemas/Skill'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Skills]
      summary: Create a skill
      operationId: createOfficeSkill
      description: |
        Creates a skill in an office. Requires `office:manage`.

        A skill is materialised on the office machine as
        `skills/{name}/SKILL.md`, following the open
        [Agent Skills](https://agentskills.io/specification) layout. `name` and
        `description` become its frontmatter; `content` becomes the body.

        `name` becomes the document ID, so it must be unique within the office.
        A duplicate returns 400 rather than replacing.

        **`description` is what the employee decides with.** Every skill's name
        and description are advertised to it; the body is read only when a task
        matches. Say what the skill does *and when to use it*.

        `description` is silently truncated to 100 characters. A longer string is
        accepted and shortened without an error.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Machine name, unique within the office. Becomes the document ID.
                  examples: [reconcile-orders]
                displayName:
                  type: string
                  examples: [Reconcile orders]
                description:
                  type: string
                  maxLength: 100
                  description: Silently truncated to 100 characters.
                content:
                  type: string
                  description: The skill body.
                source:
                  type: string
                  enum: [integration, custom, system]
                  description: |
                    Where the skill came from. Use `custom` for one you are
                    authoring.
                emoji:
                  type: string
                sourceRef:
                  type: string
                requiresEnv:
                  type: array
                  items:
                    type: string
                  default: []
                requiresBins:
                  type: array
                  items:
                    type: string
                  default: []
                userInvocable:
                  type: boolean
                  default: true
                modelInvocable:
                  type: boolean
                  default: true
              required: [name, displayName, description, content, source]
      responses:
        '201':
          description: The skill was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  skill:
                    $ref: '#/components/schemas/Skill'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          description: A required field is missing, the name is invalid, or the skill already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingFields:
                  value:
                    success: false
                    error: name, displayName, description, source, and content are required
                badName:
                  value:
                    success: false
                    error: name is required and must contain valid characters
                duplicate:
                  value:
                    success: false
                    error: Skill with name "reconcile-orders" already exists in this office
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /offices/{officeId}/skills/{skillId}:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
      - name: skillId
        in: path
        required: true
        description: 'The skill. From [List skills](/docs/api-reference/offices/skills/listOfficeSkills). Same value as the skill''s `name`.'
        schema:
          type: string
          examples: [reconcile-orders]
    get:
      tags: [Skills]
      summary: Get a skill
      operationId: getOfficeSkill
      description: |
        Returns one skill including its `content` body. Requires `office:read`.

        The skill ID is its `name`. Check `contentSource` before editing: sending
        `content` back stamps the skill `manual` unless you say otherwise.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The skill.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  skill:
                    $ref: '#/components/schemas/Skill'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Skills]
      summary: Update a skill
      operationId: updateOfficeSkill
      description: |
        Updates a skill. Requires `office:manage`. Only the fields you send are
        changed.

        **Sending `content` without `contentSource` stamps the skill `manual`.**
        Editing a body is treated as human authorship, which locks it against
        automatic overwrite by integration sync. Pass `contentSource` explicitly
        to opt out.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                description:
                  type: string
                  maxLength: 100
                emoji:
                  type: string
                content:
                  type: string
                  description: Sending this stamps `contentSource` as `manual` unless you set it explicitly.
                contentSource:
                  type: string
                  enum: [generated, manual, verified]
                  description: |
                    Set explicitly to override the rule above. Sending `content`
                    without this stamps the skill `manual`.
                requiresEnv:
                  type: array
                  items:
                    type: string
                requiresBins:
                  type: array
                  items:
                    type: string
                userInvocable:
                  type: boolean
                modelInvocable:
                  type: boolean
                status:
                  type: string
      responses:
        '200':
          description: The updated skill.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  skill:
                    $ref: '#/components/schemas/Skill'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags: [Skills]
      summary: Delete a skill
      operationId: deleteOfficeSkill
      description: |
        Removes the skill from the office. Requires `office:manage`.

        Deleting a skill removes instructions, not access. A skill generated from
        an integration will be written again by the next sync, and deleting it
        never revokes a credential: remove the integration or its secret
        reference for that.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400':
          description: Missing workspace, or no such skill.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    success: false
                    error: Skill not found

  /offices/{officeId}/skills/{skillId}/regenerate:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
      - name: skillId
        in: path
        required: true
        description: 'The skill. From [List skills](/docs/api-reference/offices/skills/listOfficeSkills). Same value as the skill''s `name`.'
        schema:
          type: string
    post:
      tags: [Skills]
      summary: Regenerate a skill body
      operationId: regenerateOfficeSkill
      description: |
        Re-runs generation of the skill body for an integration sourced skill.
        Returns the updated content length and token usage. Requires
        `office:manage`.

        **This overwrites a locked body.** An explicit regenerate is treated as
        an intentional override: it resets `contentSource` to `generated` first,
        which unlocks the skill, then writes. A `manual` or `verified` body is
        replaced.

        Content locking protects against automatic sync, not against this call.
        If you want to keep a proven body, do not call regenerate on it.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Regenerated.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /offices/{officeId}/protocols:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
    get:
      tags: [Protocols]
      summary: List protocols
      operationId: listOfficeProtocols
      description: |
        Lists the office's protocols. Requires `office:read`.

        The response carries `gatewayRestartNeeded`, which reports whether the
        office has protocol changes that are not live yet. Protocols are read
        into the employee's context when the office boots, so a change does not
        take effect until it restarts. Apply them with [Restart an office](/docs/api-reference/offices/machine/restartOfficeMachine).
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The office's protocols.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  protocols:
                    type: array
                    items:
                      $ref: '#/components/schemas/Protocol'
                  gatewayRestartNeeded:
                    type: boolean
                    description: True when protocol changes are pending an office restart.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Protocols]
      summary: Create a protocol
      operationId: createOfficeProtocol
      description: |
        Creates a behavioural rule injected into the employee's context.
        Requires `office:manage`.

        Where a skill is a capability the employee reaches for, a protocol
        applies to everything it does.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Becomes part of the generated ID.
                  examples: [Confirm before refunding]
                content:
                  type: string
                  description: The rule itself.
                description:
                  type: string
                emoji:
                  type: string
                skillNames:
                  type: array
                  items:
                    type: string
                  default: []
                priority:
                  type: integer
                  default: 10
                  description: Lower runs earlier.
              required: [name, content]
      responses:
        '201':
          description: The protocol was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  protocol:
                    $ref: '#/components/schemas/Protocol'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          description: A required field is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noName:
                  value:
                    success: false
                    error: name is required
                noContent:
                  value:
                    success: false
                    error: content is required
        '403':
          $ref: '#/components/responses/Forbidden'

  /offices/{officeId}/namespaces:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
    get:
      tags: [Allocations]
      summary: List allocated namespaces
      operationId: listOfficeNamespaces
      description: Lists the data namespaces this office may reach. Requires `office:read`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The office's namespace allocations.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Allocations]
      summary: Allocate a namespace
      operationId: allocateOfficeNamespace
      description: |
        Grants this office access to a data namespace. Requires `office:manage`
        at the office.

        **This endpoint is gated twice.** Beyond the route level
        `office:manage`, the handler independently evaluates
        `datasource:read` on the namespace being allocated and returns 403 if
        the caller cannot read it.

        The reason is that allocation grants an AI employee access to data. You
        cannot hand an office access to a namespace you are not permitted to see
        yourself. Like promotion, this is an action that starts in one boundary
        and lands in another, so it is gated at both ends.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                namespaceId:
                  type: string
                  examples: [ns_orders]
                  description: 'The data namespace to allocate. Get the ID from the data plane.'
                namespaceName:
                  type: string
                  examples: [Orders]
                  description: 'Display name for the allocation. Yours to choose.'
              required: [namespaceId, namespaceName]
      responses:
        '201':
          description: Allocated.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          description: A required field is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    success: false
                    error: namespaceId and namespaceName are required
        '403':
          description: |
            Either the caller lacks `office:manage` on the office, or lacks
            `datasource:read` on the namespace. The body names which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '409':
          description: The namespace is already allocated to this office.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                duplicate:
                  value:
                    success: false
                    error: Namespace already associated with this office
        '500':
          $ref: '#/components/responses/ServerError'

  /offices/{officeId}/namespaces/{namespaceId}:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
      - name: namespaceId
        in: path
        required: true
        description: 'The data namespace. Allocated ones come from [List allocated namespaces](/docs/api-reference/offices/allocations/listOfficeNamespaces); to allocate a new one, get the ID from the data plane.'
        schema:
          type: string
          examples: [ns_orders]
    get:
      tags: [Allocations]
      summary: Get an allocated namespace
      operationId: getOfficeNamespace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The allocation.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Allocations]
      summary: Deallocate a namespace
      operationId: deallocateOfficeNamespace
      description: Removes the office's access to the namespace. Requires `office:manage`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Deallocated.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /offices/{officeId}/apps:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
    get:
      tags: [Allocations]
      summary: List allocated apps
      operationId: listOfficeApps
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The office's app allocations.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Allocations]
      summary: Allocate an app
      operationId: allocateOfficeApp
      description: Grants this office access to an app. Requires `office:manage`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                appId:
                  type: string
                  description: 'The app to allocate.'
                appName:
                  type: string
                  description: 'Display name for the allocation. Yours to choose.'
              required: [appId, appName]
      responses:
        '201':
          description: Allocated.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          description: A required field is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    success: false
                    error: appId and appName are required
        '403':
          $ref: '#/components/responses/Forbidden'

  /offices/{officeId}/websites:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
    get:
      tags: [Allocations]
      summary: List allocated websites
      operationId: listOfficeWebsites
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The office's website allocations.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Allocations]
      summary: Allocate a website
      operationId: allocateOfficeWebsite
      description: |
        Allocates a website from the tenant library to this office. Requires
        `office:manage`.

        This allocates the site alone. To bring its integrations along in the
