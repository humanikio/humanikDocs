        '403':
          $ref: '#/components/responses/Forbidden'

  /offices/{officeId}/website-allocations:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
    post:
      tags: [Allocations]
      summary: Allocate a website with its integrations
      operationId: allocateOfficeWebsiteWithIntegrations
      description: |
        Allocates a website and, optionally, the integrations it needs, in one
        call. Requires `office:manage`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                websiteId:
                  type: string
                  description: 'The website to allocate. From [List websites](/docs/api-reference/offices/tenant-libraries/listTenantWebsites).'
                includeIntegrations:
                  type: array
                  items:
                    type: string
                  description: Integration IDs to allocate alongside the site.
              required: [websiteId]
      responses:
        '201':
          description: Allocated.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          description: '`websiteId` is missing, or `includeIntegrations` is not an array of strings.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    success: false
                    error: websiteId is required
                badType:
                  value:
                    success: false
                    error: includeIntegrations must be a string[]
        '403':
          $ref: '#/components/responses/Forbidden'

  /offices/{officeId}/browsers:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
    get:
      tags: [Allocations]
      summary: List allocated browsers
      operationId: listOfficeBrowsers
      description: |
        Lists the cloud browsers this office may reach. Requires `office:read`.

        **This lists browsers. It does not grant them.** Unlike namespaces,
        apps, and websites, a browser is not allocated to an office. Access is
        membership based, granted on the browser itself with
        [Grant access to a browser](/docs/api-reference/browsers/members/addBrowserMember),
        which accepts a service account key.

        That is why this tag has no matching POST or DELETE for browsers. This
        endpoint is the office side view of grants made elsewhere.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The browsers allocated to this office.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  browsers:
                    type: array
                    items:
                      type: object
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          $ref: '#/components/responses/ServerError'

  /offices/{officeId}/iam:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
    get:
      tags: [Identity]
      summary: Get the office's identity
      operationId: getOfficeIam
      description: |
        Returns the office's service account, its role assignments, and the roles
        and policies behind them.

        **Gated `office:read`, not the console's `iam:read`.** Someone
        responsible for one employee can inspect what that employee may do
        without being granted tenant wide identity visibility. Read only:
        changing a machine's permissions is still a console action.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The office's service account and its grants.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          $ref: '#/components/responses/ServerError'

  /offices/{officeId}/api-keys:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
    get:
      tags: [Identity]
      summary: List office API keys
      operationId: listOfficeApiKeys
      description: Lists the office's own service account credentials, sanitised. Requires `office:read`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The office's keys, without secrets.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Identity]
      summary: Delete the office API key
      operationId: deleteOfficeApiKey
      description: |
        Requires `office:manage`.

        Revocation is not immediate. A deleted key can keep authenticating for
        up to five minutes while the validation cache expires.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /offices/{officeId}/api-keys/cycle:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
    post:
      tags: [Identity]
      summary: Cycle the office API key
      operationId: cycleOfficeApiKey
      description: |
        Mints a replacement credential for the office. Requires `office:manage`.

        The new key is **returned once**. It is not retrievable afterwards.

        The old key keeps working for up to five minutes while the validation
        cache expires, so a cycle is not an instant cut off.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The new key. Capture it now.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /offices/{officeId}/api-keys/revoke:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
    post:
      tags: [Identity]
      summary: Revoke the office API key
      operationId: revokeOfficeApiKey
      description: |
        Requires `office:manage`. Subject to the same five minute cache window
        as every other revocation on the platform.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Revoked.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /offices/{officeId}/api-keys/provision:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
    post:
      tags: [Identity]
      summary: Provision a missing office API key
      operationId: provisionOfficeApiKey
      description: |
        The repair path for a key that failed to mint when the office was
        created. Requires `office:manage`.

        Office creation fails soft on this step, so an office can exist without
        a working credential. This is how you fix that without recreating the
        office.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '201':
          description: Provisioned.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /offices/{officeId}/environment/secrets:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
    get:
      tags: [Environment secrets]
      summary: List secret groups
      operationId: listOfficeSecrets
      description: |
        Lists the secret groups in the office's vault. Requires `secrets:read`
        at the office.

        Group names only. No field values are returned by this endpoint.
      responses:
        '200':
          description: The office's secret groups.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          description: The office has no vault provisioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noService:
                  value:
                    success: false
                    error: No service ID available for office
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Environment secrets]
      summary: Create a secret group
      operationId: createOfficeSecret
      description: |
        Creates an empty secret group. Requires `secrets:write` at the office.

        A group holds named fields. Create the group first, then add fields to
        it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                secretName:
                  type: string
                  examples: [stripe-live]
                  description: 'The secret group being referenced. Names a group in the office or tenant vault.'
              required: [secretName]
      responses:
        '201':
          description: The group was created.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          description: '`secretName` is missing, or the office has no vault.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    success: false
                    error: secretName is required
        '403':
          $ref: '#/components/responses/Forbidden'

  /offices/{officeId}/environment/secrets/{secretName}:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
      - name: secretName
        in: path
        required: true
        schema:
          type: string
          examples: [stripe-live]
    delete:
      tags: [Environment secrets]
      summary: Delete a secret group
      operationId: deleteOfficeSecret
      description: |
        Deletes the group and every field in it. Requires `secrets:write`.

        Integrations referencing this group are not updated. Check
        `GET /offices/{officeId}/integrations/{integrationId}/secret-refs`
        before deleting one.
      responses:
        '200':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /offices/{officeId}/environment/secrets/{secretName}/fields:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
      - name: secretName
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Environment secrets]
      summary: List field names
      operationId: listOfficeSecretFields
      description: |
        Returns the **field names** in a group, without their values. Requires
        `secrets:read`.

        Use this to see what a group holds without revealing anything.
      responses:
        '200':
          description: Field names.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Environment secrets]
      summary: Add a field
      operationId: addOfficeSecretField
      description: |
        Adds a named value to a secret group. Requires `secrets:write`.

        **Fields are injected when the office boots.** Adding one does nothing
        until the office restarts, which you do with [Restart an office](/docs/api-reference/offices/machine/restartOfficeMachine). If you change a
        value and the employee's
        behaviour does not change, this is almost always why.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fieldName:
                  type: string
                  examples: [API_KEY]
                fieldValue:
                  type: string
                  examples: [sk_live_...]
              required: [fieldName, fieldValue]
      responses:
        '201':
          description: The field was added.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          description: A required field is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    success: false
                    error: fieldName and fieldValue are required
        '403':
          $ref: '#/components/responses/Forbidden'

  /offices/{officeId}/environment/secrets/{secretName}/fields/{fieldName}:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
      - name: secretName
        in: path
        required: true
        schema:
          type: string
      - name: fieldName
        in: path
        required: true
        schema:
          type: string
          examples: [API_KEY]
    get:
      tags: [Environment secrets]
      summary: Read a field value
      operationId: readOfficeSecretField
      description: |
        **This returns the decrypted value.** Requires `secrets:read` at the
        office.

        It is the only endpoint on the office surface that reveals a credential.
        Everything else returns names or references. This is why `secrets:read`
        exists as an action separate from `office:read`: someone who can operate
        an office does not automatically get to read its credentials, and the two
        are granted separately.

        Treat a response from this endpoint the way you would treat the
        credential itself. Do not log it.
      responses:
        '200':
          description: The decrypted field value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  field:
                    type: object
                    properties:
                      value:
                        type: string
                        description: The decrypted secret. Handle accordingly.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      tags: [Environment secrets]
      summary: Update a field value
      operationId: updateOfficeSecretField
      description: |
        Replaces a field's value. Requires `secrets:write`.

        Takes effect at the next office boot, not immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fieldValue:
                  type: string
              required: [fieldValue]
      responses:
        '200':
          description: Updated.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags: [Environment secrets]
      summary: Delete a field
      operationId: deleteOfficeSecretField
      description: Removes a field from the group. Requires `secrets:write`.
      responses:
        '200':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /offices/{officeId}/integrations/{integrationId}:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
      - name: integrationId
        in: path
        required: true
        description: 'The integration. From [List integrations](/docs/api-reference/offices/integrations/listOfficeIntegrations).'
        schema:
          type: string
          examples: [int_7d3a1f]
    get:
      tags: [Integrations]
      summary: Get an integration
      operationId: getOfficeIntegration
      description: |
        Requires `office:read`.

        Returns the connection and its declared endpoints. **No credential value
        is returned**, here or anywhere else on this surface: `tools` and the
        secret references are pointers, and the values live in a vault.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The integration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  integration:
                    $ref: '#/components/schemas/Integration'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Integrations]
      summary: Update an integration
      operationId: updateOfficeIntegration
      description: |
        Requires `office:manage`.

        `name`, `baseUrl` and `tools` are updatable. Changing authentication means
        managing the integration's secret references, not patching it here, and
        `status` is system managed.

        **`tools` replaces the whole array rather than merging into it.** Send the
        full set you want. Endpoints are declared as a set, so a merge would leave
        no way to remove one. Omit the field to leave the existing endpoints alone.

        The same `in` rule applies as on create: a parameter without one is
        rejected with a 400. Updating the endpoints regenerates the integration's
        skill, and the office picks the change up on its next boot.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                baseUrl:
                  type: string
                tools:
                  type: array
                  description: Replaces every declared endpoint. Omit to leave them unchanged.
                  items:
                    $ref: '#/components/schemas/IntegrationTool'
      responses:
        '200':
          description: The updated integration.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No integration with that ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    success: false
                    error: Integration not found
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Integrations]
      summary: Delete an integration
      operationId: deleteOfficeIntegration
      description: Requires `office:manage`. Secret groups the integration referenced are not deleted.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /offices/{officeId}/integrations/from-template:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
    post:
      tags: [Integrations]
      summary: Create an integration from a template
      operationId: createOfficeIntegrationFromTemplate
      description: |
        Instantiates an entry from the tenant integration library into this
        office. Requires `office:manage`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                globalIntegrationId:
                  type: string
                  examples: [gint_4b8c2e]
                  description: 'The template to instantiate. From [List integration templates](/docs/api-reference/offices/tenant-libraries/listGlobalIntegrations).'
              required: [globalIntegrationId]
      responses:
        '201':
          description: Instantiated.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          description: '`globalIntegrationId` is missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    success: false
                    error: globalIntegrationId is required
        '403':
          $ref: '#/components/responses/Forbidden'

  /offices/{officeId}/integrations/{integrationId}/sync-template:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
      - name: integrationId
        in: path
        required: true
        description: 'The integration. From [List integrations](/docs/api-reference/offices/integrations/listOfficeIntegrations).'
        schema:
          type: string
    post:
      tags: [Integrations]
      summary: Sync an integration from its template
      operationId: syncOfficeIntegrationFromTemplate
      description: |
        Pulls newer template content down into an instantiated integration.
        Requires `office:manage`.

        This is an automatic path, so it respects skill content locking: a
        `manual` or `verified` skill body is skipped rather than overwritten.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: Sync even when the office copy has diverged.
      responses:
        '200':
          description: Synced.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /offices/{officeId}/integrations/{integrationId}/promote-to-template:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
      - name: integrationId
        in: path
        required: true
        description: 'The integration. From [List integrations](/docs/api-reference/offices/integrations/listOfficeIntegrations).'
        schema:
          type: string
    post:
      tags: [Integrations]
      summary: Promote an integration to the tenant library
      operationId: promoteOfficeIntegration
      description: |
        Publishes this office's integration into the tenant library.

        **This endpoint is gated twice.** `office:manage` on the office, **and**
        a console scoped `integration:publish` **or** `tenant:manage`.

        `office:manage` alone is never enough. Promotion writes into the shared
        library and mints a secret in the tenant tree that any office can then be
        pointed at. An action that starts inside one boundary and lands in a
        wider one is gated at both ends.

        The narrow `integration:publish` action exists so publishing does not
        require `tenant:manage`, which also gates unrelated administration. Grant
        the narrow one.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                changelog:
                  type: string
                  description: Notes for the version being published.
      responses:
        '201':
          description: Published as a new template version.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Either gate can produce this. The body names which action was denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'

  /offices/{officeId}/integrations/{integrationId}/sync-skill:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
      - name: integrationId
        in: path
        required: true
        description: 'The integration. From [List integrations](/docs/api-reference/offices/integrations/listOfficeIntegrations).'
        schema:
          type: string
    post:
      tags: [Integrations]
      summary: Sync the integration's skill
      operationId: syncOfficeIntegrationSkill
      description: |
        Generates or refreshes the skill that lets the employee use this
        integration. Requires `office:manage`.

        This is the automatic path that content locking protects. A skill whose
        body was edited by a person, or verified against the live API, is skipped
        rather than regenerated.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Synced.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No integration with that ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'

  /offices/{officeId}/integrations/{integrationId}/secret-refs:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
      - name: integrationId
        in: path
        required: true
        description: 'The integration. From [List integrations](/docs/api-reference/offices/integrations/listOfficeIntegrations).'
        schema:
          type: string
    get:
      tags: [Integrations]
      summary: List secret references
      operationId: listOfficeIntegrationSecretRefs
      description: |
        Lists the secret groups this integration points at. Requires
        `office:read`.

        **No value is returned.** These are associations only. Values live in the
        office vault and are injected at boot.
      responses:
        '200':
          description: The referenced secret groups.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  secrets:
                    type: array
                    items:
                      type: object
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Integrations]
      summary: Add a secret reference
      operationId: addOfficeIntegrationSecretRef
      description: |
        Points the integration at a secret group. Requires `office:manage`.

        ## Two shapes, decided by `origin`

        | | `origin: "office"` | `origin: "tenant"` |
        | --- | --- | --- |
        | The group lives in | This office's vault | The tenant vault |
        | Reaches | This office only | Any office pointed at it |
        | Get the name from | [List secret groups](/docs/api-reference/offices/environment-secrets/listOfficeSecrets) | The tenant vault |

        Prefer `tenant` for anything shared: one rotation reaches every office
        referencing it.

        ```bash
        curl -X POST "$HOS_API/offices/off_9c1e7d/integrations/int_7d3a1f/secret-refs?workspaceId=ws_a1b2c3" \
          -H "Authorization: Bearer $HOS_KEY" \
          -H "Content-Type: application/json" \
          -d '{ "secretName": "stripe-live", "origin": "tenant" }'
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                secretName:
                  type: string
                  examples: [stripe-live]
                  description: 'The secret group being referenced. Names a group in the office or tenant vault.'
                origin:
                  type: string
                  enum: [office, tenant]
                  description: Which vault the group lives in.
              required: [secretName, origin]
      responses:
        '201':
          description: Reference added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  secretName:
                    type: string
                    description: 'The secret group being referenced. Names a group in the office or tenant vault.'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          description: A field is missing or invalid, or the office has no vault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noName:
                  value:
                    success: false
                    error: secretName is required
                badOrigin:
                  value:
                    success: false
                    error: origin must be "office" or "tenant"
                noVault:
                  value:
                    success: false
                    error: Office has no Nexus service configured
        '403':
          $ref: '#/components/responses/Forbidden'

  /offices/{officeId}/integrations/{integrationId}/secret-refs/{secretName}:
