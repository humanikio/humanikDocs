    get:
      tags: [Integrations]
      summary: List inherited tenant secrets
      operationId: listOfficeInheritedTenantSecrets
      description: |
        A read only aggregation of which tenant level secrets reach this office
        through its integrations. Requires `office:read`.

        Answers "what does this employee actually have access to" without
