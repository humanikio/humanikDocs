  /offices/{officeId}/protocols/{protocolId}:
    parameters:
      - $ref: '#/components/parameters/OfficeId'
      - name: protocolId
        in: path
        required: true
        description: 'The protocol. From [List protocols](/docs/api-reference/offices/protocols/listOfficeProtocols).'
        schema:
          type: string
          examples: [confirm-before-refunding]
    get:
      tags: [Protocols]
      summary: Get a protocol
      operationId: getOfficeProtocol
      description: |
        Returns one protocol including its rule text. Requires `office:read`.

        What you read here is not necessarily what is in force. Use
        [List protocols](/docs/api-reference/offices/protocols/listOfficeProtocols)
        for `gatewayRestartNeeded`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The protocol.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  protocol:
                    $ref: '#/components/schemas/Protocol'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Protocols]
      summary: Update a protocol
      operationId: updateOfficeProtocol
      description: |
        Requires `office:manage`. Only the fields you send are changed.

        Takes effect at the next office boot, not immediately.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                emoji:
                  type: string
                content:
                  type: string
                skillNames:
                  type: array
                  items:
                    type: string
                priority:
                  type: integer
                status:
                  type: string
      responses:
        '200':
          description: The updated protocol.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Protocols]
      summary: Delete a protocol
      operationId: deleteOfficeProtocol
      description: |
        Removes the rule. Requires `office:manage`.

        Takes effect at the next office boot, so a running employee keeps
        following a deleted protocol until it restarts.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

