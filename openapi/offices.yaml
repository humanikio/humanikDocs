        Offices that already instantiated this template keep their copy. Deleting
        the template removes the source, not the instances.
      responses:
        '200':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /global-integrations/{globalIntegrationId}/versions:
