openapi: 3.1.0

info:
  title: HumanikOS API — Billing
  version: v1
  summary: Credit, usage history, and what your machines cost.
  description: |
    Two meters, paid from one prepaid credit balance held for your account.

    **Model use** is charged to the balance when each piece of work finishes.
    **Compute** is the machine time of offices, cloud browsers, web services
    and containers on Humanik Cloud, charged to the same balance once an hour.
    If the balance is below zero after an hourly charge and any automatic top
    up, every running machine on the account is stopped until the balance is
    $1 or more.

    The two are reported through different endpoints, and **nothing here adds
    them into one figure**. The usage series and the compute charge series use
    the same bucket keys, so they can be joined on `key`.

    Everything on this page is account-wide and checked at `console` scope.
    That includes **Budgets**, which manage spending limits at every scope (the
    whole account, one workspace, or one employee) from one place. A caller who
    should manage only one workspace's limits uses the workspace routes in
    [Workspaces](/docs/api-reference/workspaces/budgets/listWorkspaceBudgets)
    instead. [Billing and budgets](/docs/spend) explains how the pieces fit
    together.

    Every fact in this document is resolved from `hos-api` source. Endpoints
    whose request or response shape has not been verified are absent rather than
    guessed at.

# `servers` is injected at load time from NEXT_PUBLIC_HOS_API_URL.
# See src/lib/openapi.ts. Do not add a host here.

security:
  - ServiceAccountKey: []

tags:
  - name: Credit
    description: The prepaid balance that model use and machine time are paid from.
  - name: Usage
    description: What has been spent on models, and the invoices behind it.
  - name: Budgets
    description: |
      Spending limits on model use, for the whole account, one workspace, or
      one employee. See [Budgets](/docs/spend/budgets) for how they behave.
  - name: Compute
    description: |
      Machine time on Humanik Cloud: what was charged to your credit each hour,
      a running time estimate, and the settings that decide the cost.

components:
  securitySchemes:
    ServiceAccountKey:
      type: http
      scheme: bearer
      description: |
        A service account API key, sent whole as a bearer token:
        `hsk_<40 hex>.hss_<64 hex>`.

  parameters:
    BudgetIdPath:
      name: budgetId
      in: path
      required: true
      description: |
        The budget to act on. IDs come from
        [List budgets](/docs/api-reference/billing/budgets/listBudgets), and are
        also returned as `budgetId` on a `402` from Nova when a budget stopped
        the work.
      schema:
        type: string
        examples: [Hq3mP0aZ7cTt2Lk1Rw9e]
    BudgetWorkspaceQuery:
      name: workspaceId
      in: query
      required: false
      description: |
        Where the budget is stored. **Required for a workspace or employee
        budget**: send the workspace it belongs to, which is `workspaceId` on
        the budget as [List budgets](/docs/api-reference/billing/budgets/listBudgets)
        returns it. Leave it out for an account budget.

        Sending the wrong workspace, or none for a workspace budget, returns
        `404`. The ID alone does not find the budget.
      schema:
        type: string
        examples: [ws_a1b2c3]

  responses:
    BudgetNotFound:
      description: |
        No budget with that ID in the place `workspaceId` names. Check that
        `workspaceId` is the budget's own workspace, and absent for an account
        budget.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            missing:
              value:
                success: false
                error: Budget not found
    BadRequest:
      description: A required field is missing or malformed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: The key is missing, unknown, inactive, or expired.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        Authenticated, but the caller lacks `billing:read` or `billing:manage`
        at `console`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Server side failure. Safe to retry with backoff.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, const: false }
        error: { type: string }
      required: [success, error]

    AutoReload:
      type: object
      description: |
        Tops the balance up automatically by charging the card on file when it
        falls below a threshold. Null when never configured.
      properties:
        enabled: { type: boolean }
        thresholdUsd:
          type: number
          description: Top up once the balance falls below this.
        reloadAmountUsd:
          type: number
          description: How much to add. Minimum 5.

    Balance:
      type: object
      properties:
        balanceUsd:
          type: number
          description: |
            What is available right now. Model use and machine time are both
            taken from it, and it can be below zero.
        autoReload:
          oneOf:
            - $ref: '#/components/schemas/AutoReload'
            - type: 'null'
        lastDeduction:
          type: object
          additionalProperties: true
          description: The most recent draw down, for reference.
        lastDeposit:
          type: object
          additionalProperties: true
          description: The most recent top up, for reference.

    UsageEntry:
      type: object
      description: |
        One piece of model work: which model, how many tokens, what it cost, and
        who spent it.
      properties:
        id:
          type: string
          description: Send as `startAfter` to get the page after this entry.
        modelId:
          type: string
          description: The model that did the work.
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        cacheWriteTokens: { type: integer }
        cacheReadTokens: { type: integer }
        billingMode:
          type: string
          enum: [platform, byok]
          description: |
            Who paid. `platform` is charged to your credit. `byok` ran on your
            own model account and was not charged here.
        isByok:
          type: boolean
          description: True when `billingMode` is `byok`. Kept for older clients.
        totalCostUsd:
          type: number
          description: |
            What was charged to your credit. **Zero for work on your own model
            account**, because we do not bill it.
        computedCostUsd:
          type: number
          description: |
            What the tokens cost, whoever paid. Equal to `totalCostUsd` for
            platform work. For work on your own model account it is what your
            provider will charge you, and it is the figure budgets count.
        uid:
          type: [string, 'null']
          description: The person the work ran for, when there is one.
        workspaceId:
          type: string
          description: |
            The workspace the work ran in. `console` for Nova working at
            account level rather than in a workspace.
        officeId:
          type: string
          description: The employee's office, or an empty string when no office was involved.
        browserId:
          type: [string, 'null']
          description: Set when a cloud browser did the work.
        source:
          type: string
          description: |
            The raw origin recorded with the work. Read `origin.kind` instead,
            which translates it.
        origin:
          type: object
          description: |
            Who spent it, with current names. Names are looked up when you
            read, so a renamed employee shows its new name on old entries.
          properties:
            kind:
              type: string
              enum: [nova, office, browser]
              description: Nova, an AI employee, or a cloud browser.
            workspace:
              type: [object, 'null']
              properties:
                id: { type: string }
                name: { type: string }
            office:
              type: [object, 'null']
              properties:
                id: { type: string }
                name: { type: string }
                serviceId:
                  type: [string, 'null']
                  description: The machine the office runs on. Matches `serviceId` on compute charges.
                projectId: { type: [string, 'null'] }
            browser:
              type: [object, 'null']
              properties:
                id: { type: string }
                name: { type: string }
            missing:
              type: array
              description: |
                Things that no longer exist. Their IDs are returned in place of
                names.
              items:
                type: string
                enum: [workspace, office, browser]
        createdAt: { type: string, format: date-time }

    BudgetScope:
      description: |
        What the budget covers. Fixed at creation: to change it, delete the
        budget and create another.

        | `kind` | Counts spend from | Can stop work in |
        | --- | --- | --- |
        | `account` | Every workspace | Every workspace |
        | `workspace` | That workspace, including its employees | That workspace |
        | `office` | One employee, plus Nova while it works inside that employee's office | That employee |
      oneOf:
        - type: object
          title: Account
          properties:
            kind: { type: string, const: account }
          required: [kind]
        - type: object
          title: Workspace
          properties:
            kind: { type: string, const: workspace }
            workspaceId:
              type: string
              description: |
                IDs come from
                [List workspaces](/docs/api-reference/workspaces/workspaces/listWorkspaces).
          required: [kind, workspaceId]
        - type: object
          title: One employee
          properties:
            kind: { type: string, const: office }
            workspaceId:
              type: string
              description: The workspace the employee's office is in.
            officeId:
              type: string
              description: |
                The employee's office. IDs come from
                [List offices](/docs/api-reference/offices/offices/listOffices).
          required: [kind, workspaceId, officeId]

    BudgetAlerts:
      type: object
      description: |
        Who is told as spend approaches and reaches the limit. Each threshold
        is sent **once per window**. A new window starts with nothing sent, and
        changing the limit, window, what is counted, or these alerts lets every
        threshold be sent again.
      properties:
        thresholds:
          type: array
          maxItems: 10
          description: |
            Fractions of `limitUsd`: `0.5` is 50 percent, `1` is the limit. Each
            value is greater than 0 and at most 2.

            When empty, a `warn` or `notify` budget still alerts at `1`. A
            `block` budget with no thresholds sends no alert, because the
            refusal is the signal.
          items: { type: number, exclusiveMinimum: 0, maximum: 2 }
        recipients:
          type: array
          maxItems: 50
          description: |
            User IDs to tell. When empty, everyone holding `billing:manage` on
            the account is told and, for a workspace or employee budget, that
            workspace's admins too.
          items: { type: string }
        sms:
          type: boolean
          description: |
            Also send a text message at the thresholds in `smsAt`. Texts go only
            to recipients who have confirmed a phone number on their profile.
            Defaults to false.
        smsAt:
          type: array
          maxItems: 10
          description: |
            Which thresholds also send a text. Defaults to `[1]`, the limit
            itself. Has no effect unless `sms` is true.
          items: { type: number, exclusiveMinimum: 0, maximum: 2 }

    BudgetView:
      type: object
      description: A budget, with its spend so far in the current window.
      properties:
        id: { type: string }
        name:
          type: string
          examples: [Support team monthly]
        scope: { $ref: '#/components/schemas/BudgetScope' }
        workspaceId:
          type: [string, 'null']
          description: |
            The scope's workspace, or null for an account budget. Send this as
            the `workspaceId` query parameter to address the budget.
        window:
          type: string
          enum: [daily, weekly, monthly]
          description: |
            When the total resets. Weeks start on Monday. Workspace and employee
            budgets reset at midnight in the workspace's time zone, account
            budgets at midnight UTC.
        metric:
          type: array
          description: |
            What is counted. `platform` is model use charged to your credit,
            `byok` is model use on your own model account. The total is their
            sum.
          items:
            type: string
            enum: [platform, byok]
        limitUsd:
          type: number
          description: The limit, in US dollars.
        action:
          type: string
          enum: [block, warn, notify]
          description: |
            What happens at the limit.

            | Value | At the limit |
            | --- | --- |
            | `block` | New work is refused and running work stops |
            | `warn` | Work continues, and the run is marked as over the limit in the app |
            | `notify` | Work continues. Only the alerts are sent |
        alerts: { $ref: '#/components/schemas/BudgetAlerts' }
        enabled:
          type: boolean
          description: A disabled budget is ignored everywhere.
        pausedUntil:
          type: [string, 'null']
          format: date-time
          description: |
            While this is in the future the budget is ignored: it stops
            nothing, warns about nothing, and sends no alerts. A time in the
            past means it is no longer paused.
        pausedBy:
          type: [string, 'null']
          description: Who paused it.
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
        usage:
          type: object
          properties:
            usedUsd:
              type: number
              description: |
                Spend counted by this budget in the current window. Reads as 0
                if spend could not be read at that moment.
            windowStart:
              type: string
              format: date-time
            resetsAt:
              type: string
              format: date-time
              description: When the current window ends and the total returns to zero.
        workspaceName:
          type: string
          description: Present on workspace and employee budgets.
        officeName:
          type: string
          description: Present on employee budgets.

    BudgetEvent:
      type: object
      description: One piece of work a `block` budget refused.
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor:
          type: string
          enum: [nova, office, zylo, cron, sms]
          description: |
            What was refused.

            | Value | Work |
            | --- | --- |
            | `nova` | Nova, in a chat |
            | `office` | An AI employee |
            | `zylo` | An AI employee prompted from a project editor |
            | `cron` | A scheduled Nova task |
            | `sms` | Nova replying to a text message |
        workspaceId:
          type: string
          description: The workspace the refused work was in.
        workspaceName: { type: string }
        officeId:
          type: [string, 'null']
          description: The employee's office, when the work involved one.
        officeName: { type: string }
        uid:
          type: [string, 'null']
          description: The person the work ran for, when there is one.
        costAskedUsd:
          type: [number, 'null']
          description: Always null today. Reserved for the expected cost of the refused work.

    ComputeCharge:
      type: object
      description: One service's machine time in one billed hour.
      properties:
        id:
          type: string
          description: The line's ID. Send it as `startAfter` to page.
        billId:
          type: string
          description: |
            The hourly bill this line belongs to. Matches `billId` on
            [List compute bills](/docs/api-reference/billing/compute/listComputeBills).
        serviceId:
          type: string
          description: |
            The Humanik Cloud service that ran. Matches `serviceId` on
            [List services](/docs/api-reference/cloud/services/listCloudServices).
        serviceType:
          type: string
          description: |
            The service's type when it was charged, for example `cloudClaw` for
            an office or `webservice`. `origin.kind` is the readable form.
        officeId:
          type: [string, 'null']
          description: The office that ran on this service. `null` when the service is not an office.
        workspaceId:
          type: [string, 'null']
          description: That office's workspace. `null` when the service is not an office.
        hourStartMs:
          type: integer
          description: Start of the hour charged, epoch milliseconds.
        hourEndMs:
          type: integer
          description: End of the hour charged, epoch milliseconds.
        seconds:
          type: number
          description: Seconds the service ran in that hour.
        rate:
          type: number
          description: |
            US dollars per hour. When the rate changed inside the hour, this is
            the time weighted average, so `rate` times hours run equals
            `amountUsd`.
        amountUsd:
          type: number
          description: US dollars taken from credit for this line.
        chargedAt:
          type: [string, 'null']
          format: date-time
          description: When the hour was charged.
        origin: { $ref: '#/components/schemas/ComputeOrigin' }
      required: [id, billId, serviceId, serviceType, officeId, workspaceId, hourStartMs, hourEndMs, seconds, rate, amountUsd, chargedAt, origin]

    ComputeOrigin:
      type: object
      description: What used the machine time, with names looked up at read time.
      properties:
        kind:
          type: string
          enum: [office, webservice, browser, container, service]
          description: |
            Decided by the service type, so a line whose office has since been
            deleted is still `office`. `service` covers any other type.
        service:
          type: object
          properties:
            id: { type: string }
            name:
              type: [string, 'null']
              description: |
                The service's current name. `null` when it could not be looked
                up. If `missing` is empty at the same time, Humanik Cloud could
                not be reached for this read.
            type: { type: string }
            projectId:
              type: [string, 'null']
              description: |
                The project the service is in. From
                [List projects](/docs/api-reference/cloud/projects/listCloudProjects).
          required: [id, name, type, projectId]
        office:
          description: The office's current name and workspace. `null` for a service that is not an office, or when the office was not found.
          oneOf:
            - type: object
              properties:
                id: { type: string }
                name: { type: string }
                workspaceId: { type: string }
                workspaceName: { type: [string, 'null'] }
              required: [id, name, workspaceId, workspaceName]
            - type: 'null'
        missing:
          type: array
          description: |
            Parts that could not be found. `service`: the service no longer
            exists on your Humanik Cloud account. `office`: the line names an
            office that could not be found.
          items:
            type: string
            enum: [service, office]
      required: [kind, service, office, missing]

    ComputeChargeBucket:
      type: object
      properties:
        key:
          type: string
          description: |
            The bucket, in your timezone. `YYYY-MM-DDTHH` for an hour,
            `YYYY-MM-DD` for a day, the Monday as `YYYY-MM-DD` for a week, and
            `YYYY-MM` for a month. The same key as the usage series.
        label:
          type: string
          description: A short axis label, for example `14:00`, `9/14`, `Sep 8` or `Sep`.
        computeUsd: { type: number, description: US dollars taken from credit. }
        runtimeMs: { type: integer, description: Machine time charged, in milliseconds. }
        lineCount: { type: integer, description: Charge lines counted. One per service per hour. }
      required: [key, label, computeUsd, runtimeMs, lineCount]

    ComputeBill:
      type: object
      description: One hour of machine time across every service, as charged.
      properties:
        billId:
          type: string
          description: The bill's ID. Send it as `startAfter` to page.
        hourStartMs:
          type: integer
          description: Start of the hour billed, epoch milliseconds.
        hourEndMs:
          type: integer
          description: End of the hour billed, epoch milliseconds.
        chargedUsd:
          type: number
          description: US dollars taken from credit for the whole hour.
        lineCount:
          type: integer
          description: How many services ran in the hour. Each is one line on List compute charges.
        balanceBeforeUsd:
          type: number
          description: The balance just before the charge.
        balanceAfterDebitUsd:
          type: number
          description: The balance right after the charge, before any top up. Can be below zero.
        balanceUsd:
          type: [number, 'null']
          description: The balance after the top up attempt. `null` when that step did not finish.
        refill:
          description: What automatic top up did after the charge. `null` when that step did not finish.
          oneOf:
            - type: object
              properties:
                status:
                  type: string
                  enum: [not_needed, not_enabled, succeeded, failed]
                  description: |
                    `not_enabled`: automatic top up is off. `not_needed`: the
                    balance was at or above your threshold. `succeeded`: your
                    card was charged and credit added. `failed`: it was tried
                    and did not add credit.
                amountUsd:
                  type: number
                  description: Credit added. Present when `status` is `succeeded`.
                reason:
                  type: string
                  enum: [no_card, card_declined, deposit_failed_after_charge, error]
                  description: |
                    Present when `status` is `failed`. `no_card`: no saved card.
                    `card_declined`: the card was declined. `deposit_failed_after_charge`:
                    the card was charged but the credit was not added; our team
                    is alerted and corrects it. `error`: anything else.
              required: [status]
            - type: 'null'
        standing:
          description: |
            `negative` when `balanceUsd` was below zero, which stops your
            running machines. `null` when that step did not finish.
          oneOf:
            - type: string
              enum: [ok, negative]
            - type: 'null'
        chargedAt:
          type: [string, 'null']
          format: date-time
          description: When the hour was charged.
      required: [billId, hourStartMs, hourEndMs, chargedUsd, lineCount, balanceBeforeUsd, balanceAfterDebitUsd, balanceUsd, refill, standing, chargedAt]

    ComputeEstimateService:
      type: object
      description: One service's running time and estimate for the period. Not what was charged.
      properties:
        serviceId:
          type: string
          description: The Humanik Cloud service.
        serviceName: { type: string }
        serviceType: { type: string }
        totalRuntimeMs: { type: number, description: Machine time recorded in the period, in milliseconds. }
        estimatedCostUsd: { type: number, description: The running time priced at today's price. }
        isActive: { type: boolean, description: Whether a machine is running now. }
        sessionCount: { type: integer, description: Sessions for this service in the period. }
      additionalProperties: true

    ServiceUsageBucket:
      type: object
      properties:
        key:
          type: string
          description: |
            The bucket, in your timezone. `YYYY-MM-DD` of the first day for a
            day or a week (weeks start on Monday), `YYYY-MM` for a month.
        startMs: { type: integer, description: Start of the bucket, epoch milliseconds. }
        computeUsd: { type: number, description: US dollars taken from credit for this service's machine time. }
        runtimeMs: { type: integer, description: Machine time charged, in milliseconds. }
        hourCount: { type: integer, description: Hours charged. }
        llmBilledUsd: { type: number, description: The employee's model use charged to your credit. Zero when the service runs no office. }
        llmByokEstimateUsd: { type: number, description: What the employee's model use on your own model account cost you there. }
        llmRunCount: { type: integer, description: Model use records counted. }
      required: [key, startMs, computeUsd, runtimeMs, hourCount, llmBilledUsd, llmByokEstimateUsd, llmRunCount]

paths:
  /billing/balance:
    get:
      operationId: getBalance
      summary: Get the balance
      tags: [Credit]
      description: |
        What is available to spend, and how automatic top ups are configured.

        **Calling this creates the balance if it does not exist**, so a brand
        new account gets a zero balance rather than an error. `exists` tells you
        which happened on the call before this one.

        **Model use and machine time both draw on this balance.** Machine time
        is taken once an hour, about 2 minutes after the hour ends. Each of
        those charges, with the balance before and after it, is on
        [List compute bills](/docs/api-reference/billing/compute/listComputeBills).
        A charge for machine time can take the balance below zero. If it is
        still below zero after any automatic top up, every running machine on
        the account is stopped until the balance is $1 or more.

        **Permission:** `billing:read` @ `console`
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  exists:
                    type: boolean
                    description: False when this call is what created it.
                  balance:
                    oneOf:
                      - $ref: '#/components/schemas/Balance'
                      - type: 'null'
              examples:
                funded:
                  value:
                    success: true
                    exists: true
                    balance:
                      balanceUsd: 42.18
                      autoReload:
                        enabled: true
                        thresholdUsd: 10
                        reloadAmountUsd: 50
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /billing/balance/check:
    post:
      operationId: checkBalance
      summary: Check before spending
      tags: [Credit]
      description: |
        Asks whether model work would be allowed right now, without doing any.

        Useful before starting something long, so you can surface a top up
        prompt rather than failing partway through.

        **Always returns 200.** The answer is in the body.

        **Permission:** `billing:read` @ `console`
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                isByok:
                  type: boolean
                  description: |
                    Set true to ask about work billed to your own model account.
                    That work does not draw on this balance, so the answer is
                    yes regardless of what is in it.
      responses:
        '200':
          description: Answered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  allowed: { type: boolean }
                  balanceUsd: { type: number }
                  reason:
                    type: string
                    description: Present when not allowed.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /billing/balance/initialize:
    post:
      operationId: initializeBalance
      summary: Create the balance
      tags: [Credit]
      description: |
        Creates the balance record explicitly. Idempotent, and rarely needed,
        since [Get the balance](/docs/api-reference/billing/credit/getBalance)
        creates it on first read.

        **Permission:** `billing:manage` @ `console`
      responses:
        '200':
          description: Created, or already present.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  created: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /billing/balance/auto-reload:
    post:
      operationId: updateAutoReload
      summary: Configure automatic top ups
      tags: [Credit]
      description: |
        Charges the card on file and adds credit whenever the balance falls
        below a threshold. Send `null` to switch it off.

        > **A failed charge does not interrupt work already running.** It is
        > attempted without blocking, and a decline surfaces as an out of credit
        > error on the *next* piece of work rather than the one in progress. So
        > a card problem appears later than you would expect, and somewhere else.

        Top ups also run after each hourly charge for machine time, with the
        same settings. There the top up is finished before Humanik Cloud
        decides whether the balance is below zero, so a top up that succeeds
        keeps your machines running. What each one did is on
        [List compute bills](/docs/api-reference/billing/compute/listComputeBills).

        **Permission:** `billing:manage` @ `console`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                autoReload:
                  oneOf:
                    - type: object
                      properties:
                        enabled:
                          type: boolean
                          description: Required.
                        thresholdUsd:
                          type: number
                          description: Required. Must be greater than zero.
                        reloadAmountUsd:
                          type: number
                          description: Required. Must be at least 5.
                      required: [enabled, thresholdUsd, reloadAmountUsd]
                    - type: 'null'
                  description: An object to configure it, or null to disable.
              required: [autoReload]
            examples:
              on:
                summary: Top up 50 when it drops below 10
                value:
                  autoReload:
                    enabled: true
                    thresholdUsd: 10
                    reloadAmountUsd: 50
              off:
                summary: Disable
                value:
                  autoReload: null
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '400':
          description: The shape or a value is wrong. Each rule reports separately.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                tooSmall:
                  value:
                    success: false
                    error: autoReload.reloadAmountUsd must be at least $5
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /billing/usage:
    get:
      operationId: listUsage
      summary: List model usage
      tags: [Usage]
      description: |
        Individual pieces of model work and what each cost, newest first.

        Each entry says **who spent it** in `origin`: Nova, an AI employee, or a
        cloud browser, with the workspace, employee or browser by its current
        name. Work on your own model account is listed too, with
        `totalCostUsd` of zero and its real cost in `computedCostUsd`.

        Paginated with a cursor. Take the last entry's `id` from one page and
        send it as `startAfter` to get the next.

        **Permission:** `billing:read` @ `console`
      parameters:
        - name: limit
          in: query
          required: false
          description: How many to return. Defaults to 50.
          schema: { type: integer, default: 50 }
        - name: startAfter
          in: query
          required: false
          description: |
            The `id` of the last entry on the previous page. Omit for the first
            page.
          schema: { type: string }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/UsageEntry' }
                  hasMore:
                    type: boolean
                    description: Whether another page exists.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /billing/usage/summary:
    get:
      operationId: getUsageSummary
      summary: Get a usage summary
      tags: [Usage]
      description: |
        Totals by month, plus a daily series, for showing spend at a glance.
        Every figure is split into `platformUsd` (charged to your credit) and
        `byokUsd` (what work on your own model account cost you there), with
        `totalUsd` as their sum.

        Days and months are resolved in the timezone you pass, so a summary
        rendered for a customer in another region lines up with their calendar
        rather than yours.

        **Permission:** `billing:read` @ `console`
      parameters:
        - name: months
          in: query
          required: false
          description: How many months back. Defaults to 6, and at most 24.
          schema: { type: integer, default: 6, maximum: 24 }
        - name: timezone
          in: query
          required: false
          description: An IANA timezone name. Defaults to UTC.
          schema: { type: string, examples: ['America/Toronto'] }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  current:
                    type: object
                    additionalProperties: true
                    description: The month in progress.
                  months:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  dailySeries:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /billing/usage/series:
    get:
      operationId: getUsageSeries
      summary: Get a usage series
      tags: [Usage]
      description: |
        Usage bucketed over a window you choose, for charts.

        Both bounds are **required**, as epoch milliseconds. The window includes
        `from` and excludes `to`.

        **Permission:** `billing:read` @ `console`
      parameters:
        - name: from
          in: query
          required: true
          description: Start of the window, epoch milliseconds.
          schema: { type: integer }
        - name: to
          in: query
          required: true
          description: End of the window, epoch milliseconds. Not included.
          schema: { type: integer }
        - name: granularity
          in: query
          required: false
          description: |
            Bucket size. Defaults to `auto`, which picks one from the width of
            the window and never picks `week`. Anything unrecognised is treated as `auto` rather than
            rejected, and the bucket size actually used comes back on the
            response.
          schema:
            type: string
            enum: [hour, day, week, month, auto]
            default: auto
        - name: timezone
          in: query
          required: false
          description: An IANA timezone name. Decides where day and month boundaries fall.
          schema: { type: string }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  granularity:
                    type: string
                    description: The bucket size used, which may differ from what you asked for.
                  fromMs: { type: integer }
                  toMs: { type: integer }
                  buckets:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  totals:
                    type: object
                    additionalProperties: true
        '400':
          description: '`from` or `to` is missing or not a number.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                missing:
                  value:
                    success: false
                    error: from and to (epoch ms) are required
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /billing/invoices:
    get:
      operationId: listInvoices
      summary: List credit invoices
      tags: [Usage]
      description: |
        Invoices for credit added to the account, newest first.

        These record credit coming in: purchases, automatic top ups and trial
        credit. The credit pays for both model use and machine time. What
        machine time took out of the balance each hour is on
        [List compute bills](/docs/api-reference/billing/compute/listComputeBills).

        **Permission:** `billing:read` @ `console`
      parameters:
        - name: limit
          in: query
          required: false
          description: How many to return. Defaults to 10.
          schema: { type: integer, default: 10 }
        - name: startAfter
          in: query
          required: false
          description: The `id` of the last invoice on the previous page.
          schema: { type: string }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  invoices:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  hasMore: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /billing/budgets:
    get:
      operationId: listBudgets
      summary: List budgets
      tags: [Budgets]
      description: |
        Every budget in the account, at every scope: account budgets first,
        then workspace and employee budgets, newest first.

        Each one comes with `usage`: what it has counted so far in the current
        window, when that window started, and when it resets. Budgets on the
        same scope and window share one spend reading, so the figures agree
        with each other.

        This is where the `workspaceId` to send with every other budget call
        comes from. It is `workspaceId` on each budget, and null for an account
        budget.

        **Permission:** `billing:read` @ `console`
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  budgets:
                    type: array
                    items: { $ref: '#/components/schemas/BudgetView' }
              examples:
                two:
                  value:
                    success: true
                    budgets:
                      - id: Hq3mP0aZ7cTt2Lk1Rw9e
                        name: Account monthly
                        scope: { kind: account }
                        workspaceId: null
                        window: monthly
                        metric: [platform, byok]
                        limitUsd: 2000
                        action: warn
                        alerts: { thresholds: [0.5, 0.9], recipients: [], sms: false }
                        enabled: true
                        pausedUntil: null
                        pausedBy: null
                        usage:
                          usedUsd: 812.4
                          windowStart: '2026-10-01T00:00:00.000Z'
                          resetsAt: '2026-11-01T00:00:00.000Z'
                      - id: b7Rk2Wq9LmXv4Pz0Ns1d
                        name: Ada monthly
                        scope: { kind: office, workspaceId: ws_a1b2c3, officeId: off_9c1e7d }
                        workspaceId: ws_a1b2c3
                        window: monthly
                        metric: [platform, byok]
                        limitUsd: 50
                        action: block
                        alerts: { thresholds: [0.8, 1], recipients: [], sms: true }
                        enabled: true
                        pausedUntil: null
                        pausedBy: null
                        usage:
                          usedUsd: 41.07
                          windowStart: '2026-10-01T04:00:00.000Z'
                          resetsAt: '2026-11-01T04:00:00.000Z'
                        workspaceName: Support
                        officeName: Ada
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      operationId: createBudget
      summary: Create a budget
      tags: [Budgets]
      description: |
        Creates a spending limit on model use for the whole account, one
        workspace, or one employee.

        `scope` decides what is counted and what can be stopped, and it cannot
        be changed later. Get a `workspaceId` from
        [List workspaces](/docs/api-reference/workspaces/workspaces/listWorkspaces)
        and an employee's `officeId` from
        [List offices](/docs/api-reference/offices/offices/listOffices):

        ```bash
        curl "$HOS_API/offices?workspaceId=ws_a1b2c3" \
          -H "Authorization: Bearer $HOS_KEY"
        ```

        The workspace, and the office for an employee budget, must exist or
        the call returns `400`.

        **What a budget counts.** Model use only. The cost of an office being
        awake is not counted, so a budget is not a limit on total spend.

        **Several budgets can apply to one piece of work**, and every one is
        checked. Any `block` budget at its limit stops the work, whatever the
        others say. [Budgets](/docs/spend/budgets) walks through how they
        combine.

        Defaults: `window` daily, `action` block, no alerts, `enabled` true.

        **Permission:** `billing:manage` @ `console`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: Required. A label people will recognise in an alert or a refusal.
                scope:
                  $ref: '#/components/schemas/BudgetScope'
                metric:
                  type: array
                  minItems: 1
                  description: |
                    Required, and not empty. What to count.

                    | Value | Counts |
                    | --- | --- |
                    | `platform` | Model use charged to your credit |
                    | `byok` | Model use on your own model account, which we never bill |

                    A budget stops or warns only about work it counts, so a
                    `platform` only budget never stops work on your own model
                    account, and the reverse. Send both to cover model use
                    whoever is paying for it.
                  items:
                    type: string
                    enum: [platform, byok]
                limitUsd:
                  type: number
                  exclusiveMinimum: 0
                  description: Required. The limit in US dollars.
                window:
                  type: string
                  enum: [daily, weekly, monthly]
                  default: daily
                  description: |
                    When the total resets. Weeks start on Monday. Workspace and
                    employee budgets use the workspace's time zone, account
                    budgets use UTC.
                action:
                  type: string
                  enum: [block, warn, notify]
                  default: block
                  description: What happens at the limit. See `action` on the budget.
                alerts:
                  $ref: '#/components/schemas/BudgetAlerts'
                enabled:
                  type: boolean
                  default: true
              required: [name, scope, metric, limitUsd]
            examples:
              employee:
                summary: Cap one employee at $50 a month, text at the limit
                value:
                  name: Ada monthly
                  scope: { kind: office, workspaceId: ws_a1b2c3, officeId: off_9c1e7d }
                  window: monthly
                  metric: [platform, byok]
                  limitUsd: 50
                  action: block
                  alerts: { thresholds: [0.8, 1], recipients: [], sms: true }
              accountWarn:
                summary: A monthly account limit that only warns
                value:
                  name: Account monthly
                  scope: { kind: account }
                  window: monthly
                  metric: [platform, byok]
                  limitUsd: 2000
                  action: warn
                  alerts: { thresholds: [0.5, 0.9], recipients: [], sms: false }
              workspaceWeekly:
                summary: A weekly limit for one workspace
                value:
                  name: Support weekly
                  scope: { kind: workspace, workspaceId: ws_a1b2c3 }
                  window: weekly
                  metric: [platform]
                  limitUsd: 300
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  budget: { $ref: '#/components/schemas/BudgetView' }
        '400':
          description: |
            A field is missing or invalid, or the workspace or office does not
            exist. `error` is a plain sentence naming the problem.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                noScope:
                  value:
                    success: false
                    error: scope is required
                noOffice:
                  value:
                    success: false
                    error: That office does not exist in this workspace.
                threshold:
                  value:
                    success: false
                    error: alerts.thresholds values must be fractions of the limit greater than 0 and at most 2, for example 0.5 for 50 percent
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /billing/budgets/{budgetId}:
    parameters:
      - $ref: '#/components/parameters/BudgetIdPath'
      - $ref: '#/components/parameters/BudgetWorkspaceQuery'

    get:
      operationId: getBudget
      summary: Get a budget
      tags: [Budgets]
      description: |
        One budget, with its spend so far in the current window.

        Send the budget's `workspaceId` as a query parameter unless it is an
        account budget. Without it, a workspace or employee budget is not
        found.

        **Permission:** `billing:read` @ `console`
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  budget: { $ref: '#/components/schemas/BudgetView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/BudgetNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    put:
      operationId: updateBudget
      summary: Update a budget
      tags: [Budgets]
      description: |
        Changes any of a budget's name, window, what it counts, limit, action,
        alerts, or whether it is enabled. Fields you leave out are kept.
        `alerts`, when sent, replaces the whole alerts object.

        **The scope cannot change.** Sending a different `scope` returns `400`.
        Sending the same scope back is accepted, so a client that posts its
        whole form still works.

        Changing the limit, window, what is counted, or the alerts lets every
        threshold alert be sent again in the current window.

        To stop a budget for the rest of its window without changing it, use
        [Pause a budget](/docs/api-reference/billing/budgets/pauseBudget). To
        stop it indefinitely, set `enabled` to false.

        **Permission:** `billing:manage` @ `console`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                window:
                  type: string
                  enum: [daily, weekly, monthly]
                metric:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [platform, byok]
                limitUsd: { type: number, exclusiveMinimum: 0 }
                action:
                  type: string
                  enum: [block, warn, notify]
                alerts: { $ref: '#/components/schemas/BudgetAlerts' }
                enabled: { type: boolean }
                scope:
                  $ref: '#/components/schemas/BudgetScope'
                  description: Optional. Accepted only when it equals the budget's current scope.
            examples:
              raise:
                summary: Raise the limit
                value:
                  limitUsd: 75
              warnOnly:
                summary: Stop blocking, keep warning
                value:
                  action: warn
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  budget: { $ref: '#/components/schemas/BudgetView' }
        '400':
          description: A field is invalid, or `scope` differs from the budget's scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                scope:
                  value:
                    success: false
                    error: A budget scope cannot be changed. Delete the budget and create a new one.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/BudgetNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      operationId: deleteBudget
      summary: Delete a budget
      tags: [Budgets]
      description: |
        Removes the budget and its record of refused work. This cannot be
        undone.

        To keep a budget but stop it applying, set `enabled` to false with
        [Update a budget](/docs/api-reference/billing/budgets/updateBudget), or
        pause it until its window resets with
        [Pause a budget](/docs/api-reference/billing/budgets/pauseBudget).

        **Permission:** `billing:manage` @ `console`
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/BudgetNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /billing/budgets/{budgetId}/pause:
    parameters:
      - $ref: '#/components/parameters/BudgetIdPath'
      - $ref: '#/components/parameters/BudgetWorkspaceQuery'
    post:
      operationId: pauseBudget
      summary: Pause a budget
      tags: [Budgets]
      description: |
        Sets the budget aside until its current window ends, or clears a pause.

        With `untilReset: true`, `pausedUntil` is set to the end of the current
        window (in the workspace's time zone, or UTC for an account budget) and
        `pausedBy` to the caller. Until then the budget stops nothing, warns
        about nothing, and sends no alerts. Nothing has to clear it: at the
        reset it applies again on its own.

        With `untilReset: false`, the pause is cleared and the budget applies
        straight away.

        This is the way to let work continue past a limit for the rest of a
        day, week or month without raising the limit.

        **Permission:** `billing:manage` @ `console`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                untilReset:
                  type: boolean
                  description: Required. True to pause until the window resets, false to clear a pause.
              required: [untilReset]
            examples:
              pause:
                value: { untilReset: true }
              resume:
                value: { untilReset: false }
      responses:
        '200':
          description: Saved. The budget is returned with its new `pausedUntil`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  budget: { $ref: '#/components/schemas/BudgetView' }
        '400':
          description: '`untilReset` is missing or not a boolean.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                missing:
                  value:
                    success: false
                    error: untilReset must be true or false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/BudgetNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /billing/budgets/{budgetId}/events:
    parameters:
      - $ref: '#/components/parameters/BudgetIdPath'
      - $ref: '#/components/parameters/BudgetWorkspaceQuery'
    get:
      operationId: listBudgetEvents
      summary: List refused work
      tags: [Budgets]
      description: |
        Each piece of work this budget refused, newest first: when, what kind
        of work, in which workspace and employee, and for whom.

        Only a `block` budget refuses work, so `warn` and `notify` budgets have
        an empty list. The record is kept on a best effort basis: a refusal is
        never failed because it could not be recorded, so the list can miss
        one.

        **Permission:** `billing:read` @ `console`
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            How many to return. Defaults to 50, at most 200. A larger value is
            reduced to 200, and a value below 1 or not a number is treated as
            50.
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/BudgetEvent' }
              examples:
                one:
                  value:
                    success: true
                    events:
                      - id: Zr4cN8yQ1bVw6Tm3Kd0s
                        at: '2026-10-14T16:02:11.000Z'
                        actor: office
                        workspaceId: ws_a1b2c3
                        workspaceName: Support
                        officeId: off_9c1e7d
                        officeName: Ada
                        uid: usr_7f2a91
                        costAskedUsd: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/BudgetNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /billing/budgets/{budgetId}/series:
    parameters:
      - $ref: '#/components/parameters/BudgetIdPath'
      - $ref: '#/components/parameters/BudgetWorkspaceQuery'
    get:
      operationId: getBudgetSeries
      summary: Get daily spend for a budget
      tags: [Budgets]
      description: |
        Spend per day across the budget's scope, for a chart. Oldest day first,
        today included, and every day is present, with zeros where nothing was
        spent.

        Days are cut in the workspace's time zone for a workspace or employee
        budget, and in UTC for an account budget.

        **Both kinds of spend are returned whatever the budget counts.** A
        budget that counts only `platform` still gets `byokUsd` here, so add up
        the fields that match its `metric` to compare against `limitUsd`.

        **Permission:** `billing:read` @ `console`
      parameters:
        - name: days
          in: query
          required: false
          description: |
            How many days, ending today. Defaults to 14, at most 92. A larger
            value is reduced to 92, and a value below 1 or not a number is
            treated as 14.
          schema: { type: integer, default: 14, maximum: 92 }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          description: The local day, `YYYY-MM-DD`.
                        platformUsd:
                          type: number
                          description: Model use charged to your credit that day.
                        byokUsd:
                          type: number
                          description: Model use on your own model account that day.
              examples:
                three:
                  value:
                    success: true
                    series:
                      - { date: '2026-10-12', platformUsd: 3.14, byokUsd: 0 }
                      - { date: '2026-10-13', platformUsd: 0, byokUsd: 0 }
                      - { date: '2026-10-14', platformUsd: 5.02, byokUsd: 1.2 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/BudgetNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /billing/compute:
    get:
      operationId: listComputeCharges
      summary: List compute charges
      tags: [Compute]
      description: |
        The machine time taken from your credit, one line per service per hour,
        newest hour first.

        Once an hour, Humanik Cloud sends one bill for the time your services
        ran in the hour before. The total comes off the same credit balance that
        model use draws from. Each line here is one service's share of one of
        those bills. To see the bill as a whole, with the balance before and
        after, use [List compute bills](/docs/api-reference/billing/compute/listComputeBills).

        **An hour is charged a few minutes after it ends.** The hour in progress
        never appears, and the hour that just ended can take a few minutes to
        show up. Hours from before compute billing started were never charged
        and have no lines.

        Each line says **what used the time** in `origin`: an office (with its
        current name and workspace), a web service, a cloud browser or a
        container. Names are looked up when you read, so a renamed office shows
        its new name on old charges. A name that cannot be found is `null`, and
        `origin.missing` says which part was not found. A service you have
        since deleted keeps its ID and type.

        **Filter by one thing at a time.** Send at most one of `serviceId`,
        `officeId` or `workspaceId`. If you send more than one, only the first
        in that order is applied and the others are ignored without an error.
        `from` and `to` combine with any of them.

        Paginated with a cursor. Take the last entry's `id` from one page and
        send it as `startAfter` to get the next.

        This list is the money. The figures on
        [Get estimated compute spend](/docs/api-reference/billing/compute/getComputeSpendSummary)
        are a running time estimate at today's price, and do not match it.

        **Permission:** `billing:read` @ `console`
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            How many lines to return. Defaults to 50. Values below 1 are raised
            to 1 and values above 200 are lowered to 200, without an error.
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: startAfter
          in: query
          required: false
          description: |
            The `id` of the last line on the previous page. Omit for the first
            page. **An ID that does not exist is ignored** and you get the first
            page again, so stop when `hasMore` is false rather than when a page
            repeats.
          schema: { type: string }
        - name: from
          in: query
          required: false
          description: |
            Only hours that started at or after this time, in epoch
            milliseconds. Compared with `hourStartMs`.
          schema: { type: integer }
        - name: to
          in: query
          required: false
          description: |
            Only hours that started before this time, in epoch milliseconds.
            Not included.
          schema: { type: integer }
        - name: serviceId
          in: query
          required: false
          description: |
            Only this Humanik Cloud service. From
            [List services](/docs/api-reference/cloud/services/listCloudServices).
            Wins over `officeId` and `workspaceId` when more than one is sent.
          schema: { type: string }
        - name: officeId
          in: query
          required: false
          description: |
            Only the machine time of this office. From
            [List offices](/docs/api-reference/offices/offices/listOffices).
            Ignored when `serviceId` is sent.
          schema: { type: string }
        - name: workspaceId
          in: query
          required: false
          description: |
            Only offices in this workspace. From
            [List workspaces](/docs/api-reference/workspaces/workspaces/listWorkspaces).
            Web services, browsers and containers belong to no workspace, so
            they never match. Ignored when `serviceId` or `officeId` is sent.
          schema: { type: string }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/ComputeCharge' }
                  hasMore:
                    type: boolean
                    description: Whether another page exists.
                required: [success, entries, hasMore]
              examples:
                oneOffice:
                  value:
                    success: true
                    hasMore: true
                    entries:
                      - id: nt_7Qp2_1792252800000_svc_4f9a
                        billId: nt_7Qp2_1792252800000
                        serviceId: svc_4f9a
                        serviceType: cloudClaw
                        officeId: off_9c1e7d
                        workspaceId: ws_a1b2c3
                        hourStartMs: 1792252800000
                        hourEndMs: 1792256400000
                        seconds: 3600
                        rate: 0.12
                        amountUsd: 0.12
                        chargedAt: '2026-10-18T14:02:11.418Z'
                        origin:
                          kind: office
                          service: { id: svc_4f9a, name: research-office, type: cloudClaw, projectId: prj_2b7d }
                          office: { id: off_9c1e7d, name: Research, workspaceId: ws_a1b2c3, workspaceName: Operations }
                          missing: []
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /billing/compute/series:
    get:
      operationId: getComputeChargeSeries
      summary: Get a compute charge series
      tags: [Compute]
      description: |
        The machine time taken from your credit, bucketed over a window you
        choose, for charts.

        Both bounds are **required**, as epoch milliseconds. The window includes
        `from` and excludes `to`.

        **Buckets use the same keys as
        [Get a usage series](/docs/api-reference/billing/usage/getUsageSeries)**
        for the same `from`, `to`, `granularity` and `timezone`. To chart model
        use and machine time together, make both calls with the same values and
        join the buckets on `key`. Nothing on the server adds them into one
        figure.

        Each charge counts in the bucket of **the hour the machine ran**, not
        the time it was charged. The 23:00 hour is charged a few minutes after
        midnight and still counts on the day it ran.

        The window is adjusted rather than refused. A `to` at or before `from`
        becomes `from` plus one day, and a window longer than 750 days is
        shortened from the start. The `fromMs` and `toMs` on the response are
        the window actually used.

        **Permission:** `billing:read` @ `console`
      parameters:
        - name: from
          in: query
          required: true
          description: Start of the window, epoch milliseconds.
          schema: { type: integer }
        - name: to
          in: query
          required: true
          description: End of the window, epoch milliseconds. Not included.
          schema: { type: integer }
        - name: granularity
          in: query
          required: false
          description: |
            Bucket size. Defaults to `auto`, which picks `hour` for a window of
            up to 2 days, `day` for up to 92 days, and `month` beyond that. It
            never picks `week`. Anything unrecognised is treated as `auto`
            rather than rejected, and the bucket size actually used comes back
            on the response.
          schema:
            type: string
            enum: [hour, day, week, month, auto]
            default: auto
        - name: timezone
          in: query
          required: false
          description: |
            An IANA timezone name. Decides where day, week and month boundaries
            fall. Weeks start on Monday. Defaults to UTC. **A name that is not a
            real timezone fails with `500`**, not `400`.
          schema: { type: string, examples: ['America/Toronto'] }
        - name: serviceId
          in: query
          required: false
          description: |
            Only this Humanik Cloud service. From
            [List services](/docs/api-reference/cloud/services/listCloudServices).
            Omit it for the whole account.
          schema: { type: string }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  granularity:
                    type: string
                    enum: [hour, day, week, month]
                    description: The bucket size used, which may differ from what you asked for.
                  fromMs:
                    type: integer
                    description: Start of the window actually used.
                  toMs:
                    type: integer
                    description: End of the window actually used. Not included.
                  buckets:
                    type: array
                    description: |
                      Every bucket in the window, oldest first, including ones
                      with nothing charged.
                    items: { $ref: '#/components/schemas/ComputeChargeBucket' }
                  totals:
                    type: object
                    description: The whole window.
                    properties:
                      computeUsd: { type: number, description: US dollars taken from credit. }
                      runtimeMs: { type: integer, description: Machine time charged, in milliseconds. }
                      lineCount: { type: integer, description: Charge lines counted. One per service per hour. }
                required: [success, granularity, fromMs, toMs, buckets, totals]
              examples:
                twoDays:
                  value:
                    success: true
                    granularity: day
                    fromMs: 1792195200000
                    toMs: 1792368000000
                    buckets:
                      - { key: '2026-10-17', label: '10/17', computeUsd: 2.88, runtimeMs: 86400000, lineCount: 24 }
                      - { key: '2026-10-18', label: '10/18', computeUsd: 1.44, runtimeMs: 43200000, lineCount: 12 }
                    totals: { computeUsd: 4.32, runtimeMs: 129600000, lineCount: 36 }
        '400':
          description: '`from` or `to` is missing or not a number.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                missing:
                  value:
                    success: false
                    error: from and to (epoch ms) are required
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /billing/compute/bills:
    get:
      operationId: listComputeBills
      summary: List compute bills
      tags: [Compute]
      description: |
        The hourly bills for machine time, newest hour first. One bill covers
        every service that ran in that hour.

        Each bill records the balance before the charge, the balance right
        after it, and what happened next: whether
        [automatic top up](/docs/api-reference/billing/credit/updateAutoReload)
        ran, and whether the account was left in credit.

        **The balance can go below zero.** A bill is always taken in full, even
        when it is more than the balance. When the balance is still below zero
        after any top up, `standing` is `negative` and **Humanik Cloud stops
        your running machines** and will not start new ones until the balance
        is back to at least $1. While starts are paused, a request to a sleeping
        service answers `402` with an `error` that says so. Adding credit is
        enough: the next start checks the balance and goes ahead. This list is
        how you find out why your machines stopped.

        `balanceUsd`, `refill` and `standing` are written after the top up
        attempt. In the rare case the charge was taken but that step did not
        finish, they are `null`, and `balanceAfterDebitUsd` is the last balance
        recorded.

        Paginated with a cursor. Take the last bill's `billId` from one page and
        send it as `startAfter` to get the next.

        **Permission:** `billing:read` @ `console`
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            How many bills to return. Defaults to 50. Values below 1 are raised
            to 1 and values above 200 are lowered to 200, without an error.
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: startAfter
          in: query
          required: false
          description: |
            The `billId` of the last bill on the previous page. Omit for the
            first page. **An ID that does not exist is ignored** and you get the
            first page again.
          schema: { type: string }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  bills:
                    type: array
                    items: { $ref: '#/components/schemas/ComputeBill' }
                  hasMore:
                    type: boolean
                    description: Whether another page exists.
                required: [success, bills, hasMore]
              examples:
                toppedUp:
                  value:
                    success: true
                    hasMore: false
                    bills:
                      - billId: nt_7Qp2_1792252800000
                        hourStartMs: 1792252800000
                        hourEndMs: 1792256400000
                        chargedUsd: 0.36
                        lineCount: 3
                        balanceBeforeUsd: 10.2
                        balanceAfterDebitUsd: 9.84
                        balanceUsd: 59.84
                        refill: { status: succeeded, amountUsd: 50 }
                        standing: ok
                        chargedAt: '2026-10-18T14:02:11.418Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /billing/compute/by-service:
    get:
      operationId: getComputeByService
      summary: Get compute charges by service
      tags: [Compute]
      description: |
        What each service took from your credit over a window, with the machine
        time and the number of hours charged. Sorted by amount, largest first.

        Both bounds are **required**, as epoch milliseconds. The window includes
        `from` and excludes `to`, and is compared with the hour each charge is
        for, the same rule as
        [Get a compute charge series](/docs/api-reference/billing/compute/getComputeChargeSeries),
        so a month here equals that month on a chart.

        **Services are returned by ID only.** To show names, match `serviceId`
        against [List services](/docs/api-reference/cloud/services/listCloudServices),
        or read the `origin` on
        [List compute charges](/docs/api-reference/billing/compute/listComputeCharges).
        Only services charged in the window appear.

        Unlike the series, the window is not adjusted. A `to` at or before
        `from` returns an empty list, and there is no maximum length.

        **Permission:** `billing:read` @ `console`
      parameters:
        - name: from
          in: query
          required: true
          description: Start of the window, epoch milliseconds.
          schema: { type: integer }
        - name: to
          in: query
          required: true
          description: End of the window, epoch milliseconds. Not included.
          schema: { type: integer }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  fromMs: { type: integer, description: The `from` you sent. }
                  toMs: { type: integer, description: The `to` you sent. }
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        serviceId:
                          type: string
                          description: |
                            The Humanik Cloud service. Matches `serviceId` on
                            [List services](/docs/api-reference/cloud/services/listCloudServices).
                        computeUsd: { type: number, description: US dollars taken from credit. }
                        runtimeMs: { type: integer, description: Machine time charged, in milliseconds. }
                        hourCount: { type: integer, description: Hours charged for this service. }
                      required: [serviceId, computeUsd, runtimeMs, hourCount]
                  totals:
                    type: object
                    properties:
                      computeUsd: { type: number }
                      runtimeMs: { type: integer }
                      hourCount: { type: integer }
                required: [success, fromMs, toMs, services, totals]
              examples:
                month:
                  value:
                    success: true
                    fromMs: 1790812800000
                    toMs: 1793491200000
                    services:
                      - { serviceId: svc_4f9a, computeUsd: 41.76, runtimeMs: 1252800000, hourCount: 348 }
                      - { serviceId: svc_8e21, computeUsd: 3.1, runtimeMs: 279000000, hourCount: 81 }
                    totals: { computeUsd: 44.86, runtimeMs: 1531800000, hourCount: 429 }
        '400':
          description: '`from` or `to` is missing or not a number.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                missing:
                  value:
                    success: false
                    error: from and to (epoch ms) are required
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /nexus/billing/summary:
    get:
      operationId: getComputeSpendSummary
      summary: Get estimated compute spend
      tags: [Compute]
      description: |
        Running time for the current period, and an **estimate** of what it
        costs at today's price, per service.

        **This is not what you paid.** Machine time is taken from your credit
        once an hour, and those charges are the money. For them, use
        [List compute charges](/docs/api-reference/billing/compute/listComputeCharges),
        [List compute bills](/docs/api-reference/billing/compute/listComputeBills),
        [Get a compute charge series](/docs/api-reference/billing/compute/getComputeChargeSeries)
        or [Get compute charges by service](/docs/api-reference/billing/compute/getComputeByService).
        The estimate here is useful for seeing what is running now. Running
        time is recorded every five minutes, and once more when a machine
        stops.

        **The per service split is opt in.** Without `includeServices=true`
        the response carries only `summary`. With it, `summary.services` is
        filled in, and two more lists are added: `offices`, the services
        matched to an office with its name and workspace, and `misc`, anything
        running that is not an office.

        **Permission:** `billing:read` @ `console`
      parameters:
        - name: includeServices
          in: query
          required: false
          description: |
            Send `true` to get the per service breakdown, `offices` and
            `misc`. Any other value, or none, returns `summary` alone.
          schema: { type: string, enum: ['true'] }
        - name: periodId
          in: query
          required: false
          description: |
            The period to report. Omit it for the current one. The value is
            the `periodId` returned on an earlier `summary`.
          schema: { type: string }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  summary:
                    type: object
                    description: Account level running time and estimate for the period.
                    properties:
                      periodId:
                        type: string
                        description: The period reported. Send it back as `periodId` to ask for it again.
                      totalRuntimeMs:
                        type: number
                        description: Machine time recorded in the period, in milliseconds.
                      totalAccruedUsd:
                        type: number
                        description: The estimate for the period at today's price. Not what was taken from credit.
                      activeSessionCount:
                        type: integer
                        description: Sessions running now.
                      totalSessionCount:
                        type: integer
                        description: Sessions in the period.
                      status:
                        type: string
                        description: The period's state, as reported by Humanik Cloud.
                      carriedForwardUsd:
                        type: number
                        description: Part of the estimate. Not a charge to your credit.
                      services:
                        type: array
                        description: Present only with `includeServices=true`.
                        items: { $ref: '#/components/schemas/ComputeEstimateService' }
                    additionalProperties: true
                  offices:
                    type: array
                    description: |
                      Present only with `includeServices=true`. Services
                      matched to an office: each entry is the service's
                      estimate plus the office fields below.
                    items:
                      allOf:
                        - $ref: '#/components/schemas/ComputeEstimateService'
                        - type: object
                          properties:
                            officeId: { type: string }
                            officeName: { type: string }
                            workspaceId: { type: string }
                            workspaceName: { type: [string, 'null'] }
                            projectId:
                              type: [string, 'null']
                              description: The Humanik Cloud project the office's service is in.
                  misc:
                    type: array
                    description: |
                      Present only with `includeServices=true`. Services with
                      no matching office, such as web services and cloud
                      browsers.
                    items: { $ref: '#/components/schemas/ComputeEstimateService' }
                required: [success, summary]
              examples:
                withServices:
                  value:
                    success: true
                    summary:
                      periodId: '2026-10'
                      totalRuntimeMs: 1252800000
                      totalAccruedUsd: 41.76
                      activeSessionCount: 1
                      totalSessionCount: 37
                      carriedForwardUsd: 0
                      services:
                        - { serviceId: svc_4f9a, serviceName: research-office, serviceType: cloudClaw, totalRuntimeMs: 1252800000, estimatedCostUsd: 41.76, isActive: true, sessionCount: 37 }
                    offices:
                      - { serviceId: svc_4f9a, serviceName: research-office, serviceType: cloudClaw, totalRuntimeMs: 1252800000, estimatedCostUsd: 41.76, isActive: true, sessionCount: 37, officeId: off_9c1e7d, officeName: Research, workspaceId: ws_a1b2c3, workspaceName: Operations, projectId: prj_2b7d }
                    misc: []
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /nexus/billing/services/{serviceId}/usage:
    parameters:
      - name: serviceId
        in: path
        required: true
        description: |
          The Humanik Cloud service. From
          [List services](/docs/api-reference/cloud/services/listCloudServices),
          or `serviceId` on
          [List compute charges](/docs/api-reference/billing/compute/listComputeCharges).
        schema: { type: string }
    get:
      operationId: getComputeServiceUsage
      summary: Get usage for one service
      tags: [Compute]
      description: |
        What one service cost, bucketed by day, week or month: the machine time
        **charged** from your credit, and, when the service runs an office, that
        employee's own model use in the same buckets.

        The compute figures come from the hourly charges, the same ones as
        [List compute charges](/docs/api-reference/billing/compute/listComputeCharges),
        so they are money, not an estimate. Each charge counts in the bucket of
        the hour the machine ran. The hour in progress has not been charged
        yet, and hours from before compute billing started show zero.

        The window always ends with the bucket that holds now, which is
        partial, and goes back `count` buckets.

        **Model use is the employee's own work only.** Nova working inside the
        office is listed in `novaInOffice` and is not added to the buckets,
        because that spend belongs to the person chatting with Nova.

        A service that does not exist, or is not on your account, returns
        zeros rather than `404`.

        **Permission:** `billing:read` @ `console`
      parameters:
        - name: granularity
          in: query
          required: false
          description: Bucket size. Defaults to `month`. Anything else is treated as `month`.
          schema: { type: string, enum: [day, week, month], default: month }
        - name: count
          in: query
          required: false
          description: |
            How many buckets. For `day` 1 to 90, default 30. For `week` 1 to
            26, default 12. For `month` 1 to 12, default 6. Values outside the
            range are moved into it without an error.
          schema: { type: integer }
        - name: timezone
          in: query
          required: false
          description: |
            An IANA timezone name. Decides where day, week and month boundaries
            fall. Weeks start on Monday. Defaults to UTC, and a name that is
            not a real timezone is treated as UTC.
          schema: { type: string, examples: ['America/Toronto'] }
        - name: months
          in: query
          required: false
          description: Kept for older clients. The same as `count` when `count` is not sent.
          schema: { type: integer }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  service:
                    type: 'null'
                    description: Always `null`. Read the service's name from [Get a service](/docs/api-reference/cloud/services/getCloudService).
                  office:
                    description: The office this service runs, or `null` when it runs no office.
                    oneOf:
                      - type: object
                        properties:
                          id: { type: string }
                          name: { type: string }
                          workspaceId: { type: string }
                          workspaceName: { type: [string, 'null'] }
                          projectId: { type: [string, 'null'] }
                        required: [id, name, workspaceId, workspaceName, projectId]
                      - type: 'null'
                  granularity:
                    type: string
                    enum: [day, week, month]
                  timezone:
                    type: string
                    description: The timezone the buckets were cut in.
                  buckets:
                    type: array
                    description: Oldest first. The last bucket is the current one, and is partial.
                    items: { $ref: '#/components/schemas/ServiceUsageBucket' }
                  months:
                    type: array
                    description: |
                      Kept for older clients. With `granularity=month`, the
                      same buckets with `periodId` (equal to `key`) added.
                      Empty for any other granularity.
                    items:
                      allOf:
                        - $ref: '#/components/schemas/ServiceUsageBucket'
                        - type: object
                          properties:
                            periodId: { type: string }
                  computeSource:
                    type: string
                    const: charged
                    description: Says the compute figures are charges taken from credit.
                  recentRuns:
                    type: array
                    description: Up to 20 of the employee's most recent model use records in the window, newest first.
                    items: { $ref: '#/components/schemas/UsageEntry' }
                  novaInOffice:
                    type: array
                    description: Up to 20 recent records of Nova working in this office. Not counted in the buckets.
                    items: { $ref: '#/components/schemas/UsageEntry' }
                  asOf:
                    type: string
                    format: date-time
                    description: When the figures were read.
                required: [success, service, office, granularity, timezone, buckets, months, computeSource, recentRuns, novaInOffice, asOf]
              examples:
                twoDays:
                  value:
                    success: true
                    service: null
                    office: { id: off_9c1e7d, name: Research, workspaceId: ws_a1b2c3, workspaceName: Operations, projectId: prj_2b7d }
                    granularity: day
                    timezone: America/Toronto
                    buckets:
                      - { key: '2026-10-17', startMs: 1792209600000, computeUsd: 2.88, runtimeMs: 86400000, hourCount: 24, llmBilledUsd: 1.12, llmByokEstimateUsd: 0, llmRunCount: 9 }
                      - { key: '2026-10-18', startMs: 1792296000000, computeUsd: 1.44, runtimeMs: 43200000, hourCount: 12, llmBilledUsd: 0.37, llmByokEstimateUsd: 0, llmRunCount: 3 }
                    months: []
                    computeSource: charged
                    recentRuns: []
                    novaInOffice: []
                    asOf: '2026-10-18T15:20:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /nexus/billing/invoices:
    get:
      operationId: listComputeInvoices
      summary: List compute invoices
      tags: [Compute]
      description: |
        Period records for machine time, kept by Humanik Cloud.

        **These are not what was taken from your credit.** Machine time is paid
        once an hour from your credit balance, and each of those charges is on
        [List compute bills](/docs/api-reference/billing/compute/listComputeBills).
        They are also separate from
        [credit invoices](/docs/api-reference/billing/usage/listInvoices),
        which record credit added.

        **Permission:** `billing:read` @ `console`
      parameters:
        - name: status
          in: query
          required: false
          description: Only records with this status.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: How many to return.
          schema: { type: integer }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  invoices:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                      additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /nexus/billing/invoices/{invoiceId}:
    parameters:
      - name: invoiceId
        in: path
        required: true
        description: |
          IDs come from
          [List compute invoices](/docs/api-reference/billing/compute/listComputeInvoices).
        schema: { type: string }
    get:
      operationId: getComputeInvoice
      summary: Get a compute invoice
      tags: [Compute]
      description: |
        One period record for machine time, itemised by service. Each line item
        that belongs to an office also carries `officeId` and `officeName`,
        which are `null` otherwise.

        Like the list, this is not what was taken from your credit. See
        [List compute bills](/docs/api-reference/billing/compute/listComputeBills)
        for the hourly charges.

        An ID that cannot be read answers `500`, not `404`.

        **Permission:** `billing:read` @ `console`
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  invoice:
                    type: object
                    properties:
                      lineItems:
                        type: array
                        items:
                          type: object
                          properties:
                            serviceId: { type: string }
                            officeId: { type: [string, 'null'] }
                            officeName: { type: [string, 'null'] }
                          additionalProperties: true
                    additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The record came back with no invoice in it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /nexus/billing/service-config/{serviceId}:
    parameters:
      - name: serviceId
        in: path
        required: true
        description: |
          The service to act on. IDs come from
          [List services](/docs/api-reference/cloud/services/listCloudServices),
          and appear as `serviceId` on
          [List compute charges](/docs/api-reference/billing/compute/listComputeCharges).
        schema: { type: string }

    get:
      operationId: getComputeServiceConfig
      summary: Get a service's settings
      tags: [Compute]
      description: |
        The size and sleep settings that decide what a service costs while
        awake, and the sizes it can be set to.

        For an office, prefer the office route, which is narrower and can be
        granted to someone responsible for one employee. See
        [Humanik Cloud](/docs/api-reference/cloud).

        A service that cannot be read answers `500`, not `404`.

        **Permission:** `billing:read` @ `console`
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  config:
                    type: object
                    properties:
                      serviceId: { type: string }
                      serviceName: { type: string }
                      serviceType: { type: string }
                      userConfig:
                        type: object
                        description: The settings you can change, for example `instanceType` and `idleTimeoutMinutes`.
                        properties:
                          instanceType: { type: string }
                          idleTimeoutMinutes: { type: number }
                        additionalProperties: true
                      instanceTypes:
                        type: array
                        description: The sizes this service can be set to.
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: The value to send as `instanceType`.
                            displayName: { type: string }
                            tier: { type: string }
                            cpuKind: { type: string }
                            cpus: { type: number }
                            memoryMb: { type: number }
                            description: { type: string }
                    required: [serviceId, serviceName, serviceType, userConfig]
                required: [success, config]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    put:
      operationId: updateComputeServiceConfig
      summary: Change a service's settings
      tags: [Compute]
      description: |
        Changes size and sleep behaviour, which is the lever you have on
        machine cost. A smaller machine costs less per hour awake, and a
        shorter idle timeout means fewer hours awake.

        **No budget limits compute spend.** The only automatic stop is your
        credit balance going below zero after an hourly charge, which stops
        every machine on the account. To hold the cost down, make services
        smaller and let them sleep sooner. A machine already running keeps the
        price it started with, and a new size's price applies to the next
        machine started.

        **Permission:** `billing:manage` @ `console`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userConfig:
                  type: object
                  additionalProperties: true
                  description: |
                    Required. The settings to apply, for example
                    `{ "instanceType": "pro", "idleTimeoutMinutes": 20 }`. Read
                    the current ones with
                    [Get a service's settings](/docs/api-reference/billing/compute/getComputeServiceConfig)
                    first and send them back changed.
              required: [userConfig]
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '400':
          description: '`userConfig` is missing.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                missing:
                  value:
                    success: false
                    error: userConfig is required
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: |
            Server side failure, including a setting Humanik Cloud refused.
            Safe to retry with backoff.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
