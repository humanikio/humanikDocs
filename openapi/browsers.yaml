openapi: 3.1.0

info:
  title: HumanikOS API — Browsers
  version: v1
  summary: Cloud browsers an AI employee drives the way a person would.
  description: |
    A humaBrowser is a real Chromium running in the cloud, with a persistent
    profile and its own identity. It exists because some systems have no API to
    integrate with: a supplier portal, a bank, a regulator's site. There is
    nothing to connect to, so the employee drives the browser instead.

    **Browsers carry a second access layer.** Permissions decide what class of
    action you may perform; membership decides which browsers you may touch at
    all. Both must pass. A browser holds live logged in sessions, so access by
    virtue of holding a broad role is deliberately not enough.

    Every fact in this document is resolved from `hos-api` source. Endpoints
    whose request or response shape has not been verified are absent rather than
    guessed at.

# `servers` is injected at load time from NEXT_PUBLIC_HOS_API_URL.
# See src/lib/openapi.ts. Do not add a host here.

security:
  - ServiceAccountKey: []

tags:
  - name: Browsers
    description: Create, read, update, and delete a cloud browser.
  - name: Members
    description: Who may reach a browser. The second access layer.
  - name: Machine
    description: Waking, restarting, and shutting down the VM.
  - name: Driving
    description: Navigating pages and talking to the agent.
  - name: Sessions
    description: Chats, messages, and the cycles behind them.
  - name: Identity
    description: The browser's own service account credential.
  - name: Scripts
    description: Saved automations a browser can replay.
  - name: Environment secrets
    description: Credentials injected into the browser at boot.
  - name: Namespaces
    description: Data the browser is allowed to reach.
  - name: Model provider
    description: Whose model account this browser spends.

components:
  securitySchemes:
    ServiceAccountKey:
      type: http
      scheme: bearer
      description: A service account API key, sent whole as a bearer token.

  parameters:
    BrowserId:
      name: browserId
      in: path
      required: true
      description: 'The browser. From [List browsers](/docs/api-reference/browsers/browsers/listBrowsers).'
      schema:
        type: string
        examples: [bwr_a1b2c3d4]

  schemas:
    Error:
      type: object
      description: '`error` is a human readable string, not a stable machine code.'
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
        message:
          type: string
      required: [success, error]

    Forbidden:
      type: object
      description: |
        A denial. Can come from the permission gate or from the membership
        layer, and the message says which.
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
          const: Forbidden
        message:
          type: string
        action:
          type: string
        resource:
          type: string
      required: [success, error]

    Script:
      type: object
      properties:
        scriptId: { type: string }
        browserId: { type: string }
        name: { type: string }
        description: { type: string }
        source:
          type: string
          description: The script body.
        timeoutMs:
          type: integer
          description: How long a run may take before it is abandoned.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Browser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        mode:
          type: string
        status:
          type: string
        workspaceId:
          type: string
        proxyRegion:
          type: string
        browserEngine:
          type: string
        isMember:
          type: boolean
          description: |
            Present on list rows only. Whether the caller is a member, so a UI
            can show a browser it may not open.
      required: [id, name]

  responses:
    BadRequest:
      description: The request is malformed or a required field is missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: The key is missing, unknown, inactive, or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: |
        Either the permission gate or the membership layer refused. Both apply to
        most routes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Forbidden'

    ServerError:
      description: Server side failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /browsers:
    get:
      tags: [Browsers]
      summary: List browsers
      operationId: listBrowsers
      description: |
        Lists browsers. Requires `browser:read`.

        **No membership filter.** Every row the caller's role can see is
        returned, each carrying an `isMember` flag, so a console can show a
        browser and still refuse to open it. Listing is not access.

        Pass `workspaceId` to scope to one workspace, which is what a
        workspace-bounded role needs. Omit it and the permission is checked at
        console scope instead.
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
        - name: ownerId
          in: query
          required: false
          description: 'Filter to browsers owned by one user. A user ID, from `GET /users`.'
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Browsers visible to the caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  browsers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Browser'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Browsers]
      summary: Create a browser
      operationId: createBrowser
      description: |
        Creates a cloud browser and provisions its machine. Requires
        `browser:manage` at `console`, because there is no browser to scope to
        yet.

        The service account credential is minted eagerly and **non-blocking**: if
        that mint fails the browser is still created, and
        `POST /browsers/{browserId}/api-keys/provision` is the repair path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                mode:
                  type: string
                flyRegion:
                  type: string
                proxyRegion:
                  type: string
                aupVersion:
                  type: string
                  description: The acceptable use policy version accepted at creation.
                browserEngine:
                  type: string
                fingerprint:
                  type: object
                typingProfile:
                  type: object
      responses:
        '201':
          description: Created. The credential may still be missing.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /browsers/{browserId}:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    get:
      tags: [Browsers]
      summary: Get a browser
      operationId: getBrowser
      description: |
        Requires `browser:read` **and** membership, with a manager bypass: a
        holder of `browser:manage` can read it in order to administer it.
      responses:
        '200':
          description: The browser.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      tags: [Browsers]
      summary: Update a browser
      operationId: updateBrowser
      description: |
        Requires `browser:manage`. No membership needed: governance is separate
        from use.

        **Moving a browser to another workspace is gated twice.** Changing
        `workspaceId` triggers a second check inside the handler for
        `browser:manage` on the **destination** workspace, and returns 403 with
        *"You need browser:manage on the destination workspace to move a browser
        there"* if the caller lacks it. Holding it on the source is not enough.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                mode:
                  type: string
                status:
                  type: string
                ipTier:
                  type: string
                proxyRegion:
                  type: string
                browserEngine:
                  type: string
                fingerprint:
                  type: object
                typingProfile:
                  type: object
                workspaceId:
                  type: string
                  description: Changing this moves the browser and needs permission on the destination.
      responses:
        '200':
          description: Updated.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The permission gate refused, on the source or the destination workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [Browsers]
      summary: Delete a browser
      operationId: deleteBrowser
      description: Requires `browser:manage`. Destroys the machine and its profile.
      responses:
        '200':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/members:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    get:
      tags: [Members]
      summary: List members
      operationId: listBrowserMembers
      description: |
        Who currently has access to this browser. Requires `browser:read` and
        membership, manager bypass allowed.

        Each row carries `memberId`, `memberType` (`human` or `office`),
        `displayName`, and `role`. **This is where you get the `memberId` needed
        to [revoke access](/docs/api-reference/browsers/members/removeBrowserMember).**
      responses:
        '200':
          description: The members.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Members]
      summary: Grant access to a browser
      operationId: addBrowserMember
      description: |
        Adds a member, which is how access to a browser is granted. Requires
        `browser:manage`. Accepts a service account key, so this is automatable.

        **This is how an office gets a browser.** Browser access is membership
        based, not an office attachment, so there is no allocation endpoint on
        the office side.
        [List allocated browsers](/docs/api-reference/offices/allocations/listOfficeBrowsers)
        is the office side view of grants made here.

        ## Two kinds of member

        One endpoint, two shapes. `memberType` decides which, and it defaults to
        `human`.

        | | `memberType: "human"` | `memberType: "office"` |
        | --- | --- | --- |
        | `memberId` is | A user ID | An office ID |
        | `workspaceId` | Not used | **Required** |
        | `role` | `owner` or `user` | Forced to `user` |
        | Verified against | `users` in the tenant | `offices` in that workspace |

        **An office can never be an owner.** Passing `role: "owner"` with
        `memberType: "office"` is accepted and silently downgraded to `user`.
        Ownership of a browser stays with a person.

        ## Where the IDs come from

        Neither ID is one you invent. Fetch it first.

        **Office ID** — [List offices](/docs/api-reference/offices/offices/listOffices):

        ```bash
        curl "$HOS_API/offices?workspaceId=ws_a1b2c3" \
          -H "Authorization: Bearer $HOS_KEY"
        ```

        Take `offices[].id`, and use the same `workspaceId` in the body below.

        **User ID** — `GET /users`, which needs `users:read` at console scope and
        a signed in user. Take the user's `id`.

        ## Granting to an office

        ```bash
        curl -X POST "$HOS_API/browsers/bwr_a1b2c3d4/members" \
          -H "Authorization: Bearer $HOS_KEY" \
          -H "Content-Type: application/json" \
          -d '{
            "memberId": "off_9c1e7d",
            "memberType": "office",
            "workspaceId": "ws_a1b2c3"
          }'
        ```

        ## Granting to a person

        ```bash
        curl -X POST "$HOS_API/browsers/bwr_a1b2c3d4/members" \
          -H "Authorization: Bearer $HOS_KEY" \
          -H "Content-Type: application/json" \
          -d '{
            "memberId": "usr_4b8c2e",
            "memberType": "human",
            "role": "user"
          }'
        ```

        `displayName` is optional in both cases. Omitted, it is resolved from the
        office or user record, so the member list stays readable without you
        maintaining a second copy of the name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                memberId:
                  type: string
                  description: |
                    The office ID or user ID being granted access. Get it from
                    `GET /offices` or `GET /users` — see above.
                  examples: [off_9c1e7d]
                memberType:
                  type: string
                  enum: [human, office]
                  default: human
                  description: Which kind of identity `memberId` refers to.
                workspaceId:
                  type: string
                  description: |
                    **Required when `memberType` is `office`.** The workspace the
                    office belongs to. Unused for a human.
                  examples: [ws_a1b2c3]
                role:
                  type: string
                  enum: [owner, user]
                  default: user
                  description: |
                    Forced to `user` for an office. Only a human can be an owner.
                displayName:
                  type: string
                  description: |
                    Optional. Resolved from the office or user record when
                    omitted.
              required: [memberId]
      responses:
        '201':
          description: Access granted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  member:
                    type: object
                    properties:
                      memberId:
                        type: string
                      memberType:
                        type: string
                      displayName:
                        type: string
                      role:
                        type: string
                      workspaceId:
                        type: string
                        description: Present for an office member only.
        '400':
          description: |
            A required field is missing, the identity does not exist, or it is
            already a member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingId:
                  value:
                    success: false
                    error: memberId is required
                missingWorkspace:
                  summary: memberType is office with no workspaceId
                  value:
                    success: false
                    error: workspaceId is required when memberType is office
                noUser:
                  value:
                    success: false
                    error: User not found in tenant
                noOffice:
                  summary: The office is not in the workspace you named
                  value:
                    success: false
                    error: Office not found in workspace
                duplicateOffice:
                  value:
                    success: false
                    error: Office is already allocated to this browser
                duplicateUser:
                  value:
                    success: false
                    error: User is already a member of this browser
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
      - name: memberId
        in: path
        required: true
        description: |
          The office ID or user ID that was granted access. Get it from
          `GET /browsers/{browserId}/members`.
        schema:
          type: string
          examples: [off_9c1e7d]
    delete:
      tags: [Members]
      summary: Revoke access to a browser
      operationId: removeBrowserMember
      description: |
        Removes a member, revoking access. Requires `browser:manage`.

        This is the only way to take a browser away from an office. The office
        side listing cannot be edited, because it is a view rather than a grant.

        ## Get the member ID first

        `memberId` in the path is the office ID or user ID that was granted
        access. If you do not have it,
        [list the members](/docs/api-reference/browsers/members/listBrowserMembers):

        ```bash
        curl "$HOS_API/browsers/bwr_a1b2c3d4/members" \
          -H "Authorization: Bearer $HOS_KEY"
        ```

        Each row carries `memberId`, `memberType`, and `displayName`, so you can
        tell an office from a person before revoking.

        ## Revoke

        ```bash
        curl -X DELETE "$HOS_API/browsers/bwr_a1b2c3d4/members/off_9c1e7d" \
          -H "Authorization: Bearer $HOS_KEY"
        ```

        No `workspaceId` is needed here even for an office. The member ID alone
        identifies the grant.
      responses:
        '200':
          description: Access revoked.
        '404':
          description: No such member on this browser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    success: false
                    error: Member not found
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/machine/wake:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    post:
      tags: [Machine]
      summary: Wake the machine
      operationId: wakeBrowserMachine
      description: |
        Requires `browser:use` **and** membership. No manager bypass: running a
        browser is a member action.
      responses:
        '200':
          description: Waking.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/machine/shutdown:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    post:
      tags: [Machine]
      summary: Shut down the machine
      operationId: shutdownBrowserMachine
      description: Requires `browser:use` and membership. No manager bypass.
      responses:
        '200':
          description: Shutting down.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/machine/restart:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    post:
      tags: [Machine]
      summary: Restart the machine
      operationId: restartBrowserMachine
      description: |
        Requires `browser:use`, with **manager bypass** unlike wake and shutdown.

        Restart is the apply-credential-changes lever. A manager who provisioned
        secrets needs to cold boot the VM for them to take effect, even when they
        are not a member of the browser themselves.
      responses:
        '200':
          description: Restarting.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/page/navigate:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    post:
      tags: [Driving]
      summary: Navigate to a URL
      operationId: navigateBrowserPage
      description: |
        Drives Chromium directly. Requires `browser:use` and membership.

        This is the raw control surface. The agent has its own path through
        `POST /browsers/{browserId}/agent/message`.
      responses:
        '200':
          description: Navigating.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/page/back:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    post:
      tags: [Driving]
      summary: Go back
      operationId: browserPageBack
      responses:
        '200':
          description: Navigated.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/page/forward:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    post:
      tags: [Driving]
      summary: Go forward
      operationId: browserPageForward
      responses:
        '200':
          description: Navigated.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/page/reload:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    post:
      tags: [Driving]
      summary: Reload the page
      operationId: browserPageReload
      responses:
        '200':
          description: Reloading.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/agent/message:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    post:
      tags: [Driving]
      summary: Send a message to the agent
      operationId: sendBrowserAgentMessage
      description: |
        Gives the browser agent an instruction. Requires `browser:use` and
        membership, strictly, with no manager bypass.
      responses:
        '200':
          description: Accepted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/agent/cancel:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    post:
      tags: [Driving]
      summary: Cancel the current cycle
      operationId: cancelBrowserAgentCycle
      description: Stops the agent's current run. Requires `browser:use` and membership.
      responses:
        '200':
          description: Cancelled.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/chats:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    get:
      tags: [Sessions]
      summary: List chats
      operationId: listBrowserChats
      description: |
        Requires `browser:read` and membership, **with no manager bypass**.

        Chats, messages, sessions, and cycles are member only by design:
        governors administer a browser, they do not read what its members did in
        it.
      responses:
        '200':
          description: The chats.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Sessions]
      summary: Create a chat
      operationId: createBrowserChat
      description: Requires `browser:use` and membership.
      responses:
        '201':
          description: Created.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/chats/current:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    put:
      tags: [Sessions]
      summary: Switch the current chat
      operationId: switchBrowserChat
      description: Requires `browser:use` and membership.
      responses:
        '200':
          description: Switched.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/chats/{chatId}:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
      - name: chatId
        in: path
        required: true
        description: 'The chat. From [List chats](/docs/api-reference/browsers/sessions/listBrowserChats).'
        schema:
          type: string
    get:
      tags: [Sessions]
      summary: Get a chat
      operationId: getBrowserChat
      description: Member only. No manager bypass.
      responses:
        '200':
          description: The chat.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Sessions]
      summary: Delete a chat
      operationId: deleteBrowserChat
      description: Requires `browser:use` and membership.
      responses:
        '200':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/chats/{chatId}/messages:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
      - name: chatId
        in: path
        required: true
        description: 'The chat. From [List chats](/docs/api-reference/browsers/sessions/listBrowserChats).'
        schema:
          type: string
    get:
      tags: [Sessions]
      summary: List chat messages
      operationId: listBrowserChatMessages
      description: Member only. No manager bypass.
      responses:
        '200':
          description: The messages.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/sessions:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    get:
      tags: [Sessions]
      summary: List sessions
      operationId: listBrowserSessions
      description: Member only. No manager bypass.
      responses:
        '200':
          description: The sessions.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/sessions/current:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    get:
      tags: [Sessions]
      summary: Get the current session
      operationId: getCurrentBrowserSession
      responses:
        '200':
          description: The session.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
      - name: sessionId
        in: path
        required: true
        description: 'The session. From [List sessions](/docs/api-reference/browsers/sessions/listBrowserSessions).'
        schema:
          type: string
    get:
      tags: [Sessions]
      summary: Get a session
      operationId: getBrowserSession
      responses:
        '200':
          description: The session.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/cycles:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    get:
      tags: [Sessions]
      summary: List agent cycles
      operationId: listBrowserCycles
      description: |
        A cycle is one run of the agent. Member only.

        This is the audit trail for what the employee actually did in the
        browser.
      responses:
        '200':
          description: The cycles.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/cycles/{cycleId}:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
      - name: cycleId
        in: path
        required: true
        description: 'The agent cycle. From [List agent cycles](/docs/api-reference/browsers/sessions/listBrowserCycles).'
        schema:
          type: string
    get:
      tags: [Sessions]
      summary: Get an agent cycle
      operationId: getBrowserCycle
      responses:
        '200':
          description: The cycle.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/chatConfig:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    get:
      tags: [Sessions]
      summary: Get chat configuration
      operationId: getBrowserChatConfig
      description: Member only.
      responses:
        '200':
          description: The configuration.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/api-keys:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    get:
      tags: [Identity]
      summary: Get the browser API key
      operationId: getBrowserApiKey
      description: |
        The browser's own service account credential, sanitised. Requires
        `browser:read`, membership, manager bypass allowed.

        Membership is enforced on every route in this family deliberately. These
        routes hand out credentials, so they are the last place the guard should
        be dropped rather than the first.
      responses:
        '200':
          description: The key record, without the secret.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      operationId: deleteBrowserApiKey
      summary: Delete the credential
      tags: [Identity]
      description: |
        Removes the browser's credential record entirely.

        **This is not the same as revoking.**
        [Revoke the credential](/docs/api-reference/browsers/identity/revokeBrowserApiKey)
        invalidates the key and keeps the record; this removes the record too, so
        there is nothing left to inspect afterwards.

        Prefer revoking when a credential may have leaked and you want a trail.
        Delete when you are decommissioning.

        A browser without a credential cannot act. Mint a new one with
        [Provision a credential](/docs/api-reference/browsers/identity/provisionBrowserApiKey).

        **Permission:** `browser:manage` @ `browser/{browserId}`, plus membership
        or `browser:manage`
      parameters:
        - name: workspaceId
          in: query
          required: true
          description: |
            Required, and note it travels in the query here while
            [Revoke](/docs/api-reference/browsers/identity/revokeBrowserApiKey)
            takes it in the body. IDs come from
            [List workspaces](/docs/api-reference/workspaces/workspaces/listWorkspaces).
          schema: { type: string }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '400':
          description: '`workspaceId` is missing.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                missing:
                  value:
                    success: false
                    error: workspaceId is required
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /browsers/{browserId}/api-keys/cycle:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    post:
      tags: [Identity]
      summary: Cycle the browser API key
      operationId: cycleBrowserApiKey
      description: |
        Mints a replacement credential. Requires `browser:manage` and
        membership, manager bypass allowed.

        The new key is returned **once**. The old one keeps working for up to
        five minutes while the validation cache expires.
      responses:
        '200':
          description: The new key. Capture it now.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/api-keys/revoke:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    post:
      tags: [Identity]
      summary: Revoke the browser API key
      operationId: revokeBrowserApiKey
      description: Requires `browser:manage` and membership. Subject to the five minute cache window.
      responses:
        '200':
          description: Revoked.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/api-keys/provision:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    post:
      tags: [Identity]
      summary: Provision a missing browser API key
      operationId: provisionBrowserApiKey
      description: |
        The repair path for a credential that failed to mint at creation.
        Creation is deliberately non-blocking, so a browser can exist without a
        working key.
      responses:
        '201':
          description: Provisioned.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/proxy/countries:
    get:
      tags: [Browsers]
      summary: List proxy countries
      operationId: listProxyCountries
      description: |
        Reference data for choosing a `proxyRegion`. Requires `browser:read` at
        `console`. No membership, since it names no browser.
      responses:
        '200':
          description: Available countries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  countries:
                    type: array
                    items:
                      type: object
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          $ref: '#/components/responses/ServerError'

  /browsers/{browserId}/proxy/config:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    get:
      tags: [Browsers]
      summary: Get proxy configuration
      operationId: getBrowserProxyConfig
      description: Requires `browser:read` and membership, manager bypass allowed.
      responses:
        '200':
          description: The proxy configuration.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Browsers]
      summary: Update proxy configuration
      operationId: updateBrowserProxyConfig
      description: Requires `browser:manage`. Governance, so no membership needed.
      responses:
        '200':
          description: Updated.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/cloud-config:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    get:
      tags: [Machine]
      summary: Get cloud configuration
      operationId: getBrowserCloudConfig
      description: |
        The machine configuration behind the browser. Requires `browser:read`
        and membership, manager bypass allowed.

        Note there is a second, near identical path at
        `/browsers/{browserId}/cloud/config` — one hyphen apart — returning the
        compute configuration. Both exist; check which one you want.
      responses:
        '200':
          description: The configuration.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/cloud/config:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    get:
      tags: [Machine]
      summary: Get compute configuration
      operationId: getBrowserComputeConfig
      description: Requires `browser:read` and membership, manager bypass allowed.
      responses:
        '200':
          description: The compute configuration.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Machine]
      summary: Update compute configuration
      operationId: updateBrowserComputeConfig
      description: Requires `browser:manage`. Governance, so no membership needed.
      responses:
        '200':
          description: Updated.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /browsers/{browserId}/scripts:
    parameters:
      - $ref: '#/components/parameters/BrowserId'

    get:
      operationId: listBrowserScripts
      summary: List scripts
      tags: [Scripts]
      description: |
        Saved automations on this browser.

        **Permission:** `browser:read` @ `browser/{browserId}`
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  scripts:
                    type: array
                    items: { $ref: '#/components/schemas/Script' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      operationId: createBrowserScript
      summary: Save a script
      tags: [Scripts]
      description: |
        Stores an automation this browser can replay later.

        A script is a repeatable sequence, so work you have already proven can be
        run again without an agent deciding it afresh each time. That makes it
        cheaper and, more usefully, predictable.

        **Permission:** `browser:use` @ `browser/{browserId}`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Required.
                source:
                  type: string
                  description: Required. The script body.
                description: { type: string }
                timeoutMs:
                  type: integer
                  description: |
                    How long a run may take before it is abandoned. A default
                    applies when omitted, and a per-run value overrides this.
              required: [name, source]
      responses:
        '201':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  script: { $ref: '#/components/schemas/Script' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /browsers/{browserId}/scripts/{scriptId}:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
      - name: scriptId
        in: path
        required: true
        description: |
          IDs come from
          [List scripts](/docs/api-reference/browsers/scripts/listBrowserScripts).
        schema: { type: string }

    get:
      operationId: getBrowserScript
      summary: Get a script
      tags: [Scripts]
      description: |
        One script, including its body.

        **Permission:** `browser:read` @ `browser/{browserId}`
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  script: { $ref: '#/components/schemas/Script' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such script on this browser.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

    patch:
      operationId: updateBrowserScript
      summary: Update a script
      tags: [Scripts]
      description: |
        Changes a saved script.

        > **There is no version history.** An edit replaces what was there, and
        > the previous body is not recoverable. Keep anything you may want back
        > outside the platform.

        **Permission:** `browser:manage` @ `browser/{browserId}`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                source: { type: string }
                description: { type: string }
                timeoutMs: { type: integer }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  script: { $ref: '#/components/schemas/Script' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such script on this browser.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      operationId: deleteBrowserScript
      summary: Delete a script
      tags: [Scripts]
      description: |
        Removes the script. Runs already finished keep their records.

        **Permission:** `browser:manage` @ `browser/{browserId}`
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such script on this browser.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /browsers/{browserId}/scripts/{scriptId}/run:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
      - name: scriptId
        in: path
        required: true
        description: |
          IDs come from
          [List scripts](/docs/api-reference/browsers/scripts/listBrowserScripts).
        schema: { type: string }
    post:
      operationId: runBrowserScript
      summary: Run a script
      tags: [Scripts]
      description: |
        Runs a saved script on this browser and waits for the result.

        ## Two kinds of failure, and they are not the same status

        This is the part to get right in a client.

        | | Means |
        | --- | --- |
        | `502` | The browser could not be reached at all. Nothing ran |
        | `200` with `ok: false` | The script ran and failed. Read `error` |

        A script that fails is a **successful request**. Branching on the status
        code alone will report a working browser as broken.

        **The browser must be awake.** Wake it first with
        [Wake the machine](/docs/api-reference/browsers/machine/wakeBrowser) if
        it may have gone to sleep.

        **Permission:** `browser:use` @ `browser/{browserId}`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceId:
                  type: string
                  description: |
                    The workspace this run belongs to. IDs come from
                    [List workspaces](/docs/api-reference/workspaces/workspaces/listWorkspaces).
                params:
                  type: object
                  additionalProperties: true
                  description: Values passed to the script.
                timeoutMs:
                  type: integer
                  description: Overrides the script's own timeout for this run.
      responses:
        '200':
          description: |
            The browser ran it. **Check `ok` before treating the run as
            successful.**
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  ok:
                    type: boolean
                    description: False when the script itself failed.
                  error: { type: string }
                  result:
                    type: object
                    additionalProperties: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such script on this browser.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: |
            The browser could not be reached. Nothing ran, so retrying is safe.
            Usually means it is asleep or still starting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /browsers/{browserId}/environment/secrets:
    parameters:
      - $ref: '#/components/parameters/BrowserId'

    get:
      operationId: listBrowserSecrets
      summary: List secrets
      tags: [Environment secrets]
      description: |
        The credential groups available to this browser.

        **Names only.** Values are never returned by any endpoint here, so this
        tells you what exists rather than what it is.

        **Permission:** `secrets:read` @ `browser/{browserId}`, plus membership
        or `browser:manage`
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  secrets:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                      additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      operationId: createBrowserSecret
      summary: Create a secret
      tags: [Environment secrets]
      description: |
        Creates a named group of credentials for this browser.

        A secret is a container. The values live in fields inside it, added
        separately, which is what lets you rotate one credential without
        touching the rest.

        **These reach the browser at boot.** A change takes effect when the
        machine next starts, not immediately. Restart it with
        [Restart the machine](/docs/api-reference/browsers/machine/restartBrowser)
        if you need the new value now.

        **Permission:** `secrets:write` @ `browser/{browserId}`, plus membership
        or `browser:manage`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Required. The group name, used to reference it later.
              required: [name]
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /browsers/{browserId}/environment/secrets/{secretName}:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
      - name: secretName
        in: path
        required: true
        description: |
          Names come from
          [List secrets](/docs/api-reference/browsers/environment-secrets/listBrowserSecrets).
        schema: { type: string }
    delete:
      operationId: deleteBrowserSecret
      summary: Delete a secret
      tags: [Environment secrets]
      description: |
        Removes the group and every field in it.

        **Anything relying on it breaks at the next boot**, not now. A running
        browser keeps the values it started with.

        **Permission:** `secrets:write` @ `browser/{browserId}`, plus membership
        or `browser:manage`
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /browsers/{browserId}/environment/secrets/{secretName}/fields:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
      - name: secretName
        in: path
        required: true
        description: |
          Names come from
          [List secrets](/docs/api-reference/browsers/environment-secrets/listBrowserSecrets).
        schema: { type: string }

    get:
      operationId: listBrowserSecretFields
      summary: List fields
      tags: [Environment secrets]
      description: |
        The field names inside a secret. **Names only, never values.**

        **Permission:** `secrets:read` @ `browser/{browserId}`, plus membership
        or `browser:manage`
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  fields:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      operationId: addBrowserSecretField
      summary: Add a field
      tags: [Environment secrets]
      description: |
        Puts a value into a secret, under a name the browser reads at boot.

        **Permission:** `secrets:write` @ `browser/{browserId}`, plus membership
        or `browser:manage`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fieldName:
                  type: string
                  description: Required. What the browser will read it as.
                value:
                  type: string
                  description: Required. Stored encrypted and never returned.
              required: [fieldName, value]
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /browsers/{browserId}/environment/secrets/{secretName}/fields/{fieldName}:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
      - name: secretName
        in: path
        required: true
        description: |
          Names come from
          [List secrets](/docs/api-reference/browsers/environment-secrets/listBrowserSecrets).
        schema: { type: string }
      - name: fieldName
        in: path
        required: true
        description: |
          Names come from
          [List fields](/docs/api-reference/browsers/environment-secrets/listBrowserSecretFields).
        schema: { type: string }

    get:
      operationId: readBrowserSecretField
      summary: Read a field
      tags: [Environment secrets]
      description: |
        Reads one field's metadata.

        **Permission:** `secrets:read` @ `browser/{browserId}`, plus membership
        or `browser:manage`
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    put:
      operationId: updateBrowserSecretField
      summary: Update a field
      tags: [Environment secrets]
      description: |
        Replaces a field's value. This is how you rotate one credential without
        disturbing the others in the group.

        Takes effect at the next boot.

        **Permission:** `secrets:write` @ `browser/{browserId}`, plus membership
        or `browser:manage`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  description: Required. The new value.
              required: [value]
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      operationId: deleteBrowserSecretField
      summary: Delete a field
      tags: [Environment secrets]
      description: |
        Removes one field, leaving the rest of the group in place.

        **Permission:** `secrets:write` @ `browser/{browserId}`, plus membership
        or `browser:manage`
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /browsers/{browserId}/namespaces:
    parameters:
      - $ref: '#/components/parameters/BrowserId'

    get:
      operationId: listBrowserNamespaces
      summary: List allocated data
      tags: [Namespaces]
      description: |
        The data this browser is allowed to reach.

        **Permission:** `browser:read` @ `browser/{browserId}`, plus membership
        or `browser:manage`
      parameters:
        - name: workspaceId
          in: query
          required: true
          description: |
            IDs come from
            [List workspaces](/docs/api-reference/workspaces/workspaces/listWorkspaces).
          schema: { type: string }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  namespaces:
                    type: array
                    items:
                      type: object
                      properties:
                        namespaceId: { type: string }
                        namespaceName: { type: string }
                      additionalProperties: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      operationId: allocateBrowserNamespace
      summary: Allocate data to a browser
      tags: [Namespaces]
      description: |
        Gives this browser access to a body of data.

        Allocation is the boundary. A browser reaches what has been allocated to
        it and nothing else, so this is the grant to be deliberate about rather
        than the permission alone.

        **Allocating the same data twice is refused**, not treated as a repeat,
        so the call is not idempotent.

        **Permission:** `browser:manage` @ `browser/{browserId}`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceId:
                  type: string
                  description: Required.
                namespaceId:
                  type: string
                  description: Required. Which body of data to allocate.
                namespaceName:
                  type: string
                  description: |
                    Required. Its name, stored alongside the ID so a listing
                    reads without a second lookup.
              required: [workspaceId, namespaceId, namespaceName]
      responses:
        '201':
          description: Allocated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '400':
          description: A field is missing, or it is already allocated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                already:
                  value:
                    success: false
                    error: Namespace already associated with this browser
                missing:
                  value:
                    success: false
                    error: namespaceId and namespaceName are required
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /browsers/{browserId}/namespaces/{namespaceId}:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
      - name: namespaceId
        in: path
        required: true
        description: |
          IDs come from
          [List allocated data](/docs/api-reference/browsers/namespaces/listBrowserNamespaces).
        schema: { type: string }

    get:
      operationId: getBrowserNamespace
      summary: Get an allocation
      tags: [Namespaces]
      description: |
        One allocation.

        **Permission:** `browser:read` @ `browser/{browserId}`, plus membership
        or `browser:manage`
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not allocated to this browser.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                missing:
                  value:
                    success: false
                    error: Namespace association not found
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      operationId: deallocateBrowserNamespace
      summary: Revoke allocated data
      tags: [Namespaces]
      description: |
        Takes the data away from this browser. The data itself is untouched.

        **Permission:** `browser:manage` @ `browser/{browserId}`
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /browsers/{browserId}/byok-config:
    parameters:
      - $ref: '#/components/parameters/BrowserId'

    get:
      operationId: getBrowserModelProvider
      summary: Get the model provider
      tags: [Model provider]
      description: |
        Which model account this browser spends when its agent works.

        **Permission:** `browser:read` @ `browser/{browserId}`, plus membership
        or `browser:manage`
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  config:
                    type: object
                    additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    put:
      operationId: updateBrowserModelProvider
      summary: Set the model provider
      tags: [Model provider]
      description: |
        Chooses whose model account this browser spends.

        **This is a manage-tier action because it decides who pays.** Pointing a
        browser at your own model account moves its spend off your platform
        credit entirely, which is why it is not a read-adjacent setting.

        **The change applies at the next boot.** The browser reads this when it
        starts, so a running browser keeps whatever it started with.

        **Permission:** `browser:manage` @ `browser/{browserId}`, plus membership
        or `browser:manage`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: The provider configuration to apply.
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /browsers/{browserId}/usage:
    parameters:
      - $ref: '#/components/parameters/BrowserId'
    post:
      operationId: reportBrowserUsage
      summary: Report usage
      tags: [Machine]
      description: |
        Records what a browser has spent on model work.

        **A browser reports its own usage and nothing else.** The browser is
        identified from the key on the request rather than the path, so a
        credential cannot record spend against a different browser even if it
        names one.

        You are unlikely to call this yourself. It exists so a running browser
        can account for its own work, and it is documented because the endpoint
        is reachable with an ordinary key.

        **Permission:** `browser:use` @ `browser/{browserId}`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: The usage to record.
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
