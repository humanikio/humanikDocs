openapi: 3.1.0

info:
  title: HumanikOS API — CRM
  version: v1
  summary: Contacts, conversations, and deals that AI employees operate directly.
  description: |
    The CRM is a native product, not a connector. An AI employee reads and
    writes it through the same public endpoints a person's browser calls,
    carrying its own service account key and passing the same permission gates.
    There is no separate agent API and no privileged path.

    That is why every endpoint here is documented once. The contract you read is
    the contract the employee is held to.

    Every fact in this document is resolved from `hos-api` source. Endpoints
    whose request or response shape has not been verified are absent rather than
    guessed at.

# `servers` is injected at load time from NEXT_PUBLIC_HOS_API_URL.
# See src/lib/openapi.ts. Do not add a host here.

security:
  - ServiceAccountKey: []

tags:
  - name: Contacts
    description: People and companies, and the thread of everything said to them.
  - name: Messaging
    description: Sending SMS and email from an allocated number or address.
  - name: Notes
    description: Free text attached to a contact.
  - name: Tags
    description: The workspace tag registry, and applying tags to a contact.
  - name: Opportunities
    description: Deals, pipelines, and stages.
  - name: Custom fields
    description: Tenant defined fields on a contact.
  - name: Email templates
    description: Reusable HTML email bodies, sent by the composer or a workflow.

components:
  securitySchemes:
    ServiceAccountKey:
      type: http
      scheme: bearer
      description: |
        A service account API key, sent whole as a bearer token:
        `hsk_<40 hex>.hss_<64 hex>`. An AI employee uses exactly this.

  parameters:
    WorkspaceId:
      name: workspaceId
      in: query
      required: true
      description: |
        Required on every endpoint unless the caller's key already carries a
        workspace scope. Omitting it returns 400.
      schema:
        type: string
        examples: [ws_a1b2c3]

    ContactId:
      name: contactId
      in: path
      required: true
      description: 'The contact. From [List contacts](/docs/api-reference/crm/contacts/listContacts), or resolve a phone number with [Find a contact by phone](/docs/api-reference/crm/contacts/findContactByPhone).'
      schema:
        type: string
        examples: [con_7f3b2a]

  schemas:
    Error:
      type: object
      description: |
        `error` is a human readable string, not a stable machine code. Branch on
        the HTTP status.
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
        message:
          type: string
      required: [success, error]

    EmailTemplate:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: |
            Assigned on create. This is the `templateId` the send body and the
            Send Email workflow node take.
        name:
          type: string
          description: Shown in the template picker.
        description:
          type: string
          description: An internal note about when to use it. Not sent.
        subject:
          type: string
          description: Supports `{{contact.*}}` tokens, rendered as text.
        html:
          type: string
          description: >
            The complete HTML email document, exactly as stored. Supports
            `{{contact.*}}` tokens, whose resolved values are escaped.
        textFallback:
          type: string
          description: >
            The plain text alternative. Absent when it is derived from the HTML
            at send time.
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
        createdBy: { type: string, readOnly: true }
        updatedBy: { type: string, readOnly: true }

    Contact:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: |
            Assigned on create. Present on responses, ignored in a request body —
            the contact to update is named in the path.
        displayName:
          type: string
          description: The full name. Falls back to a formatted phone number when no name is given.
        firstName:
          type: string
        lastName:
          type: string
        primaryPhone:
          type: string
          description: E.164. Must start with `+`.
          examples: ['+14165550137']
        email:
          type: string
        company:
          type: string
        title:
          type: string
        stage:
          type: string
        status:
          type: string
          default: active
        source:
          type: string
          default: manual
          description: Where the contact came from. Inbound messages self-create contacts with their channel here.
        optedOut:
          type: boolean
          default: false
          description: |
            Do not contact. Writable with `contact:manage`, the same grant needed
            for ordinary edits.
        tags:
          type: array
          items:
            type: string
        customFields:
          type: object
          additionalProperties: true
        lastActivityAt:
          type: string
        firstSeenAt:
          type: string
      required: [id, displayName]

    CustomFieldOption:
      type: object
      description: One choice on a `dropdown` or `multiselect` field.
      properties:
        label:
          type: string
          description: What a person sees.
        value:
          type: string
          description: |
            What is stored on the contact, and what you filter and import by.
            Values are matched exactly, so an import carrying the label instead
            of the value fails those rows.
      required: [label, value]

    CustomFieldDef:
      type: object
      description: A tenant defined field on a CRM object.
      properties:
        id:
          type: string
        objectType:
          type: string
          enum: [contact]
          description: Which object the field hangs off. Only `contact` today.
        key:
          type: string
          description: |
            The machine name, snake_case. Unique per workspace and object type.

            It does three jobs at once: it keys the value on the contact, it is
            the merge token segment in `{{contact.<key>}}`, and it is what you
            filter by. It cannot shadow a standard contact field, and it is
            **immutable after creation** because stored values, saved merge
            tokens, and automation node configs all reference it.
          examples: [lead_source]
        label:
          type: string
        type:
          type: string
          enum:
            [text, textarea, number, monetary, date, dropdown, multiselect,
             checkbox, phone, email, url]
          description: |
            **Immutable after creation.** There is no safe migration for values
            already stored under a different type.
        options:
          type: array
          description: Required for `dropdown` and `multiselect`, ignored otherwise.
          items:
            $ref: '#/components/schemas/CustomFieldOption'
        required:
          type: boolean
          description: |
            A hint for data entry surfaces. The API does not enforce it, so that
            a partial update is never rejected because some unrelated required
            field was absent from the payload.
        placeholder:
          type: string
        description:
          type: string
        order:
          type: integer
          description: Display order, ascending. Defaults to the end of the list.
        createdAt:
          type: string
        updatedAt:
          type: string
        createdBy:
          type: string
      required: [id, objectType, key, label, type, order]

    Opportunity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        pipelineId:
          type: string
          description: 'The pipeline this belongs to. From [List pipelines](/docs/api-reference/crm/opportunities/listPipelines).'
        stageId:
          type: string
          description: 'The stage within the pipeline. From [List stages](/docs/api-reference/crm/opportunities/listStages).'
        value:
          type: number
          default: 0
          description: |
            Coerced to `0` on create when not a number. **Not coerced on
            update.** See the warning on the update operation.
        status:
          type: string
        contactId:
          type: string
          description: 'The contact this belongs to. From [List contacts](/docs/api-reference/crm/contacts/listContacts).'
        contactName:
          type: string
          description: Denormalised for card display.
        ownerUserId:
          type: string
          description: 'The user who owns this record.'
        priority:
          type: string
        expectedCloseDate:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
      required: [id, name, pipelineId, stageId, value, status]

  responses:
    BadRequest:
      description: A required field is missing or malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingWorkspace:
              value:
                success: false
                error: workspaceId is required

    Unauthorized:
      description: The key is missing, unknown, inactive, or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Authenticated, but the caller lacks the required permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: |
        The record does not exist in this workspace.

        Note that the API derives this status from the service's error text
        rather than from an explicit code, so a message containing "not found"
        is what produces a 404 here. Every other failure is a 400.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServerError:
      description: Server side failure. Safe to retry with backoff.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /contacts:
    get:
      tags: [Contacts]
      summary: List contacts
      operationId: listContacts
      description: |
        Lists contacts in the workspace. Requires `contact:read`.

        Filters combine, so a status, an owner and a custom field all narrow the
        same result set. The one exception is `tag` and `customFieldKey`, which
        cannot be used together: each needs its own array membership clause and
        the datastore allows one per query. Supplying both returns 400 rather
        than quietly ignoring one.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: tag
          in: query
          required: false
          description: Contacts carrying this tag. Cannot be combined with `customFieldKey`.
          schema:
            type: string
        - name: customFieldKey
          in: query
          required: false
          description: |
            The `key` of the custom field to filter on. Must be sent together
            with `customFieldValue`. Cannot be combined with `tag`.
          schema:
            type: string
            examples: [plan_tier]
        - name: customFieldValue
          in: query
          required: false
          description: |
            The value to match, compared exactly and in full. For a `dropdown` or
            `multiselect` field this is the option's `value`, not its `label`;
            for a `checkbox` it is `true` or `false`. A `multiselect` matches when
            the value is any one of the contact's selections.

            This is an equality filter and not a search: there is no partial
            matching, and no greater than or less than comparison on number and
            date fields.
          schema:
            type: string
            examples: [enterprise]
      responses:
        '200':
          description: The workspace's contacts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  contacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Contacts]
      summary: Create a contact
      operationId: createContact
      description: |
        Creates a contact. Requires `contact:manage`.

        A name is not strictly required: `displayName` falls back to the
        formatted phone number, so a contact can be created from a number alone.
        One of `displayName`, a name part, or `primaryPhone` must be present.

        **This endpoint does not deduplicate.** Creating a second contact with a
        phone number that already belongs to another contact repoints the phone
        index at the new record, and inbound messages that would have matched the
        original are routed to the new one instead. Search before you create.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                primaryPhone:
                  type: string
                  description: Must be E.164, starting with `+`.
                email:
                  type: string
                company:
                  type: string
                title:
                  type: string
                stage:
                  type: string
                status:
                  type: string
                  default: active
                ownerUserId:
                  type: string
                  description: 'The user who owns this record.'
                customFields:
                  type: object
                  additionalProperties: true
                  description: Validated against the workspace's contact field definitions.
      responses:
        '201':
          description: The contact was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  contact:
                    $ref: '#/components/schemas/Contact'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          description: Missing workspace, no identifying field, or a malformed phone number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noIdentity:
                  value:
                    success: false
                    error: displayName, a name, or primaryPhone is required
                badPhone:
                  value:
                    success: false
                    error: primaryPhone must be E.164 (starts with +)
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /contacts/find:
    post:
      tags: [Contacts]
      summary: Find a contact by phone
      operationId: findContactByPhone
      description: |
        Resolves a phone number to a contact. Requires `contact:read`.

        Use this before creating, since create does not deduplicate.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phoneNumber:
                  type: string
                  examples: ['+14165550137']
              required: [phoneNumber]
      responses:
        '200':
          description: The match, if any.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          description: '`phoneNumber` is missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    success: false
                    error: phoneNumber is required
        '403':
          $ref: '#/components/responses/Forbidden'

  /contacts/batch:
    post:
      tags: [Contacts]
      summary: Get many contacts by id
      operationId: getContactsByIds
      description: |
        Resolves up to 200 contact ids in a single call. Requires
        `contact:read`.

        Use this when you already hold a list of ids and need the people behind
        them, for example when turning a list of workflow runs into a list of
        names. Reading them one at a time works and costs the same in reads,
        but it costs one round trip per contact.

        This is a POST because the input is a list. A hundred ids in a query
        string runs into URL length limits and writes every contact id you
        touched into access logs. Nothing is changed by this call.

        **Ids that no longer exist are left out of the response** rather than
        returned as an error or as an empty entry. A contact deleted after
        something recorded its id is normal, so check for the key rather than
        assuming every id you sent comes back.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  maxItems: 200
                  items:
                    type: string
                  description: Contact ids. Duplicates and blanks are ignored.
      responses:
        '200':
          description: |
            A map keyed by contact id. Ids that were not found are absent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  contacts:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Contact'
        '400':
          description: '`ids` is missing, not an array, or holds more than 200 entries.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tooMany:
                  value:
                    success: false
                    error: at most 200 ids per call
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /contacts/{contactId}/runs:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    get:
      tags: [Contacts]
      summary: List a contact's workflow runs
      operationId: listContactRuns
      description: |
        Every workflow this contact has been through or is currently in, newest
        first, across all workflows in the workspace. Requires `contact:read`.

        This is the reverse of
        [List runs](/docs/api-reference/workflows/runs/listWorkflowRuns), which
        starts from a workflow and tells you who is in it. Start here when you
        know the person and need to find out what is happening to them.

        Each entry carries the run and the name of the workflow it belongs to.
        A run still in progress has `status: waiting` or `running`, and
        `waitingNodeId` names the step it is paused at.

        Re entry is just another run. A contact who enters the same workflow
        three times has three entries here, so this doubles as their enrolment
        history.

        **Only runs created after 19 August 2026 appear here.** Finding runs by
        contact relies on a field the workflow runner did not write before that
        date, and older runs were not backfilled. Those runs are still readable
        through
        [Get a run](/docs/api-reference/workflows/runs/getWorkflowRun) and still
        show their contact. They just cannot be found by starting from the
        contact. An empty response therefore does not prove this contact has
        never been in a workflow.

        Capped at 50 runs.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  runs:
                    type: array
                    items:
                      type: object
                      properties:
                        run:
                          type: object
                          description: |
                            The run record. Same shape as
                            [Get a run](/docs/api-reference/workflows/runs/getWorkflowRun).
                          additionalProperties: true
                        workflowName:
                          oneOf:
                            - type: string
                            - type: 'null'
                          description: |
                            Null when the workflow has since been deleted. The
                            run is kept either way, so history does not
                            disappear when someone tidies up a workflow list.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /contacts/{contactId}:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    get:
      tags: [Contacts]
      summary: Get a contact
      operationId: getContact
      description: |
        Returns one contact. Requires `contact:read`.

        The response includes `recentNotes` alongside the contact, so a single
        call gives an employee enough context to act.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The contact, with its recent notes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  contact:
                    $ref: '#/components/schemas/Contact'
                  recentNotes:
                    type: array
                    items:
                      type: object
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      tags: [Contacts]
      summary: Update a contact
      operationId: updateContact
      description: |
        Updates a contact. Requires `contact:manage`.

        `optedOut` is writable here. It is the do not contact flag, and it takes
        the same grant as changing a job title.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contact'
      responses:
        '200':
          description: The updated contact.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags: [Contacts]
      summary: Delete a contact
      operationId: deleteContact
      description: |
        Deletes a contact. Requires `contact:manage`.

        **Opportunities linked to the contact are not deleted.** They remain in
        their pipeline referencing an id that no longer resolves. Check
        `GET /opportunities` and clean up first if that matters.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /contacts/{contactId}/archive:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    post:
      tags: [Contacts]
      summary: Archive a contact
      operationId: archiveContact
      description: Requires `contact:manage`. Prefer this to deleting.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Archived.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /contacts/{contactId}/read:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    post:
      tags: [Contacts]
      summary: Mark a conversation read
      operationId: markContactRead
      description: Requires `contact:read`, not `contact:manage`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Marked read.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400':
          $ref: '#/components/responses/BadRequest'

  /contacts/{contactId}/messages:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    post:
      tags: [Messaging]
      summary: Send an SMS to a contact
      operationId: sendContactMessage
      description: |
        Sends a text message from a phone number allocated to the workspace.
        Requires `phone:send`.

        `fromNumber` is optional and resolves automatically from the numbers
        allocated to the caller. An AI employee calls this exact endpoint with
        its own key, through the same gate.

        **The message is not previewed.** Merge tokens render server side at send
        time, so nobody sees the final text before the recipient does.

        Phone numbers are allocated in the console, not through this API.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: The message text.
                fromNumber:
                  type: string
                  description: E.164. Optional. Resolved automatically when omitted.
                senderName:
                  type: string
              required: [content]
      responses:
        '201':
          description: Sent.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /contacts/{contactId}/emails:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    post:
      tags: [Messaging]
      summary: Send an email to a contact
      operationId: sendContactEmail
      description: |
        Sends email from an address assigned to the caller. Requires
        `email:send` **or** `email:me:use`.

        Supply exactly one body: `text` for plain text, `html` for inline HTML,
        or `templateId` for a saved template. `html` may be paired with `text`,
        which then serves as the plain text alternative. Every HTML send carries
        both parts, because an HTML only message scores badly with spam filters
        and is unreadable in text only clients.

        `{{contact.*}}` merge tokens in the subject and body resolve against the
        recipient at send time. In an HTML body the resolved values are escaped.
        See [Email templates](/docs/crm/email-templates).

        The difference matters. `email:send` permits sending as any address in
        the tenant. `email:me:use` permits only addresses assigned to you, and is
        the one to grant an AI employee. The route gate is address blind; the
        handler enforces the per address constraint.

        An office resolves its own addresses from its credential, never from the
        request, so it cannot send as another office's address.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                  description: >
                    Subject line. Supports `{{contact.*}}` merge tokens. Required
                    unless `templateId` is supplied, where it overrides the
                    template's own subject.
                text:
                  type: string
                  description: >
                    Plain text body. With `html`, this becomes the plain text
                    alternative rather than the body.
                html:
                  type: string
                  description: >
                    HTML body. Sent with a plain text alternative alongside it,
                    derived from the HTML when `text` is absent.
                templateId:
                  type: string
                  description: >
                    A saved email template to send. Get one from
                    `GET /email-templates`. Read at send time, so the message
                    carries whatever the template says when it goes out.
                fromAddress:
                  type: string
                  description: Optional. Resolved from the caller's assigned addresses when omitted.
                senderName:
                  type: string
                inReplyTo:
                  type: string
                  description: Threads the reply.
      responses:
        '201':
          description: Sent.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /contacts/{contactId}/email-context:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    get:
      tags: [Messaging]
