        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Tags]
      summary: Untag a contact
      operationId: removeContactTag
      description: Accepts `contact:tag` or `contact:manage`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Untagged.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400':
          $ref: '#/components/responses/BadRequest'

  /contacts/import:
    post:
      tags: [Contacts]
      summary: Import contacts
      operationId: importContacts
      description: |
        Bulk import, up to 200 rows per call. Requires `contact:manage`.

        Unlike create, import **does** deduplicate, but only by phone. A row
        whose normalized phone already resolves to a contact is reported as
        `skipped`, so re-sending the same batch creates no duplicates. Rows
        without a phone cannot be deduplicated and always create a new contact.

        Rows are processed independently: one bad row is reported in `errors`
        and does not sink the batch. The `index` in each error is the row's
        position within this request, so a client sending several batches has to
        offset it to recover the original file row.

        Custom fields import through `customFields`, validated against the
        workspace's definitions exactly as a single create would be. A value that
        fails validation, such as a `dropdown` value that is not one of its
        options or a date that is not `YYYY-MM-DD`, fails that row rather than
        importing blank.

        Importing does not run automations. Contacts created this way do not
        trigger workflows, which is what makes it safe for loading historical
        records.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contacts:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    properties:
                      displayName: { type: string }
                      firstName: { type: string }
                      lastName: { type: string }
                      email: { type: string }
                      company: { type: string }
                      title: { type: string }
                      primaryPhone:
                        type: string
                        description: Normalized to E.164. A number that cannot be normalized fails the row.
                      customFields:
                        type: object
                        additionalProperties: true
                        description: Keyed by the field definition's `key`.
              required: [contacts]
      responses:
        '200':
          description: |
            Import result. Returns 200 even when individual rows failed: check
            `failed` and `errors` rather than the status code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  created: { type: integer }
                  skipped:
                    type: integer
                    description: Rows whose phone already belonged to a contact.
                  failed: { type: integer }
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                          description: Row position within THIS request.
                        error: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /opportunities:
    get:
      tags: [Opportunities]
      summary: List opportunities
      operationId: listOpportunities
      description: |
        Requires `opportunity:read`.

        **Unpaginated.** The whole collection is returned on every call.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The workspace's opportunities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  opportunities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Opportunity'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Opportunities]
      summary: Create an opportunity
      operationId: createOpportunity
      description: |
        Requires `opportunity:manage`.

        `value` is coerced: anything that is not a number is stored as `0`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                pipelineId:
                  type: string
                  description: 'The pipeline this belongs to. From [List pipelines](/docs/api-reference/crm/opportunities/listPipelines).'
                stageId:
                  type: string
                  description: 'The stage within the pipeline. From [List stages](/docs/api-reference/crm/opportunities/listStages).'
                value:
                  type: number
                contactId:
                  type: string
                  description: 'The contact this belongs to. From [List contacts](/docs/api-reference/crm/contacts/listContacts).'
                ownerUserId:
                  type: string
                  description: 'The user who owns this record.'
                priority:
                  type: string
                expectedCloseDate:
                  type: string
                description:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
              required: [name, pipelineId, stageId]
      responses:
        '201':
          description: Created.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /opportunities/{opportunityId}:
    parameters:
      - name: opportunityId
        in: path
        required: true
        description: 'The opportunity. From [List opportunities](/docs/api-reference/crm/opportunities/listOpportunities).'
        schema:
          type: string
    get:
      tags: [Opportunities]
      summary: Get an opportunity
      operationId: getOpportunity
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The opportunity.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400':
          $ref: '#/components/responses/BadRequest'
    patch:
      tags: [Opportunities]
      summary: Update an opportunity
      operationId: updateOpportunity
      description: |
        Requires `opportunity:manage`.

        **`value` is not validated on update.** Create coerces a non numeric
        `value` to `0`, and reads default it to `0`, but update writes whatever
        it is given. Send a string here and the stored document holds a string
        while every API response reports `0`, permanently and silently. Always
        send a number.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                stageId:
                  type: string
                  description: 'The stage within the pipeline. From [List stages](/docs/api-reference/crm/opportunities/listStages).'
                value:
                  type: number
                  description: Must be a number. Not validated. See the warning above.
                status:
                  type: string
                priority:
                  type: string
                expectedCloseDate:
                  type: string
                description:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Updated.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Opportunities]
      summary: Delete an opportunity
      operationId: deleteOpportunity
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400':
          $ref: '#/components/responses/BadRequest'

  /opportunities/pipelines:
    get:
      tags: [Opportunities]
      summary: List pipelines
      operationId: listPipelines
      description: Requires `opportunity:read`. Unpaginated.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The workspace's pipelines.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Opportunities]
      summary: Create a pipeline
      operationId: createPipeline
      description: Requires `opportunity:manage`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '201':
          description: Created.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400':
          $ref: '#/components/responses/BadRequest'

  /opportunities/pipelines/{pipelineId}:
    parameters:
      - name: pipelineId
        in: path
        required: true
        description: 'The pipeline. From [List pipelines](/docs/api-reference/crm/opportunities/listPipelines).'
        schema:
          type: string
    patch:
      tags: [Opportunities]
      summary: Update a pipeline
      operationId: updatePipeline
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Updated.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [Opportunities]
      summary: Delete a pipeline
      operationId: deletePipeline
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400':
          $ref: '#/components/responses/BadRequest'

  /opportunities/stages:
    get:
      tags: [Opportunities]
      summary: List stages
      operationId: listStages
      description: |
        A flat stage list, optionally for one pipeline. Requires
        `opportunity:read`.

        Returns `{ "success": true, "stages": [] }` rather than an error when
        the pipeline has no stages or does not exist.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: pipelineId
          in: query
          required: false
          description: 'The pipeline. From [List pipelines](/docs/api-reference/crm/opportunities/listPipelines).'
          schema:
            type: string
      responses:
        '200':
          description: The stages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  stages:
                    type: array
                    items:
                      type: object
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400':
          $ref: '#/components/responses/BadRequest'

  /custom-fields:
    get:
      tags: [Custom fields]
      summary: List custom field definitions
      operationId: listCustomFields
      description: |
        Lists the workspace's field definitions for one object type, ordered by
        `order` then label.

        Requires `contact:read`, not the manage right. Anyone who can view a
        contact needs these definitions to make sense of its values, so reading
        the schema travels with reading the data.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: objectType
          in: query
          required: false
          description: Defaults to `contact`, which is the only value today.
          schema:
            type: string
            enum: [contact]
      responses:
        '200':
          description: The definitions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  fields:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomFieldDef'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      tags: [Custom fields]
      summary: Create a custom field definition
      operationId: createCustomField
      description: |
        Requires `customField:manage`, a different action from `contact:manage`.
        Defining a field is schema work; filling one in is not.

        `key` is derived from `label` when omitted ("Lead Source" becomes
        `lead_source`). Choose it deliberately: `key` and `type` can never be
        changed afterwards.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                objectType:
                  type: string
                  enum: [contact]
                  default: contact
                label:
                  type: string
                key:
                  type: string
                  description: |
                    Optional. Derived from `label` when absent. snake_case,
                    starting with a letter. Rejected when it collides with a
                    standard contact field or with another field in this
                    workspace.
                type:
                  type: string
                  enum:
                    [text, textarea, number, monetary, date, dropdown,
                     multiselect, checkbox, phone, email, url]
                options:
                  type: array
                  description: Required for `dropdown` and `multiselect`.
                  items:
                    $ref: '#/components/schemas/CustomFieldOption'
                required:
                  type: boolean
                placeholder:
                  type: string
                description:
                  type: string
                order:
                  type: integer
              required: [label, type]
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  field:
                    $ref: '#/components/schemas/CustomFieldDef'
        '400':
          description: |
            Validation failed. Also returned when the key is already in use in
            this workspace, or is reserved by a standard contact field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /custom-fields/{fieldId}:
    parameters:
      - name: fieldId
        in: path
        required: true
        description: 'The field definition. From [List custom field definitions](/docs/api-reference/crm/custom-fields/listCustomFields).'
        schema:
          type: string
    get:
      tags: [Custom fields]
      summary: Get a custom field definition
      operationId: getCustomField
      description: Requires `contact:read`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The definition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  field:
                    $ref: '#/components/schemas/CustomFieldDef'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    patch:
      tags: [Custom fields]
      summary: Update a custom field definition
      operationId: updateCustomField
      description: |
        Requires `customField:manage`.

        `key` and `type` are rejected if they differ from the current values.
        Both anchor data that already exists: stored values are keyed by `key`,
        merge tokens saved in templates and automations reference it, and a type
        change has no safe migration for values already written. Everything else
        on the definition can be edited freely.

        Sending `placeholder` or `description` as an empty string removes it.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                options:
                  type: array
                  description: Applied only to `dropdown` and `multiselect` fields.
                  items:
                    $ref: '#/components/schemas/CustomFieldOption'
                required:
                  type: boolean
                placeholder:
                  type: string
                description:
                  type: string
                order:
                  type: integer
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  field:
                    $ref: '#/components/schemas/CustomFieldDef'
        '400':
          description: |
            Validation failed. Also returned when `key` or `type` differ from the
            stored values, which is refused rather than migrated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      tags: [Custom fields]
      summary: Delete a custom field definition
      operationId: deleteCustomField
      description: |
        Requires `customField:manage`.

        The definition is removed immediately and the response returns as soon as
        it is gone. The field's stored values are then cleared from every contact
        that carried one, in the background. On a large workspace that clearing
        continues for a few minutes after this call returns, so a contact read
        immediately afterwards may still show the old value.

        This is not reversible. Recreating a field with the same key gives you a
        new, empty field.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /contacts/token-fields:
    get:
      tags: [Email templates]
      summary: List contact merge tokens
      operationId: listContactTokenFields
      description: |
        Every `{{contact.*}}` merge token this workspace can resolve: the built
        in fields, plus the custom fields the workspace has defined.

        **Call this before writing a template or a message body.** Custom field
        keys are defined per workspace and appear in no fixed list, so a token
        written from memory may not exist. A token that does not resolve is not
        an error. It is delivered to the recipient as the literal text
        `{{contact.whatever}}`.

        A field the contact has not filled in resolves to an empty string, so
        copy has to read correctly when it is blank. Write "Hi
        {{contact.first_name}}," rather than "Your company, {{contact.company}},
        needs this", which reads as "Your company, , needs this".

        Requires `contact:read` **or** `workflow:read`. The second is there
        because someone who builds workflows needs this vocabulary for a message
        body without necessarily holding any contact permission.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The workspace's merge token vocabulary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  standard:
                    type: array
                    description: Built in contact fields, the same in every workspace.
                    items:
                      type: object
                      properties:
                        key: { type: string, example: first_name }
                        label: { type: string, example: First name }
                        token:
                          type: string
                          description: The literal token to write.
                          example: '{{contact.first_name}}'
                  custom:
                    type: array
                    description: Fields this workspace has defined.
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
                        token: { type: string }
                        type:
                          type: string
                          description: The field's type, as defined in the workspace.
                        options:
                          type: array
                          description: Allowed values, for dropdown and multiselect fields.
                          items:
                            type: object
                            properties:
                              value: { type: string }
                              label: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /email-templates:
    get:
      tags: [Email templates]
      summary: List email templates
      operationId: listEmailTemplates
      description: |
        Lists the workspace's email templates, ordered by name.

        **This is where a `templateId` comes from.** Every other operation here
        takes one, as does `POST /contacts/{contactId}/emails` and the Send
        Email workflow node.

        Requires `email:read` **or** `email:me:use`. A sender restricted to their
        own address still has to be able to see the templates they may send.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The workspace's templates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  templates:
                    type: array
                    items: { $ref: '#/components/schemas/EmailTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Email templates]
      summary: Create an email template
      operationId: createEmailTemplate
      description: |
        Creates a template. The body is a complete HTML email document.

        Email clients are not browsers. Use tables for layout rather than flex or
        grid, put styles inline on every element rather than relying on a
        `<style>` block, keep the width to 600px, and host images at a public URL
        rather than embedding them. Scripts are stripped everywhere.

        The HTML is stored exactly as sent. It is not sanitized, because email
        markup legitimately carries the things a sanitizer removes, such as
        Outlook conditional comments and VML.

        Requires `emailTemplate:manage`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, subject, html]
              properties:
                name:
                  type: string
                  description: Shown in the template picker. Max 120 characters.
                subject:
                  type: string
                  description: >
                    Supports `{{contact.*}}` tokens. Rendered as text, not markup,
                    so values in it are not escaped. Max 500 characters.
                html:
                  type: string
                  description: >
                    A complete HTML email document. Supports `{{contact.*}}`
                    tokens, whose resolved values are escaped. Max 256 KB.
                textFallback:
                  type: string
                  description: >
                    The plain text alternative. Derived from the HTML when
                    omitted, which is usually what you want. Supply one when the
                    derived version would read badly, such as a template that is
                    mostly images and buttons.
                description:
                  type: string
                  description: An internal note about when to use it. Not sent.
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  template: { $ref: '#/components/schemas/EmailTemplate' }
        '400':
          description: >
            Missing a required field, or the HTML is over 256 KB. The message
            names which.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /email-templates/preview:
    post:
      tags: [Email templates]
      summary: Render a template
      operationId: previewEmailTemplate
      description: |
        Renders a subject and body against a contact and reports which tokens did
        not resolve.

        **Run this before saving HTML you have not sent before.** It uses the same
        resolver the send path uses, so what it returns is what would be
        delivered. `unresolvedTokens` lists anything left literal, which is how a
        misspelled field is caught before a customer sees it.

        Pass `templateId` to render a saved template, or `subject` and `html` to
        check content you have not saved yet. Inline content wins when both are
        given.

        Requires `email:read` **or** `email:me:use`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: string
                  description: A saved template, from `GET /email-templates`.
                subject:
                  type: string
                  description: Unsaved subject to render instead.
                html:
                  type: string
                  description: Unsaved HTML to render instead.
                textFallback: { type: string }
                contactId:
                  type: string
                  description: >
                    Render against this contact, from `GET /contacts`. Omit to
                    use a sample contact, whose values are obviously fictional.
      responses:
        '200':
          description: The rendered message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  preview:
                    type: object
                    properties:
                      subject: { type: string }
                      html: { type: string }
                      text:
                        type: string
                        description: The plain text part that would ship alongside the HTML.
                      contactId:
                        type: string
                        nullable: true
                        description: Null when rendered against the sample contact.
                      contactName: { type: string, nullable: true }
                      unresolvedTokens:
                        type: array
                        description: >
                          Tokens left literal. Each one would be delivered as
                          visible text. An empty array means every token resolved.
                        items: { type: string }
                        example: ['{{contact.industry}}']
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /email-templates/{templateId}:
    parameters:
      - name: templateId
        in: path
        required: true
        description: The template's ID, from `GET /email-templates`.
        schema: { type: string }
    get:
      tags: [Email templates]
      summary: Get an email template
      operationId: getEmailTemplate
      description: |
        Returns one template in full, with its tokens unresolved. This is the
        authoring view. Use `POST /email-templates/preview` to see what a
        recipient would get.

        Requires `email:read` **or** `email:me:use`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  template: { $ref: '#/components/schemas/EmailTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Email templates]
      summary: Update an email template
      operationId: updateEmailTemplate
      description: |
        Changes a template. Only the fields you send are changed, so sending
        `html` alone leaves the name and subject as they were.

        **There is no version history.** An update replaces what was there, and
        the previous content is not recoverable. Emails already sent keep their
        own rendered copy and are unaffected.

        Templates are read at send time, so this changes the next send rather
        than anything already delivered.

        Requires `emailTemplate:manage`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                subject: { type: string }
                html: { type: string, description: Max 256 KB. }
                textFallback: { type: string }
                description: { type: string }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  template: { $ref: '#/components/schemas/EmailTemplate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Email templates]
      summary: Delete an email template
      operationId: deleteEmailTemplate
      description: |
        Deletes a template.

        **Nothing is checked for references first.** A workflow's Send Email node
        still pointing at this template fails on its next run, with "Email
        template not found" naming the ID. That is deliberate: a loud failure
        per run beats scanning every workflow in the tenant on every delete. If a
        template is used by a workflow, change the node before deleting it.

        Requires `emailTemplate:manage`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
