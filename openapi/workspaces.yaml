openapi: 3.1.0

info:
  title: HumanikOS API — Workspaces
  version: v1
  summary: The container almost every permission is written against.
  description: |
    A workspace groups offices, data, automations and conversations so separate
    teams, or separate clients, can work in one account without seeing each
    other's work.

    It is also the resource nearly every permission grant names, which makes it
    the practical unit of access. Scoping someone to a single workspace is how
    you build an account where each person, or each customer, sees only their
    own.

    Start here. Almost every other endpoint in this reference takes a
    `workspaceId`, and this is where those come from.

    Every fact in this document is resolved from `hos-api` source. Endpoints
    whose request or response shape has not been verified are absent rather than
    guessed at.

# `servers` is injected at load time from NEXT_PUBLIC_HOS_API_URL.
# See src/lib/openapi.ts. Do not add a host here.

security:
  - ServiceAccountKey: []

tags:
  - name: Workspaces
    description: Creating, reading and removing the container itself.
  - name: Budgets
    description: Spending limits for one workspace, or for one employee in it.

components:
  securitySchemes:
    ServiceAccountKey:
      type: http
      scheme: bearer
      description: |
        A service account API key, sent whole as a bearer token:
        `hsk_<40 hex>.hss_<64 hex>`.

  parameters:
    WorkspaceIdPath:
      name: workspaceId
      in: path
      required: true
      description: |
        The workspace to act on. IDs come from
        [List workspaces](/docs/api-reference/workspaces/workspaces/listWorkspaces).
      schema:
        type: string
        examples: [ws_a1b2c3]

  responses:
    BadRequest:
      description: A required field is missing or malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: The key is missing, unknown, inactive, or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated, but the caller lacks the required permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such workspace in this tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              value:
                success: false
                error: Workspace not found
    ServerError:
      description: Server side failure. Safe to retry with backoff.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, const: false }
        error: { type: string }
      required: [success, error]

    Workspace:
      type: object
      description: |
        Smaller than most people expect. A workspace is a name and a timezone.
        Everything else you think of as being "in" it is a relationship held on
        the thing itself.
      properties:
        id:
          type: string
          examples: [ws_a1b2c3]
        tenantId:
          type: string
          description: The account this belongs to. Nothing crosses between accounts.
        name:
          type: string
          description: The only field an update can change.
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        timeConfig:
          type: object
          description: Absent until set, which means UTC.
          properties:
            timezone: { type: string, examples: ['America/Toronto'] }
            updatedAt: { type: string, format: date-time }
            updatedBy: { type: string }

    BudgetScope:
      description: |
        What the budget covers. Fixed at creation.

        | `kind` | Counts spend from | Can stop work in |
        | --- | --- | --- |
        | `workspace` | This workspace, including its employees | This workspace |
        | `office` | One employee, plus Nova while it works inside that employee's office | That employee |

        Account budgets also exist, but are managed only through
        [Billing](/docs/api-reference/billing/budgets/listBudgets).
      oneOf:
        - type: object
          title: Workspace
          properties:
            kind: { type: string, const: workspace }
            workspaceId:
              type: string
              description: Always the workspace in the URL.
          required: [kind]
        - type: object
          title: One employee
          properties:
            kind: { type: string, const: office }
            workspaceId:
              type: string
              description: Always the workspace in the URL.
            officeId:
              type: string
              description: |
                The employee's office. IDs come from
                [List offices](/docs/api-reference/offices/offices/listOffices).
          required: [kind, officeId]

    BudgetAlerts:
      type: object
      description: |
        Who is told as spend approaches and reaches the limit. Each threshold
        is sent **once per window**, and changing the limit, window, what is
        counted, or these alerts lets every threshold be sent again.
      properties:
        thresholds:
          type: array
          maxItems: 10
          description: |
            Fractions of `limitUsd`: `0.5` is 50 percent, `1` is the limit. Each
            value is greater than 0 and at most 2.

            When empty, a `warn` or `notify` budget still alerts at `1`. A
            `block` budget with no thresholds sends no alert.
          items: { type: number, exclusiveMinimum: 0, maximum: 2 }
        recipients:
          type: array
          maxItems: 50
          description: |
            User IDs to tell. When empty, everyone holding `billing:manage` on
            the account and this workspace's admins are told.
          items: { type: string }
        sms:
          type: boolean
          description: |
            Also send a text message at the thresholds in `smsAt`, to recipients
            who have confirmed a phone number. Defaults to false.
        smsAt:
          type: array
          maxItems: 10
          description: Which thresholds also text. Defaults to `[1]`.
          items: { type: number, exclusiveMinimum: 0, maximum: 2 }

    Budget:
      type: object
      properties:
        id: { type: string }
        name:
          type: string
          examples: [Daily model spend]
        scope: { $ref: '#/components/schemas/BudgetScope' }
        workspaceId:
          type: string
          description: The workspace the budget belongs to.
        window:
          type: string
          enum: [daily, weekly, monthly]
          description: |
            Resets at midnight on the workspace's own calendar, using its
            timezone. Weeks start on Monday. Two workspaces in different
            regions roll over at different moments.
        metric:
          type: array
          description: |
            What is counted. `platform` is model use charged to your credit,
            `byok` is model use on your own model account. The total is their
            sum.
          items:
            type: string
            enum: [platform, byok]
        limitUsd:
          type: number
          description: The limit, in US dollars.
        action:
          type: string
          enum: [block, warn, notify]
          description: |
            What happens at the limit.

            | Value | At the limit |
            | --- | --- |
            | `block` | New work is refused and running work stops |
            | `warn` | Work continues, and the run is marked as over the limit in the app |
            | `notify` | Work continues. Only the alerts are sent |
        alerts: { $ref: '#/components/schemas/BudgetAlerts' }
        enabled: { type: boolean }
        pausedUntil:
          type: [string, 'null']
          format: date-time
          description: |
            While this is in the future the budget is ignored. Pausing is done
            through [Pause a budget](/docs/api-reference/billing/budgets/pauseBudget).
        pausedBy: { type: [string, 'null'] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }

paths:
  /workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces
      tags: [Workspaces]
      description: |
        Every workspace in the account **that the caller may read**.

        This endpoint carries no permission gate of its own. Instead it checks
        `workspace:read` against each workspace individually and returns only
        those that pass. That behaviour is what makes single-workspace access
        work: a person granted a role on one workspace sees exactly one entry
        here, and has no way to learn that the others exist.

        This is also the answer to "where do I get a `workspaceId`", which
        nearly every other endpoint in this reference needs.

        **Not paginated**, and the permission check runs per workspace, so an
        account with very many will be slow rather than truncated.

        **Permission:** none to call. Results are filtered by `workspace:read`.
      responses:
        '200':
          description: OK. An empty array when the caller may read none.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  workspaces:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
              examples:
                oneOnly:
                  summary: A caller scoped to a single workspace
                  value:
                    success: true
                    workspaces:
                      - id: ws_a1b2c3
                        tenantId: tn_9f2
                        name: Northside Dental
                        createdBy: usr_11
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      operationId: createWorkspace
      summary: Create a workspace
      tags: [Workspaces]
      description: |
        Creates a workspace. Only `name` is required.

        **This is a console-scope action.** The permission is checked at
        `console`, not at any workspace, because there is no workspace to check
        against yet. A person scoped to one workspace cannot create another,
        which is what keeps a single-workspace user contained.

        Creating one does more than write a record. It also registers the
        workspace with the compute platform so offices can run in it, sets up a
        default layout, creates a `knowledgeBase` namespace with a `documents`
        bucket and a `/knowledgeBase/company/` folder for documents about your
        company, and extends existing inherited access to it.

        > **Those follow-on steps are best effort and are not retried.** A
        > workspace can exist while one of them has not completed. If a newly
        > created workspace behaves oddly, recreating it is more reliable than
        > investigating.

        **Permission:** `workspace:manage` @ `console`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Required. Not unique, so two workspaces may share a name.
                  examples: [Northside Dental]
              required: [name]
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  workspace: { $ref: '#/components/schemas/Workspace' }
        '400':
          description: '`name` is missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noName:
                  value:
                    success: false
                    error: name is required
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'

    get:
      operationId: getWorkspace
      summary: Get a workspace
      tags: [Workspaces]
      description: |
        One workspace.

        **Permission:** `workspace:read` @ `workspace/{workspaceId}`
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  workspace: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    patch:
      operationId: updateWorkspace
      summary: Rename a workspace
      tags: [Workspaces]
      description: |
        Changes the name. **That is the only field an update can change.**
        Timezone has its own endpoint, and nothing else on the record is
        writable.

        **Permission:** `workspace:manage` @ `workspace/{workspaceId}`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
              required: [name]
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  workspace: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      operationId: deleteWorkspace
      summary: Delete a workspace
      tags: [Workspaces]
      description: |
        Deletes the workspace and what it holds. Each thing is removed the way
        its own delete removes it:

        - **Deleted:** its offices (and their Humanik Cloud services), its
          databases (tables, buckets and files), workflows (parked runs are
          cancelled), Nova scheduled tasks, data source ingest URLs, calendars
          (booking links stop working), browsers, chats, settings and its
          Humanik Cloud project.
        - **Revoked:** connected third-party agents.
        - **Released and kept:** phone numbers, email addresses and Telegram
          groups. They can be given to another workspace afterwards.
        - **Removed from every person and service account:** role assignments
          on the workspace or anything in it.

        **Refused, with nothing touched (409),** while a copy is being made
        into or out of the workspace, or while one of its calendars has
        upcoming confirmed bookings. `blockers` lists every reason.

        **Stopped partway (502)** if an office or a database cannot be
        deleted. The workspace is kept so the request can be sent again;
        what was already deleted is not deleted twice. `blockers` names
        what was left.

        A large workspace can take a few minutes to answer.

        **Permission:** `workspace:manage` @ `workspace/{workspaceId}`
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  removed:
                    type: object
                    description: How many of each thing were deleted. `cloudProject` says whether the Humanik Cloud project was.
                    properties:
                      offices: { type: integer }
                      workflows: { type: integer }
                      novaCrons: { type: integer }
                      databases: { type: integer }
                      buckets: { type: integer }
                      ingestRoutes: { type: integer }
                      calendars: { type: integer }
                      browsers: { type: integer }
                      agents: { type: integer }
                      roleAssignments: { type: integer }
                      cloudProject: { type: boolean }
                  released:
                    type: object
                    description: Kept, and free to give to another workspace.
                    properties:
                      phoneNumbers: { type: array, items: { type: string } }
                      emailAddresses: { type: array, items: { type: string } }
                      telegramGroups: { type: array, items: { type: string } }
                  warnings:
                    type: array
                    items: { type: string }
                    description: Parts that did not finish. The workspace is deleted all the same.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Refused. Nothing was touched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: false }
                  error: { type: string, description: The first reason. }
                  blockers: { type: array, items: { type: string } }
        '502':
          description: Stopped partway. The workspace is kept; send the request again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: false }
                  error: { type: string }
                  blockers: { type: array, items: { type: string }, description: The offices or databases that could not be deleted. }
        '500': { $ref: '#/components/responses/ServerError' }

  /workspaces/{workspaceId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'

    post:
      operationId: duplicateWorkspace
      summary: Duplicate a workspace
      tags: [Workspaces]
      description: |
        Makes a new workspace in the same account, set up the way this one
        is. The original is not changed. See
        [Duplicating a workspace](/docs/workspaces/duplicating) for what is
        copied and why.

        **Gated twice.** The route needs `workspace:manage` on the workspace
        being copied, and the handler then needs `workspace:manage` on the
        console, the permission for creating a workspace. Each part of the
        copy then checks what it would give the copy: `office:manage` for each
        AI employee, `datasource:read` for each database, `workflow:read` for
        the workflows, `contact:read` for contacts and `opportunity:read` for
        deals. A part the caller cannot read is left out and named in the
        report's warnings; the rest is still copied.

        **The answer comes before the copying is done.** The call returns
        `202` as soon as the new workspace exists, with its ID. Its setup is
        copied over the next few minutes, and contacts, rows and files after
        that when you ask for them. Poll
        [the duplication report](/docs/api-reference/workspaces/workspaces/getWorkspaceDuplication)
        on the new workspace to see progress and the outcome.

        **Copied:** AI employees (each as a new office, through
        [Duplicate an office](/docs/api-reference/offices/offices/duplicateOffice)),
        workflows and their folders, databases with their tables and buckets,
        data sources with **new** ingest URLs, pipelines, tags, custom fields,
        email templates, channels and their members, budgets, the board and
        the bulletin, the timezone and model settings.

        **Copied only when asked:** contacts and deals (`contacts`), the rows
        of every table (`rows`) and the files in every bucket (`files`). Call
        [Preview a workspace copy](/docs/api-reference/workspaces/workspaces/getWorkspaceDuplicationPreview)
        first to see how many of each there are.

        **Never copied:** HumaChat conversations, phone numbers, email
        addresses, calendars and booking links, browsers, Telegram groups,
        and people's access to the workspace. The report lists the ones the
        original had under `notCopied`.

        **Nothing starts on its own.** Workflows and data-triggered prompts
        arrive turned off. Scheduled tasks arrive paused unless `crons` is
        `running`.

        A part that fails does not undo the others. The copy is kept and its
        report ends as `partial`. Delete it with
        [Delete a workspace](/docs/api-reference/workspaces/workspaces/deleteWorkspace)
        if you do not want it.

        Get the ID of the workspace to copy from
        [List workspaces](/docs/api-reference/workspaces/workspaces/listWorkspaces),
        and the IDs for `offices` from
        [List offices](/docs/api-reference/offices/offices/listOffices):

        ```bash
        curl "$HOS_API/offices?workspaceId=ws_a1b2c3" \
          -H "Authorization: Bearer $HOS_KEY"
        ```

        **Permission:** `workspace:manage` @ `workspace/{workspaceId}` and
        `workspace:manage` @ `console`
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 80
                  description: |
                    Name for the copy. Defaults to the original's name
                    followed by "(copy)". Longer names are cut to 80
                    characters.
                  examples: [Downtown (West)]
                offices:
                  description: |
                    Which AI employees to copy: `all` (the default), or a list
                    of office IDs from the original. If any ID is not an
                    office in the original, no AI employees are copied: the
                    `offices` step fails and names the IDs, and the rest of
                    the copy goes ahead.
                  oneOf:
                    - type: string
                      const: all
                    - type: array
                      items: { type: string, examples: [off_9c1e7d] }
                  default: all
                memory:
                  type: boolean
                  default: true
                  description: |
                    Copy each employee's memory. `false` leaves out
                    `MEMORY.md`, its memory notes and its past sessions.
                crons:
                  type: string
                  enum: [paused, running]
                  default: paused
                  description: |
                    `paused` copies every repeating scheduled task turned off.
                    `running` keeps each one on or off as it is on the
                    original, so a task that sends messages sends them from
                    both workspaces.
                contacts:
                  type: boolean
                  default: false
                  description: |
                    Copy contacts and deals, with their notes. Opt-outs and
                    unsubscribes come too, including numbers and addresses
                    that opted out without becoming a contact, so the copy
                    never messages someone who asked to stop. Conversation
                    history is not copied. A deal whose pipeline was not
                    copied is left out.
                rows:
                  type: boolean
                  default: false
                  description: |
                    Copy every row of every table into the copy's own tables.
                    Row IDs and timestamps are kept, and search embeddings are
                    copied rather than made again.
                files:
                  type: boolean
                  default: false
                  description: |
                    Copy every file in every bucket into the copy's own
                    buckets, with their extracted text and search embeddings.
                    Only the current version of each file is copied. Deleting
                    a file on one side never touches the other.
      responses:
        '202':
          description: The copy exists. Its setup is still being copied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  workspaceId:
                    type: string
                    description: The new workspace. Use it to read its duplication report.
                    examples: [ws_7f3e9a]
                  name:
                    type: string
                    examples: [Downtown (copy)]
                  jobId:
                    type: string
                    description: The copy job. Shown in the report as well; you do not need to keep it.
                  message: { type: string }
        '400':
          description: A field has the wrong type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badOffices:
                  value:
                    success: false
                    error: "offices must be 'all' or a list of office ids"
                badContacts:
                  value:
                    success: false
                    error: contacts must be true or false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            The caller lacks `workspace:manage` on the workspace, or on the
            console.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                console:
                  value:
                    success: false
                    error: 'Duplicating a workspace needs permission to create workspaces (workspace:manage on the console).'
        '404': { $ref: '#/components/responses/NotFound' }
        '500':
          description: |
            Server side failure. If the error names a new workspace, it was
            made but could not be set up: delete it, then try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/duplicate/preview:
    parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'

    get:
      operationId: getWorkspaceDuplicationPreview
      summary: Preview a workspace copy
      tags: [Workspaces]
      description: |
        How much data the optional parts of
        [Duplicate a workspace](/docs/api-reference/workspaces/workspaces/duplicateWorkspace)
        would copy: contacts, deals, table rows and files. Changes nothing.

        Each count is `null` when it could not be read. Row counts cover the
        first 200 tables; `tables` is the full number. A large workspace can
        take several seconds to answer.

        **Permission:** `workspace:manage` @ `workspace/{workspaceId}`
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  preview:
                    type: object
                    properties:
                      contacts: { type: [integer, 'null'], examples: [10809] }
                      opportunities: { type: [integer, 'null'], description: Deals., examples: [10765] }
                      rows: { type: [integer, 'null'], description: Rows across every table., examples: [11378] }
                      tables: { type: [integer, 'null'], examples: [13] }
                      files: { type: [integer, 'null'], description: Files, not counting folders., examples: [32] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /workspaces/{workspaceId}/duplication:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: |
          The copy, as returned by
          [Duplicate a workspace](/docs/api-reference/workspaces/workspaces/duplicateWorkspace).
          Not the original.
        schema:
          type: string
          examples: [ws_7f3e9a]

    get:
      operationId: getWorkspaceDuplication
      summary: Get a workspace duplication report
      tags: [Workspaces]
      description: |
        How the copying went for a workspace made by
        [Duplicate a workspace](/docs/api-reference/workspaces/workspaces/duplicateWorkspace).

        `status` is `running` until every step has run, then `done`,
        `partial` (some steps failed) or `failed` (every step failed). Poll
        until it is no longer `running`. Steps are added to `steps` as they
        finish, and `currentStep` names the one running now. While a data step
        runs, `currentStepCopied` is how many items it has copied so far.

        `interrupted` means the copying stopped before it finished, for
        example during a platform restart. What was copied is kept. Carry on
        from the last finished step with
        [Resume a workspace copy](/docs/api-reference/workspaces/workspaces/resumeWorkspaceDuplication).

        Each AI employee is copied as its own office copy. `offices` lists
        them; each one's detail is in its own
        [office duplication report](/docs/api-reference/offices/offices/getOfficeDuplication).

        `notCopied` is the list to act on: the phone numbers, email
        addresses, calendars, browsers and Telegram groups the original had,
        which the copy needs its own of, if at all.

        A workspace that was not made by duplication returns 404.

        **Permission:** `workspace:read` @ `workspace/{workspaceId}`
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  report:
                    type: object
                    properties:
                      sourceWorkspaceId:
                        type: string
                        description: The workspace that was copied.
                      sourceWorkspaceName: { type: string }
                      requestedBy:
                        type: string
                        description: The user or service account that asked for the copy.
                      status:
                        type: string
                        enum: [running, done, partial, failed, interrupted]
                      options:
                        type: object
                        description: The options the copy was made with, defaults filled in.
                        properties:
                          offices:
                            oneOf:
                              - { type: string, const: all }
                              - { type: array, items: { type: string } }
                          memory: { type: boolean }
                          crons: { type: string, enum: [paused, running] }
                          contacts: { type: boolean }
                          rows: { type: boolean }
                          files: { type: boolean }
                      stepKeys:
                        type: array
                        description: |
                          Every step, in the order they run. `contacts`, `tableRows`
                          and `files` are present only when their option was on.
                        items:
                          type: string
                          enum: [settings, crmSetup, dataStructure, sources, offices, afterOffices, workflows, display, contacts, tableRows, files, notCopied]
                      stepsTotal: { type: integer }
                      currentStep:
                        type: [string, 'null']
                        description: The step running now. `null` between steps and once the copy has finished.
                      currentStepCopied:
                        type: integer
                        description: Items the running data step has copied so far. Absent between steps.
                      steps:
                        type: array
                        description: One entry per step that has finished.
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              enum: [settings, crmSetup, dataStructure, sources, offices, afterOffices, workflows, display, contacts, tableRows, files, notCopied]
                            status:
                              type: string
                              enum: [done, failed, skipped]
                            copied:
                              type: integer
                              description: How many items the step wrote.
                            warnings:
                              type: array
                              items: { type: string }
                              description: |
                                Plain sentences, for example a data source's new ingest
                                URL, or a part left out because the caller cannot read it.
                            error:
                              type: string
                              description: Present when the step failed.
                            skippedReason:
                              type: string
                              description: Present when the step did nothing on purpose.
                      offices:
                        type: array
                        description: One entry per AI employee copied.
                        items:
                          type: object
                          properties:
                            sourceOfficeId: { type: string, description: The office in the original. }
                            officeId: { type: string, description: Its copy. Read its own report with this ID. }
                            name: { type: string }
                      notCopied:
                        type: array
                        items:
                          type: object
                          properties:
                            kind:
                              type: string
                              enum: [phoneNumber, email, calendar, browser, telegram]
                            label:
                              type: string
                              description: What it is, in words a person reads.
                      idMap:
                        type: object
                        description: |
                          For each kind of thing the copy made (`offices`, `workflows`,
                          `namespaces`, `pipelines` and so on), the original's ID mapped
                          to the copy's. Use it to find the copy of something you know
                          in the original.
                        additionalProperties:
                          type: object
                          additionalProperties: { type: string }
                      startedAt: { type: string, format: date-time }
                      finishedAt: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The workspace was not made by duplicating another workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notACopy:
                  value:
                    success: false
                    error: This workspace was not made by duplicating another workspace.
        '500': { $ref: '#/components/responses/ServerError' }

  /workspaces/{workspaceId}/duplication/resume:
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: |
          The copy whose report reads `interrupted`, as returned by
          [Duplicate a workspace](/docs/api-reference/workspaces/workspaces/duplicateWorkspace).
        schema:
          type: string
          examples: [ws_7f3e9a]

    post:
      operationId: resumeWorkspaceDuplication
      summary: Resume a workspace copy
      tags: [Workspaces]
      description: |
        Carries on a workspace copy that stopped partway. Steps that finished
        are not run again, and a step that was copying contacts, rows or files
        carries on from where it got to, so nothing is copied twice.

        Only a copy whose
        [report](/docs/api-reference/workspaces/workspaces/getWorkspaceDuplication)
        reads `interrupted` can be resumed. A copy reads `interrupted` when it
        has shown no progress for 15 minutes. Poll the report again after this
        call.

        **Permission:** `workspace:manage` @ `workspace/{workspaceId}`
      responses:
        '202':
          description: The copy is carrying on.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  jobId: { type: string }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The workspace was not made by duplicating another workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The copy is still running, or has finished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                running:
                  value:
                    success: false
                    error: The copy is still running.
                finished:
                  value:
                    success: false
                    error: The copy has finished.
        '500': { $ref: '#/components/responses/ServerError' }

  /workspaces/{workspaceId}/timeConfig:
    parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'

    get:
      operationId: getWorkspaceTimeConfig
      summary: Get the timezone
      tags: [Workspaces]
      description: |
        The workspace's timezone.

        This is not cosmetic. It decides when a daily budget resets and when
        scheduled work runs, so a workspace serving customers in another region
        should carry that region's zone.

        **Permission:** `workspace:read` @ `workspace/{workspaceId}`
      responses:
        '200':
          description: OK. Unset means UTC.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  timeConfig:
                    type: object
                    properties:
                      timezone: { type: string }
                      updatedAt: { type: string, format: date-time }
                      updatedBy: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    put:
      operationId: updateWorkspaceTimeConfig
      summary: Set the timezone
      tags: [Workspaces]
      description: |
        Sets the workspace's timezone, as an IANA name such as
        `America/Toronto`.

        Changing it moves the boundary a daily budget resets on, so a change
        mid-day can lengthen or shorten the current window once.

        **Permission:** `workspace:manage` @ `workspace/{workspaceId}`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                timezone:
                  type: string
                  description: Required. An IANA timezone name.
                  examples: ['America/Toronto']
              required: [timezone]
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  timeConfig:
                    type: object
                    properties:
                      timezone: { type: string }
        '400':
          description: '`timezone` is missing or not a string.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    success: false
                    error: timezone (string) is required
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /workspaces/{workspaceId}/budgets:
    parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'

    get:
      operationId: listWorkspaceBudgets
      summary: List budgets
      tags: [Budgets]
      description: |
        Every budget stored in this workspace: the workspace's own, and those on
        its employees. Newest first.

        Account budgets are not listed here. They are managed through
        [List budgets](/docs/api-reference/billing/budgets/listBudgets), which
        also returns each budget's spend so far in the current window.

        **Permission:** `workspace:read` @ `workspace/{workspaceId}`
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  budgets:
                    type: array
                    items: { $ref: '#/components/schemas/Budget' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      operationId: createWorkspaceBudget
      summary: Create a budget
      tags: [Budgets]
      description: |
        Creates a spending limit on model use for this workspace, or for one
        employee in it. A caller who can manage the workspace can do this
        without any access to the account's billing.

        Leave `scope` out, or send `{ "kind": "workspace" }`, for a workspace
        budget. Send `{ "kind": "office", "officeId": "..." }` for one
        employee. Get the `officeId` from
        [List offices](/docs/api-reference/offices/offices/listOffices):

        ```bash
        curl "$HOS_API/offices?workspaceId=ws_a1b2c3" \
          -H "Authorization: Bearer $HOS_KEY"
        ```

        An account budget cannot be created here. Use
        [Create a budget](/docs/api-reference/billing/budgets/createBudget),
        which needs billing permission on the account.

        <br />

        **What a budget covers, and what it does not.**

        A budget sums the kinds of model spend you select. It does **not** cover
        the cost of running machines. An office left running is not counted here
        and cannot be capped this way, so a budget is not a total spend limit
        for the workspace.

        A `block` budget at its limit refuses work with `code: "budget_exceeded"`.
        Nova returns the window, the amount used and the limit with it on
        [Send a prompt](/docs/api-reference/nova/running-nova/runNovaCycle).

        [Budgets](/docs/spend/budgets) explains the three actions, alerts, and
        how several budgets combine.

        **Permission:** `workspace:manage` @ `workspace/{workspaceId}`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: Required. A label people will recognise in an alert or a refusal.
                scope:
                  $ref: '#/components/schemas/BudgetScope'
                  description: |
                    Optional. Absent means this workspace. If `scope.workspaceId`
                    is sent it must match the URL. `kind: "account"` is refused.
                metric:
                  type: array
                  minItems: 1
                  description: |
                    Required, and not empty. Which kinds of spend to add up.

                    | Value | Counts |
                    | --- | --- |
                    | `platform` | Model use charged to your prepaid credit |
                    | `byok` | Model use on your own model account, which never touches your credit |

                    Selecting both caps model spend whoever is paying for it.
                    Capping `byok` is the notable one: it limits what your AI
                    employees may spend on an account we do not bill.
                  items:
                    type: string
                    enum: [platform, byok]
                limitUsd:
                  type: number
                  exclusiveMinimum: 0
                  description: Required. The limit in US dollars.
                window:
                  type: string
                  enum: [daily, weekly, monthly]
                  default: daily
                  description: Resets on the workspace's own calendar. Weeks start on Monday.
                action:
                  type: string
                  enum: [block, warn, notify]
                  default: block
                  description: What happens at the limit. See `action` on the budget.
                alerts:
                  $ref: '#/components/schemas/BudgetAlerts'
                enabled:
                  type: boolean
                  default: true
              required: [name, metric, limitUsd]
            examples:
              perClient:
                summary: A monthly ceiling for one workspace
                value:
                  name: Monthly model spend
                  metric: [platform, byok]
                  limitUsd: 250
                  window: monthly
              employee:
                summary: Cap one employee at $50 a month, text at the limit
                value:
                  name: Ada monthly
                  scope: { kind: office, officeId: off_9c1e7d }
                  metric: [platform, byok]
                  limitUsd: 50
                  window: monthly
                  alerts: { thresholds: [0.8, 1], recipients: [], sms: true }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  budget: { $ref: '#/components/schemas/Budget' }
        '400':
          description: |
            A field is missing or invalid, the office does not exist, or the
            scope names another workspace or the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                account:
                  value:
                    success: false
                    error: Account budgets are managed from the console billing page, not a workspace.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /workspaces/{workspaceId}/budgets/usage:
    parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'
    get:
      operationId: getWorkspaceSpend
      summary: Get current spend
      tags: [Budgets]
      description: |
        What this workspace has spent in the current day, week or month, for
        showing usage against a limit. Covers all model use in the workspace,
        including its employees, whatever any budget counts.

        Declared before the single-budget route, so `usage` is a reserved word
        here and never read as a budget id.

        **Permission:** `workspace:read` @ `workspace/{workspaceId}`
      parameters:
        - name: window
          in: query
          required: false
          description: |
            Which window to total. Defaults to `daily`. Anything unrecognised is
            treated as `daily` rather than rejected.
          schema:
            type: string
            enum: [daily, weekly, monthly]
            default: daily
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  spend:
                    type: object
                    properties:
                      workspaceId: { type: string }
                      window:
                        type: string
                        enum: [daily, weekly, monthly]
                      periodKey:
                        type: string
                        description: |
                          The local period: `YYYY-MM-DD` for a day, the Monday's
                          `YYYY-MM-DD` for a week, `YYYY-MM` for a month.
                      timezone:
                        type: string
                        description: The workspace timezone the window was cut in.
                      platformUsd:
                        type: number
                        description: Model use charged to your credit.
                      byokUsd:
                        type: number
                        description: Model use on your own model account.
                      totalUsd:
                        type: number
                        description: The two added together.
                      sessionCount: { type: integer }
                      windowStart: { type: string, format: date-time }
                      resetsAt:
                        type: string
                        format: date-time
                        description: When the window ends.
              examples:
                weekly:
                  value:
                    success: true
                    spend:
                      workspaceId: ws_a1b2c3
                      window: weekly
                      periodKey: '2026-09-28'
                      timezone: America/Toronto
                      platformUsd: 182.4
                      byokUsd: 12.75
                      totalUsd: 195.15
                      sessionCount: 311
                      windowStart: '2026-09-28T04:00:00.000Z'
                      resetsAt: '2026-10-05T04:00:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /workspaces/{workspaceId}/budgets/{budgetId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'
      - name: budgetId
        in: path
        required: true
        description: |
          The budget to act on. IDs come from
          [List budgets](/docs/api-reference/workspaces/budgets/listWorkspaceBudgets).
          A `budgetId` on a `402` from Nova can also name an account budget,
          which is not reachable here: use
          [Get a budget](/docs/api-reference/billing/budgets/getBudget) for that.
        schema:
          type: string

    get:
      operationId: getWorkspaceBudget
      summary: Get a budget
      tags: [Budgets]
      description: |
        One budget stored in this workspace: the workspace's own, or one on an
        employee in it.

        **Permission:** `workspace:read` @ `workspace/{workspaceId}`
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  budget: { $ref: '#/components/schemas/Budget' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such budget on this workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': { $ref: '#/components/responses/ServerError' }

    put:
      operationId: updateWorkspaceBudget
      summary: Update a budget
      tags: [Budgets]
      description: |
        Changes any of a budget's name, window, what it counts, limit, action,
        alerts, or whether it is enforced. Fields you leave out are kept.

        > **The scope cannot change.** Sending `scope` at all returns `400`. To
        > move a budget between the workspace and an employee, delete it and
        > create a new one.

        Setting `enabled` to false lifts a limit without losing its
        configuration. To lift it only until the window resets, use
        [Pause a budget](/docs/api-reference/billing/budgets/pauseBudget),
        which needs billing permission on the account.

        **Permission:** `workspace:manage` @ `workspace/{workspaceId}`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                window:
                  type: string
                  enum: [daily, weekly, monthly]
                metric:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [platform, byok]
                limitUsd: { type: number, exclusiveMinimum: 0 }
                action:
                  type: string
                  enum: [block, warn, notify]
                alerts: { $ref: '#/components/schemas/BudgetAlerts' }
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  budget: { $ref: '#/components/schemas/Budget' }
        '400':
          description: A field is invalid, or `scope` was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                scope:
                  value:
                    success: false
                    error: A budget scope cannot be changed. Delete the budget and create a new one.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such budget on this workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      operationId: deleteWorkspaceBudget
      summary: Delete a budget
      tags: [Budgets]
      description: |
        Removes the budget and its record of refused work. Spending is then
        limited only by the account's credit and any other budget still in
        force.

        To pause a cap and keep it, set `enabled` to false with
        [Update a budget](/docs/api-reference/workspaces/budgets/updateWorkspaceBudget)
        instead.

        **Permission:** `workspace:manage` @ `workspace/{workspaceId}`
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such budget on this workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': { $ref: '#/components/responses/ServerError' }
