          required: true
          description: |
            From
            [List connectable task accounts](/docs/api-reference/calendars/sources/listAvailableTaskSources)
            or the calendar's bound sources.
          schema: { type: string }
        - name: sourceTaskListId
          in: query
          required: true
          description: Which task list inside that account.
          schema: { type: string }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  tasks:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '400':
          description: An identifier is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                missing:
                  value:
                    success: false
                    error: accountId and sourceTaskListId query params are required
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      operationId: createCalendarTask
      summary: Create a task
      tags: [Tasks]
      description: |
        Writes a to-do to a bound task list at the provider.

        **Permission:** `calendar:use` @ `calendar/{calendarId}`, and membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: string
                  description: |
                    Required. Which bound account holds the list, from
                    [List bound sources](/docs/api-reference/calendars/sources/listCalendarSources).
                sourceTaskListId:
                  type: string
                  description: Required. Which task list inside that account.
                task:
                  type: object
                  additionalProperties: true
                  description: Required. The task, in the shape that provider expects.
              required: [accountId, sourceTaskListId, task]
      responses:
        '201':
          description: Created at the provider.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  task:
                    type: object
                    additionalProperties: true
        '400':
          description: A required field is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                missing:
                  value:
                    success: false
                    error: accountId, sourceTaskListId, and task are required
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /calendars/{calendarId}/tasks/{sourceTaskId}:
    parameters:
      - $ref: '#/components/parameters/CalendarId'
      - name: sourceTaskId
        in: path
        required: true
        description: |
          The provider's own ID for the task, from
          [List tasks](/docs/api-reference/calendars/tasks/listCalendarTasks).
        schema: { type: string }

    patch:
      operationId: updateCalendarTask
      summary: Update a task
      tags: [Tasks]
      description: |
        Changes a to-do at the provider. Completing one is a patch like any
        other.

        **Permission:** `calendar:use` @ `calendar/{calendarId}`, and membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: string
                  description: |
                    Required. Which bound account holds the list, from
                    [List bound sources](/docs/api-reference/calendars/sources/listCalendarSources).
                sourceTaskListId:
                  type: string
                  description: Required. Which task list inside that account.
                patch:
                  type: object
                  additionalProperties: true
              required: [accountId, sourceTaskListId, patch]
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  task:
                    type: object
                    additionalProperties: true
        '400':
          description: A required field is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                missing:
                  value:
                    success: false
                    error: accountId, sourceTaskListId, and patch are required
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      operationId: deleteCalendarTask
      summary: Delete a task
      tags: [Tasks]
      description: |
        Removes a to-do at the provider.

        **Permission:** `calendar:use` @ `calendar/{calendarId}`, and membership
      parameters:
        - name: accountId
          in: query
          required: true
          description: |
            Which bound account holds the list, from
            [List bound sources](/docs/api-reference/calendars/sources/listCalendarSources).
          schema: { type: string }
        - name: sourceTaskListId
          in: query
          required: true
          description: Which task list inside that account.
          schema: { type: string }
      responses:
        '200':
          description: Deleted at the provider.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /calendars/{calendarId}/preferences:
    parameters:
      - $ref: '#/components/parameters/CalendarId'

    get:
      operationId: getCalendarPreferences
      summary: Get display preferences
      tags: [Preferences]
      description: |
        The caller's own view settings for this calendar. Per caller, not shared.

        **Permission:** `calendar:read` @ `calendar/{calendarId}`, plus membership
        or `calendar:manage`
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  preferences:
                    type: object
                    additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    put:
      operationId: updateCalendarPreferences
      summary: Set display preferences
      tags: [Preferences]
      description: |
        Saves the caller's own view settings.

        > **This write is gated on `calendar:read`, not `calendar:manage`.** That
        > is deliberate rather than an oversight: preferences belong to the
        > caller and affect nobody else, so anyone who may look at the calendar
        > may set how they look at it.

        **Permission:** `calendar:read` @ `calendar/{calendarId}`, plus membership
        or `calendar:manage`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  preferences:
                    type: object
                    additionalProperties: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /calendars/{calendarId}/booking-links:
    parameters:
      - $ref: '#/components/parameters/CalendarId'

    get:
      operationId: listBookingLinks
      summary: List booking links
      tags: [Booking links]
      description: |
        The shareable booking pages on this calendar.

        > **Booking links are governed by permission alone.** Unlike events and
        > tasks, there is no membership check on this route family, so a caller
        > with `calendar:read` on the calendar can list its links without being a
        > member. Worth knowing when deciding who gets that role.

        **Permission:** `calendar:read` @ `calendar/{calendarId}`
      parameters:
        - name: type
          in: query
          required: false
          description: |
            `event-type` for a reusable page, `single-use` for a one-time link.
          schema: { type: string, enum: [event-type, single-use] }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, used, expired, revoked] }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  links:
                    type: array
                    items: { $ref: '#/components/schemas/BookingLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      operationId: createBookingLink
      summary: Create a booking link
      tags: [Booking links]
      description: |
        Creates a page someone outside your account can open to pick a slot. A
        booking made there becomes an event on this calendar, and can start an
        automation.

        Only `name` is required. Everything else has a sensible default, so the
        shortest useful call is one field.

        **Bind a source first.** A calendar with nothing bound has nowhere to put
        the booking, and creating a link on one is refused.

        **Permission:** `calendar:manage` @ `calendar/{calendarId}`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Required. Also used to derive the slug when you send none.
                slug:
                  type: string
                  description: |
                    The public part of the URL. Derived from `name` when omitted.
                    Three to sixty-four characters, lowercase letters, digits and
                    hyphens.

                    **Slugs are unique across the whole platform.** A name in use
                    elsewhere is rejected even though it is not in use by you, so
                    prefer something specific over something generic.
                description: { type: string }
                host:
                  type: string
                  description: Who the booking is with, as shown on the page.
                timezone:
                  type: string
                  description: |
                    IANA name. Defaults to the calendar's timezone, then `UTC`.
                    An unrecognised zone is rejected.
                durationMin:
                  type: integer
                  description: How long a booking runs. Defaults to 30.
                slotIntervalMin:
                  type: integer
                  description: How far apart offered slots start. Defaults to 30.
                bufferBeforeMin:
                  type: integer
                  description: Gap kept before each booking. Defaults to 0.
                bufferAfterMin:
                  type: integer
                  description: Gap kept after each booking. Defaults to 0.
                minNoticeMin:
                  type: integer
                  description: |
                    How far ahead someone must book. Defaults to 240, which is
                    four hours.
                rollingWindowDays:
                  type: integer
                  description: How far into the future slots are offered. Defaults to 60.
                workingHours:
                  type: object
                  description: |
                    When slots may fall, by weekday. **A weekday you leave out is
                    a day with no availability**, so this is the first way to
                    block time out.

                    Defaults to Monday through Friday, 09:00 to 17:00. Sending
                    this replaces that default entirely.
                  properties:
                    sun: { $ref: '#/components/schemas/TimeRanges' }
                    mon: { $ref: '#/components/schemas/TimeRanges' }
                    tue: { $ref: '#/components/schemas/TimeRanges' }
                    wed: { $ref: '#/components/schemas/TimeRanges' }
                    thu: { $ref: '#/components/schemas/TimeRanges' }
                    fri: { $ref: '#/components/schemas/TimeRanges' }
                    sat: { $ref: '#/components/schemas/TimeRanges' }
                dateOverrides:
                  type: object
                  description: |
                    Per-date exceptions, keyed `YYYY-MM-DD`. A date listed here
                    **replaces** that day's working hours entirely rather than
                    adding to them, and an empty array means the day is closed.

                    This is how you block out a specific date: send `[]` for it.
                  additionalProperties:
                    $ref: '#/components/schemas/TimeRanges'
                  examples:
                    - '2026-12-25': []
                      '2026-08-14': [{ start: '09:00', end: '12:00' }]
                maxPerDay:
                  type: integer
                  default: 0
                  description: |
                    Most bookings allowed on one day. `0` means no cap, which is
                    the default.

                    > **A capped day cannot be rescheduled within itself.** A
                    > booking being moved still counts toward the day it is
                    > leaving, so moving one to a later slot on the same day is
                    > refused once the cap is reached. Moving it to another day
                    > works.
                maxPerSlot:
                  type: integer
                  default: 1
                  description: |
                    Most bookings allowed at the same start time. **Defaults to
                    1**, so a slot disappears once someone takes it. Raise it for
                    something several people join at once, or set `0` for no cap.
                conference:
                  type: string
                  enum: [meet, teams, none]
                  default: none
                  description: |
                    Whether a meeting link is created with the booking. Defaults
                    to `none`.

                    **Only Google Meet is attached at creation.** Selecting
                    `teams` records the choice and does not produce a link on the
                    booking, so treat Meet as the one that works end to end
                    today.
                form:
                  type: object
                  description: |
                    The questions asked on the booking page. Sending this
                    **replaces** the default set of name, email, phone and notes
                    rather than adding to it, so include the ones you still want.

                    > **`required` is not enforced when a booking is made.** It
                    > marks a field required on the page, and a request that
                    > omits it is still accepted. Validate anything you depend on
                    > yourself.
                  properties:
                    fields:
                      type: array
                      items:
                        type: object
                        properties:
                          key: { type: string }
                          label: { type: string }
                          type:
                            type: string
                            enum: [text, email, phone, textarea, select]
                          required: { type: boolean }
                        required: [key, label, type, required]
                  required: [fields]
                confirmation:
                  type: object
                  description: |
                    What the booker sees after booking. Defaults to a message
                    reading "Your booking is confirmed."

                    A `redirect` sends the browser to `value`, which must be a
                    full `http://` or `https://` address. Where the booking page
                    is embedded in a site with the embed script, the page around
                    the widget navigates rather than the widget itself. See
                    [Embedding a booking page](/docs/calendars/embedding).
                  properties:
                    type:
                      type: string
                      enum: [message, redirect]
                    value:
                      type: string
                      description: The message to show, or the URL to send them to.
                writeTarget:
                  type: object
                  additionalProperties: true
                  description: |
                    Which bound source the booking is written to. Defaults to the
                    calendar's own default destination.
              required: [name]
            examples:
              minimal:
                summary: The shortest useful call
                value:
                  name: Intro call
              tuned:
                summary: A tighter booking window
                value:
                  name: Intro call
                  slug: northside-intro
                  durationMin: 20
                  minNoticeMin: 1440
                  rollingWindowDays: 14
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  link: { $ref: '#/components/schemas/BookingLink' }
        '400':
          description: |
            A field is invalid, the slug is taken or malformed, or the calendar
            has no bound source.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                badSlug:
                  value:
                    success: false
                    error: 'slug must be 3–64 chars: lowercase letters, digits, hyphens'
                noSource:
                  value:
                    success: false
                    error: Bind a source to this calendar before creating a booking link
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /calendars/{calendarId}/booking-links/{linkId}:
    parameters:
      - $ref: '#/components/parameters/CalendarId'
      - name: linkId
        in: path
        required: true
        description: |
          IDs come from
          [List booking links](/docs/api-reference/calendars/booking-links/listBookingLinks).
        schema: { type: string }

    get:
      operationId: getBookingLink
      summary: Get a booking link
      tags: [Booking links]
      description: |
        One booking page and its settings.

        **Permission:** `calendar:read` @ `calendar/{calendarId}`
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  link: { $ref: '#/components/schemas/BookingLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such link on this calendar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

    patch:
      operationId: updateBookingLink
      summary: Update a booking link
      tags: [Booking links]
      description: |
        Changes a booking page's settings.

        **Changes apply to future bookings only.** Anything already booked keeps
        the terms it was booked under.

        **Permission:** `calendar:manage` @ `calendar/{calendarId}`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: The fields to change, in the shape create accepts.
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  link: { $ref: '#/components/schemas/BookingLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      operationId: deleteBookingLink
      summary: Delete a booking link
      tags: [Booking links]
      description: |
        Removes the page and everything derived from it.

        > **A link with bookings still ahead of it returns `409`, not `404`.**
        > That is a refusal rather than a failure: it means the link exists and
        > deleting it would strand people who have already booked. Send
        > `?force=true` to delete anyway.

        To stop new bookings while keeping what is booked, use
        [Enable or disable a booking link](/docs/api-reference/calendars/booking-links/setBookingLinkEnabled)
        instead.

        **Permission:** `calendar:manage` @ `calendar/{calendarId}`
      parameters:
        - name: force
          in: query
          required: false
          description: Send `true` to delete despite upcoming bookings.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such link on this calendar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            The link has upcoming bookings. Retry with `?force=true` if you mean
            to delete it regardless.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /calendars/{calendarId}/booking-links/{linkId}/enabled:
    parameters:
      - $ref: '#/components/parameters/CalendarId'
      - name: linkId
        in: path
        required: true
        description: |
          IDs come from
          [List booking links](/docs/api-reference/calendars/booking-links/listBookingLinks).
        schema: { type: string }
    patch:
      operationId: setBookingLinkEnabled
      summary: Enable or disable a booking link
      tags: [Booking links]
      description: |
        Turns a booking page on or off without deleting it.

        Disabling stops new bookings and leaves existing ones alone, which makes
        it the safe way to pause something you intend to bring back.

        **Permission:** `calendar:manage` @ `calendar/{calendarId}`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Required, and must be a boolean.
              required: [enabled]
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  link: { $ref: '#/components/schemas/BookingLink' }
        '400':
          description: '`enabled` is missing or not a boolean.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                missing:
                  value:
                    success: false
                    error: 'body { enabled: boolean } required'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /calendars/{calendarId}/booking-links/{linkId}/single-use:
    parameters:
      - $ref: '#/components/parameters/CalendarId'
      - name: linkId
        in: path
        required: true
        description: |
          The reusable link to mint from. IDs come from
          [List booking links](/docs/api-reference/calendars/booking-links/listBookingLinks).
        schema: { type: string }
    post:
      operationId: generateSingleUseLink
      summary: Mint a single-use link
      tags: [Booking links]
      description: |
        Creates a one-time link from an existing booking page. It works once and
        then stops.

        Useful for sending someone a specific invitation rather than a page
        anyone could book from.

        **The new link is a snapshot.** It copies the parent's settings at the
        moment it is minted, so later changes to the parent do not reach links
        already sent.

        **Permission:** `calendar:manage` @ `calendar/{calendarId}`
      responses:
        '201':
          description: Minted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  link: { $ref: '#/components/schemas/BookingLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ── Public booking ─────────────────────────────────────────────────────────
  # No auth on any of these: `security: []` overrides the document default.
  # The slug or the manage token IS the credential.

  /public/booking/{slug}:
    parameters:
      - $ref: '#/components/parameters/BookingSlug'
    get:
      operationId: getPublicBookingLink
      summary: Read a public booking page
      tags: [Public booking]
      security: []
      description: |
        The settings a booking page needs in order to render: its name, how long
        the meeting runs, the timezone its hours are written in, and the
        questions it asks.

        **No key.** Anyone holding the address can call this, which is the point
        of a booking page. Reusable slugs are readable and guessable by design;
        one-time slugs are 144 bits of randomness.

        **Deliberately partial.** Availability rules, caps and the destination
        account are never returned. A caller learns what to show a booker and
        nothing about how the calendar behind it is configured.
      responses:
        '200':
          description: The page's public settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  link:
                    type: object
                    properties:
                      slug: { type: string, examples: [intro-call] }
                      type:
                        type: string
                        enum: [event-type, single-use]
                        description: A reusable page, or a one-time link that stops working after one booking.
                      name: { type: string, examples: [Intro call] }
                      description: { type: string }
                      host:
                        type: string
                        description: A free text label for who the meeting is with. Not an identifier.
                      durationMin: { type: integer, examples: [30] }
                      timezone:
                        type: string
                        description: |
                          IANA zone the host's working hours are written in. Slot
                          times are absolute, so this is for display only.
                        examples: [America/Toronto]
                      conference:
                        type: string
                        enum: [meet, teams, none]
                      form:
                        type: object
                        description: The questions to ask. `name` and `email` are always present.
        '404': { $ref: '#/components/responses/LinkNotFound' }
        '410': { $ref: '#/components/responses/LinkUnavailable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      operationId: bookSlot
      summary: Book a slot
      tags: [Public booking]
      security: []
      description: |
        Creates the appointment on the provider account behind the link, invites
        the booker, and returns the handle they use to change it later.

        **The time is re-checked live, not against the listing.** Slot listings
        come from a cache that a cron keeps fresh. This call reads the provider
        directly and re-runs the same availability rules, so a time that filled
        between listing and booking is refused with `409` rather than
        double-booked. Send a `startMs` exactly as returned by
        [List open slots](/docs/api-reference/calendars/public-booking/listPublicBookingSlots);
        a time that is merely inside working hours is not enough.

        **A one-time link is consumed here**, atomically and just before the
        provider write. Two people racing the same one-time link produce exactly
        one booking; the loser gets `410`. If the provider write then fails, the
        link is released rather than burnt.

        **Only `email` is validated.** Questions the link marks as required are
        enforced by the booking page, not by this endpoint, so a direct caller
        can omit them.

        **Keep `manageToken`.** It is the only way back to this booking, and it
        is not recoverable from any other endpoint. Rarely, the appointment is
        created but its record is not: the response is still `201`, the booking
        is real, and `manageToken` is **absent** with a confirmation message
        telling the booker to contact the host instead. Treat a missing token as
        "booked, not changeable here" rather than as a failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startMs:
                  type: integer
                  description: |
                    Start of the chosen slot, epoch milliseconds, exactly as
                    returned by the slots endpoint.
                  examples: [1785500000000]
                form:
                  type: object
                  additionalProperties: true
                  description: |
                    Answers keyed by question key. `email` is required. `name` is
                    asked by every page and used to title the appointment.
                  examples:
                    - name: Ada Lovelace
                      email: ada@example.com
                tz:
                  type: string
                  description: |
                    The booker's own timezone. Recorded for display only and
                    ignored when computing the appointment.
                  examples: [Europe/London]
              required: [startMs, form]
            examples:
              standard:
                summary: Book a listed slot
                value:
                  startMs: 1785500000000
                  form:
                    name: Ada Lovelace
                    email: ada@example.com
                  tz: Europe/London
      responses:
        '201':
          description: Booked. The appointment exists on the provider.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  sourceEventId:
                    type: string
                    description: The event's identifier at the provider.
                  startMs: { type: integer }
                  endMs: { type: integer }
                  manageToken:
                    type: string
                    description: |
                      Handle for changing this booking. Absent in the rare case
                      described above. Store it: nothing else returns it.
                  confirmation:
                    type: object
                    description: |
                      What to show the booker. `redirect` means send them to
                      `value` instead of rendering a message.
                    properties:
                      type: { type: string, enum: [message, redirect] }
                      value: { type: string }
        '400':
          description: '`startMs` is missing or not a number, or `email` is absent.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/LinkNotFound' }
        '409':
          description: |
            That time is no longer available. Re-fetch the slots and offer the
            booker a different one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410': { $ref: '#/components/responses/LinkUnavailable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500':
          description: The calendar has no destination account bound.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/ProviderWriteFailed' }
        '503':
          description: |
            A one-time link could not be reserved because another request holds
            it. Safe to retry once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /public/booking/{slug}/slots:
    parameters:
      - $ref: '#/components/parameters/BookingSlug'
    get:
      operationId: listPublicBookingSlots
      summary: List open slots
      tags: [Public booking]
      security: []
      description: |
        Open start times in a window, with everything already committed on the
        bound accounts removed.

        **Times are absolute instants.** Localise them for display and send them
        back unchanged. Re-deriving a start time from a wall clock is how a
        booking lands an hour out across a daylight-saving boundary.

        **Served from cache.** A cron keeps it fresh, so a listing can be a few
        minutes stale. That is deliberate: listing is cheap and frequent, and
        [Book a slot](/docs/api-reference/calendars/public-booking/bookSlot)
        pays for a live provider read instead.

        An event marked free rather than busy does not remove a slot, so a day
        held open with a placeholder still takes bookings.
      parameters:
        - name: from
          in: query
          required: true
          description: Start of the window, epoch milliseconds.
          schema: { type: integer, examples: [1785000000000] }
        - name: to
          in: query
          required: true
          description: |
            End of the window, epoch milliseconds. Must be after `from`, and the
            window must be 62 days or less.
          schema: { type: integer, examples: [1787592000000] }
      responses:
        '200':
          description: Open slots, ascending. An empty array means nothing is free in the window.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  slots:
                    type: array
                    items:
                      type: object
                      properties:
                        startMs: { type: integer, examples: [1785500000000] }
                        endMs: { type: integer, examples: [1785501800000] }
        '400':
          description: '`from` or `to` is missing or not a number, `to` is not after `from`, or the window is longer than 62 days.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/LinkNotFound' }
        '410': { $ref: '#/components/responses/LinkUnavailable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /public/booking/manage/{token}:
    parameters:
      - $ref: '#/components/parameters/ManageToken'
    get:
      operationId: getBookingByToken
      summary: Read a booking
      tags: [Public booking]
      security: []
      description: |
        What the booker sees on their own page: when the appointment is, whether
        it still stands, and whether they may still change it.

        **Times come from the real event, not from a stored copy.** If the host
        drags the appointment to a different time in Google or Outlook, that is
        the time returned here.

        Use `slug` to fetch fresh slots when offering a reschedule.
      responses:
        '200':
          description: The booking.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  booking:
                    type: object
                    properties:
                      name: { type: string, examples: [Intro call] }
                      slug:
                        type: string
                        description: The link this was booked through, for fetching slots to reschedule into.
                      startMs: { type: integer }
                      endMs: { type: integer }
                      durationMin: { type: integer }
                      timezone: { type: string }
                      status:
                        type: string
                        enum: [confirmed, cancelled, rescheduled]
                      canReschedule:
                        type: boolean
                        description: False once the booking is cancelled, in the past, or its link has been deleted.
                      canCancel:
                        type: boolean
                        description: False once the booking is cancelled or in the past.
        '404': { $ref: '#/components/responses/LinkNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /public/booking/manage/{token}/reschedule:
    parameters:
      - $ref: '#/components/parameters/ManageToken'
    post:
      operationId: rescheduleBooking
      summary: Move a booking
      tags: [Public booking]
      security: []
      description: |
        Moves the appointment to another open time and notifies everyone on it.

        The new time goes through the same live check as a first booking, so it
        must be a real opening at the moment of the call.

        **A day with a cap cannot be rescheduled within itself.** A booking being
        moved still counts toward the day it is leaving, so once that day's cap
        is reached, moving to a later slot on the same day is refused. Another
        day works.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startMs:
                  type: integer
                  description: |
                    The new start, epoch milliseconds, from
                    [List open slots](/docs/api-reference/calendars/public-booking/listPublicBookingSlots)
                    for this booking's `slug`.
                  examples: [1785600000000]
              required: [startMs]
      responses:
        '200':
          description: Moved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  startMs: { type: integer }
                  endMs: { type: integer }
        '400':
          description: '`startMs` is missing or not a number.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No booking with this token, or the link it was booked through no longer exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Either the booking is cancelled or already in the past, or the
            requested time is not available.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500':
          description: The booking has no recorded destination account, so it cannot be moved here.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/ProviderWriteFailed' }

  /public/booking/manage/{token}/cancel:
    parameters:
      - $ref: '#/components/parameters/ManageToken'
    post:
      operationId: cancelBooking
      summary: Cancel a booking
      tags: [Public booking]
      security: []
      description: |
        Deletes the appointment at the provider and notifies everyone on it.

        Cancelling frees the slot for somebody else and releases it from the
        link's daily and per-slot caps.

        No body. The token is the whole request.
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '404': { $ref: '#/components/responses/LinkNotFound' }
        '409':
          description: The booking is already cancelled, or it is in the past.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500':
          description: The booking has no recorded destination account, so it cannot be cancelled here.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/ProviderWriteFailed' }
